# Hunter Community Edition (AtomCode Unified v3.0.0) · 默认编排(**只用预构建镜像**)
#
# `git clone` 之后直接 `docker compose up -d` 就能起,不需要先改 .env、
# 也不需要本地构建 —— 自家服务全部走 GHCR 上的预构建镜像。
#
# 开发者要改代码 / 改静态文件并立即生效,叠加开发覆盖文件:
#     docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# 或使用服务器源码一键部署栈:
#     bash deploy/up.sh

name: hunter-community

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    <<: *restart
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hunter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hunter}
      POSTGRES_DB: ${POSTGRES_DB:-hunter}
    volumes:
      - hunter_pg_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5442}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hunter}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    <<: *restart
    ports:
      - "${REDIS_HOST_PORT:-6479}:6379"
    volumes:
      - hunter_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ${HUNTER_REGISTRY:-ghcr.io/agentpit-io}/hunter-community-api:${HUNTER_VERSION:-3.0.0}
    <<: *restart
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      HUNTER_BIND_HOST: "${HUNTER_BIND_HOST:-0.0.0.0}"
      HUNTER_MINIMAL_BOOT: "${HUNTER_MINIMAL_BOOT:-1}"
      DATABASE_URL: postgresql://${POSTGRES_USER:-hunter}:${POSTGRES_PASSWORD:-hunter}@postgres:5432/${POSTGRES_DB:-hunter}
      FIN_PAPER_PASSWORD: "${FIN_PAPER_PASSWORD:-}"
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-3600}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-2592000}
      HUNTER_SETUP_TOKEN: ${HUNTER_SETUP_TOKEN:-}
      HUNTER_SINGLE_USER: ${HUNTER_SINGLE_USER:-1}
      HUNTER_LOCAL_USER_EMAIL: ${HUNTER_LOCAL_USER_EMAIL:-local@hunter.local}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-open}
      HUNTER_ADMIN_EMAILS: ${HUNTER_ADMIN_EMAILS:-}
      HUNTER_INTERNAL_KEY: ${HUNTER_INTERNAL_KEY:-}
      HUNTER_API_KEY: ${HUNTER_API_KEY:-}
      SCREEN_SCAN_GAP_S: ${SCREEN_SCAN_GAP_S:-5}
      HUNTER_UPSTREAM_URL: ${HUNTER_UPSTREAM_URL:-}
      DATA_SOURCE_PROVIDER: ${DATA_SOURCE_PROVIDER:-}
      HUNTER_SAAS_DATA_URL: ${HUNTER_SAAS_DATA_URL:-}
      HUNTER_SAAS_DATA_KEY: ${HUNTER_SAAS_DATA_KEY:-}
      FINDATA_DB_URL: ${FINDATA_DB_URL:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compat}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-}
      LLM_SCHEMA_SANITIZE: ${LLM_SCHEMA_SANITIZE:-}
      ONE_API_MODEL: ${ONE_API_MODEL:-}
      AGENT_SUB_WL_MODEL: ${AGENT_SUB_WL_MODEL:-}
      AGENT_SUB_PORT_MODEL: ${AGENT_SUB_PORT_MODEL:-}
      AGENT_SUB_RESEARCH_MODEL: ${AGENT_SUB_RESEARCH_MODEL:-}
      AGENT_SUB_EVENT_MODEL: ${AGENT_SUB_EVENT_MODEL:-}
      AGENT_MODEL_ROUTER: ${AGENT_MODEL_ROUTER:-}
      AGENT_MODEL_ROUTE_LITE: ${AGENT_MODEL_ROUTE_LITE:-}
      SIGNAL_ANALYSIS_MODEL: ${SIGNAL_ANALYSIS_MODEL:-}
      ASSISTANT_MODEL_ROUTE: ${ASSISTANT_MODEL_ROUTE:-}
      ASSISTANT_MODEL_CHAT: ${ASSISTANT_MODEL_CHAT:-}
      ASSISTANT_MODEL_COMPRESS: ${ASSISTANT_MODEL_COMPRESS:-}
      HTTP_PROXY: ${HTTP_PROXY_UPSTREAM:-}
      HTTPS_PROXY: ${HTTPS_PROXY_UPSTREAM:-}
      NO_PROXY: ${NO_PROXY_UPSTREAM:-localhost,127.0.0.1,api,web,postgres,redis,daemon,llm-shim,paper,fin-worker,temporal}
      FORECAST_PROVIDER: ${FORECAST_PROVIDER:-}
      KRONOS_LOCAL_URL: ${KRONOS_LOCAL_URL:-}
      HUNTER_SAAS_KRONOS_URL: ${HUNTER_SAAS_KRONOS_URL:-}
      HUNTER_SAAS_KRONOS_KEY: ${HUNTER_SAAS_KRONOS_KEY:-}
      HUNTER_SKILLS_DIR: /opt/hunter-skills
      HUNTER_USER_SKILLS_DIR: /opt/hunter-user-skills
      AGENT_BACKEND: atomcode
      ATOMCODE_DAEMON_URL: http://daemon:13456
      ATOMCODE_TOKEN_FILE: /run/hca/daemon-token
      LLM_SHIM_URL: ${LLM_SHIM_URL:-http://llm-shim:3999/v1}
      FIN_MEMORY_ENABLED: "${FIN_MEMORY_ENABLED:-1}"
      FIN_EVOLUTION_MODE: "${FIN_EVOLUTION_MODE:-paper}"
      FIN_AUTO_APPLY: "${FIN_AUTO_APPLY:-1}"
      FIN_LIVE_ORDER_ENABLED: "${FIN_LIVE_ORDER_ENABLED:-0}"
      PAPER_BASE_URL: ${PAPER_BASE_URL:-http://paper:8000}
      FIN_WORKER_URL: ${FIN_WORKER_URL:-http://fin-worker:8300}
    group_add:
      - "10001"
    volumes:
      - hunter_daemon_token:/run/hca:ro
      - hunter_user_skills:/opt/hunter-user-skills
      - hunter_packages:/opt/hunter-packages
      - hunter_secrets:/opt/hunter-secrets
      - hunter_experiments:/var/lib/hunter/experiments
    ports:
      - "${API_HOST_PORT:-8100}:8000"

  paper:
    image: ${HUNTER_REGISTRY:-ghcr.io/agentpit-io}/hunter-community-paper:${FIN_TAG:-3.0.0}
    <<: *restart
    profiles: ["fin"]
    depends_on:
      postgres: { condition: service_healthy }
      api: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://fin_paper_rw:${FIN_PAPER_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-hunter}
      PAPER_MODE: PAPER
      HUNTER_INTERNAL_KEY: ${HUNTER_INTERNAL_KEY:-}
      HUNTER_EXEC_KEY: ${HUNTER_EXEC_KEY:-}
      PAPER_QUOTE_URL: ${PAPER_QUOTE_URL:-http://api:8000}
      PAPER_SNAPSHOT_STALE_SECONDS: ${PAPER_SNAPSHOT_STALE_SECONDS:-900}
    ports:
      - "127.0.0.1:${PAPER_HOST_PORT:-8200}:8000"

  temporal:
    image: temporalio/auto-setup:1.25
    <<: *restart
    profiles: ["fin"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-hunter}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-hunter}
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    ports:
      - "127.0.0.1:${TEMPORAL_HOST_PORT:-7233}:7233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 12

  temporal-ui:
    image: temporalio/ui:2.34.0
    <<: *restart
    profiles: ["fin"]
    depends_on:
      temporal: { condition: service_started }
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:${TEMPORAL_UI_HOST_PORT:-8233}
    ports:
      - "127.0.0.1:${TEMPORAL_UI_HOST_PORT:-8233}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  fin-worker:
    image: ${HUNTER_REGISTRY:-ghcr.io/agentpit-io}/hunter-community-fin-worker:${FIN_TAG:-3.0.0}
    <<: *restart
    profiles: ["fin"]
    depends_on:
      paper: { condition: service_started }
      temporal: { condition: service_started }
    environment:
      PAPER_BASE_URL: ${PAPER_BASE_URL:-http://paper:8000}
      API_BASE_URL: ${FIN_WORKER_API_BASE_URL:-http://api:8000}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-fin-trading}
      HUNTER_INTERNAL_KEY: ${HUNTER_INTERNAL_KEY:-}
      HUNTER_EXEC_KEY: ${HUNTER_EXEC_KEY:-}
      FIN_WORKER_HTTP_PORT: "8300"
      FIN_SAMPLE_CODE: ${FIN_SAMPLE_CODE:-601398}
      FIN_SAMPLE_STRATEGY_KEY: ${FIN_SAMPLE_STRATEGY_KEY:-sample-fixed}
      FIN_SAMPLE_STRATEGY_VERSION: ${FIN_SAMPLE_STRATEGY_VERSION:-1.0}
      FIN_INTENT_TTL_SECONDS: ${FIN_INTENT_TTL_SECONDS:-1800}
      FIN_SCHEDULES_ENABLED: ${FIN_SCHEDULES_ENABLED:-1}
      FIN_REVIEW_DELAY_MINUTES: ${FIN_REVIEW_DELAY_MINUTES:-30}
      FIN_SHADOW_DELAY_MINUTES: ${FIN_SHADOW_DELAY_MINUTES:-15}
      FIN_OBSERVE_DELAY_MINUTES: ${FIN_OBSERVE_DELAY_MINUTES:-30}
      FIN_PROPOSE_DELAY_MINUTES: ${FIN_PROPOSE_DELAY_MINUTES:-2}
      FIN_MEMORY_ENABLED: "${FIN_MEMORY_ENABLED:-1}"
      FIN_EVOLUTION_MODE: "${FIN_EVOLUTION_MODE:-paper}"
      FIN_AUTO_APPLY: "${FIN_AUTO_APPLY:-1}"
      FIN_LIVE_ORDER_ENABLED: "${FIN_LIVE_ORDER_ENABLED:-0}"
    ports:
      - "127.0.0.1:${FIN_WORKER_HOST_PORT:-8300}:8300"

  web:
    image: ${HUNTER_REGISTRY:-ghcr.io/agentpit-io}/hunter-community-web:${HUNTER_VERSION:-3.0.0}
    <<: *restart
    depends_on:
      - api
      - daemon
    environment:
      HOSTNAME: "${HUNTER_BIND_HOST:-0.0.0.0}"
      NODE_ENV: production
      AGENT_BACKEND: atomcode
      ATOMCODE_DAEMON_URL: http://daemon:13456
      ATOMCODE_TOKEN_FILE: /run/hca/daemon-token
      ATOMCODE_WORKSPACE: /workspace
      HCA_LLM_MODEL_LABEL: ${HCA_LLM_MODEL_LABEL:-}
      HCA_LLM_PROVIDER_LABEL: ${HCA_LLM_PROVIDER_LABEL:-}
      HERMES_API_URL: http://api:8000
      HUNTER_INTERNAL_KEY: ${HUNTER_INTERNAL_KEY:-}
    group_add:
      - "10001"
    ports:
      - "${WEB_HOST_PORT:-3100}:3000"
    volumes:
      - hunter_daemon_token:/run/hca:ro
      - hunter_secrets:/opt/hunter-secrets:ro

  llm-shim:
    image: ${HUNTER_REGISTRY:-ghcr.io/agentpit-io}/hunter-community-llm-shim:${HUNTER_VERSION:-3.0.0}
    <<: *restart
    environment:
      HUNTER_BIND_HOST: "${HUNTER_BIND_HOST:-0.0.0.0}"
      LLM_BASE_URL: ${LLM_BASE_URL:-https://hunter.agentpit.io/api/saas/llm/v1}
      LLM_FIX_TOOL_INDEX: "1"
      LLM_STRIP_THINK: "1"
      LLM_TOOL_DENY: "${HCA_LLM_TOOL_DENY-atomgit_*,code_review,ast_grep,read_symbol,list_symbols,find_references,trace_callers,trace_callees,trace_chain,blast_radius,file_dependencies,lsp,list_sessions,schedule_wakeup,recall}"
      HTTP_PROXY: ${HTTP_PROXY_UPSTREAM:-}
      HTTPS_PROXY: ${HTTPS_PROXY_UPSTREAM:-}
      NO_PROXY: ${NO_PROXY_UPSTREAM:-localhost,127.0.0.1,api,web,postgres,redis,daemon,llm-shim}

  daemon:
    image: ${HUNTER_REGISTRY:-ghcr.io/agentpit-io}/hunter-community-daemon:${HUNTER_VERSION:-3.0.0}
    <<: *restart
    depends_on:
      api:
        condition: service_healthy
      llm-shim:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "13456"
    environment:
      HCA_DAEMON_PORT: "13456"
      HCA_DAEMON_INTERNAL_PORT: "13457"
      HCA_DAEMON_SERVICE_NAME: daemon
      HCA_WORKSPACE: /workspace
      ATOMCODE_HOME: /data/atomcode
      HCA_WORKSPACE_REFRESH: "1"
      HCA_CONFIG_REFRESH: "1"
      HCA_HOOKD: "1"
      HCA_HOOKD_PORT: "13458"
      ATOMCODE_VERIFY: "off"
      ATOMCODE_TODO: "0"
      ATOMCODE_SUBAGENT: "0"
      ATOMCODE_MEMORY_TOOL: "0"
      ATOMCODE_REQUEST_USER_INPUT: "0"
      ATOMCODE_TURN_MAX_ROUNDS: "30"
      ATOMCODE_AI_SESSION_NAMING: "0"
      HCA_LLM_BASE_URL: ${LLM_SHIM_URL:-http://llm-shim:3999/v1}
      HCA_LLM_MODEL: ${LLM_DEFAULT_MODEL:-hunter-chat}
      HCA_LLM_PROVIDER_NAME: ${LLM_PROVIDER:-hunter}
      HCA_LLM_CONTEXT_WINDOW: "1000000"
      HCA_LLM_API_KEY: ${LLM_API_KEY:-${HUNTER_API_KEY:-}}
      HCA_LLM_SYSTEM_PROMPT_FILE: ${HCA_LLM_SYSTEM_PROMPT_FILE:-/opt/hca/personas/hunter-research.md}
      HCA_TOOLS_DENY: ${HCA_TOOLS_DENY:-group:codeintel,group:atomgit,group:subagent,code_review,ast_grep,list_sessions,schedule_wakeup,recall,web_fetch,web_search,glob,grep,search_replace,open_file}
      HERMES_API_URL: http://api:8000
      FIN_WORKER_URL: ${FIN_WORKER_URL:-http://fin-worker:8300}
      HUNTER_INTERNAL_KEY: ${HUNTER_INTERNAL_KEY:-}
      AKSHARE_MAX_ROWS: "50"
      AKSHARE_MAX_BYTES: "15000"
      HCA_MCP_MAX_BYTES: "15000"
      KRONOS_API_KEY: ${HUNTER_SAAS_KRONOS_KEY:-${HUNTER_API_KEY:-}}
      HUNTER_API_KEY: ${HUNTER_API_KEY:-}
      HCA_LANG_HOOK: "1"
      HCA_CTX_CAPABILITIES: "1"
    volumes:
      - hunter_workspace:/workspace
      - hunter_atomcode_home:/data
      - hunter_daemon_token:/run/hca
      - hunter_secrets:/opt/hunter-secrets:ro
    init: true
    security_opt:
      - no-new-privileges:true

volumes:
  hunter_experiments:
  hunter_pg_data:
  hunter_redis_data:
  hunter_workspace:
  hunter_atomcode_home:
  hunter_daemon_token:
  hunter_user_skills:
  hunter_packages:
  hunter_secrets:
