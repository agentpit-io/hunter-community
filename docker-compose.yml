# Hunter Community Edition · P1 skeleton
# `docker compose up` boots: postgres + redis + api (minimal) + web
# opencode service is TODO · pending ghcr.io/agentpit-io/hunter-opencode image (see doc 08)
#
# P1 goal: services come up healthy without SaaS deps.
# P2 will strip SaaS routers and un-set HUNTER_MINIMAL_BOOT.

name: hunter-community

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    <<: *restart
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hunter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hunter}
      POSTGRES_DB: ${POSTGRES_DB:-hunter}
    volumes:
      - hunter_pg_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_HOST_PORT:-5442}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hunter}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    <<: *restart
    ports:
      - "${REDIS_HOST_PORT:-6479}:6379"
    volumes:
      - hunter_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    <<: *restart
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # P1 · skip heavy startup schedulers so a fresh clone boots healthy
      HUNTER_MINIMAL_BOOT: "${HUNTER_MINIMAL_BOOT:-1}"
      DATABASE_URL: postgresql://${POSTGRES_USER:-hunter}:${POSTGRES_PASSWORD:-hunter}@postgres:5432/${POSTGRES_DB:-hunter}
      REDIS_URL: redis://redis:6379/0
      # Local auth (P3) · JWT signing + registration policy
      # api 和 opencode 必须用**同一个** JWT_SECRET:api 签发的 token 要由
      # opencode 的 hunter-auth 插件验签才能认出用户。两边取值不同的话服务照常
      # 启动,只是对话莫名 401 —— 与其留这种哑故障,不如缺了就拒绝启动。
      JWT_SECRET: ${JWT_SECRET:?请在 .env 里设置 JWT_SECRET · 生成方法见 README「跑起来」第 2 步}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-3600}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-2592000}
      # 单用户模式(默认开)· 本机自用不需要账号密码,前端自动换会话不显示登录页
      # 暴露到公网前务必置 0 —— 开着等于谁都能拿到 admin token
      HUNTER_SINGLE_USER: ${HUNTER_SINGLE_USER:-1}
      HUNTER_LOCAL_USER_EMAIL: ${HUNTER_LOCAL_USER_EMAIL:-local@hunter.local}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-open}
      HUNTER_ADMIN_EMAILS: ${HUNTER_ADMIN_EMAILS:-}
      # MCP 回调 /api/internal/* 的共享口令 · **必须与 opencode 容器同值**
      # 两边都空时恰好也能对上,但那等于没有认证,所以给个默认值
      HUNTER_INTERNAL_KEY: ${HUNTER_INTERNAL_KEY:-hunter-internal-local}
      # 平台 key · 解锁左侧全部工具与 SKILL(免费申请 hunter.agentpit.io/dev/api-keys)
      # 留空也能跑:聊天用你自己的 LLM key,工具则在 UI 左下角「解锁全部工具」里填 key
      HUNTER_API_KEY: ${HUNTER_API_KEY:-}
      # 独立运行模式 · 兜底默认改成空 · .env 里显式清空即真清空 · 不再默默指回平台
      HUNTER_UPSTREAM_URL: ${HUNTER_UPSTREAM_URL:-}
      # P4 · pluggable providers
      # 默认留空 = 自动选:配了 key 走 hunter 网关,没配则 akshare(A股免 key)
      DATA_SOURCE_PROVIDER: ${DATA_SOURCE_PROVIDER:-}
      HUNTER_SAAS_DATA_URL: ${HUNTER_SAAS_DATA_URL:-}
      HUNTER_SAAS_DATA_KEY: ${HUNTER_SAAS_DATA_KEY:-}
      # 预测回测三张表(pred_snapshot/pred_backtest/pred_consistency)默认走 finance-data
      # 库。留空则 /api/backtest/* 一律返 503。独立部署时若想让 hunter-community
      # 自足(见 db/migrations/0004_pred_backtest.sql 已建的本地表),把这里指向本地
      # postgres:postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      FINDATA_DB_URL: ${FINDATA_DB_URL:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compat}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-gpt-4o-mini}
      # Sub-agent 独立 env · 代码里 20+ 处硬编码 fallback = gemini-3-flash-preview
      # 换基座 LLM 时必须一并透传,否则 DeepSeek/Anthropic 会 400 拒绝 gemini 模型名
      # → tool 累计重试 > 45s → MCP ReadTimeout → 前端"hermes-api call failed"。
      ONE_API_MODEL: ${ONE_API_MODEL:-}
      AGENT_SUB_WL_MODEL: ${AGENT_SUB_WL_MODEL:-}
      AGENT_SUB_PORT_MODEL: ${AGENT_SUB_PORT_MODEL:-}
      AGENT_SUB_RESEARCH_MODEL: ${AGENT_SUB_RESEARCH_MODEL:-}
      AGENT_SUB_EVENT_MODEL: ${AGENT_SUB_EVENT_MODEL:-}
      AGENT_MODEL_ROUTER: ${AGENT_MODEL_ROUTER:-}
      AGENT_MODEL_ROUTE_LITE: ${AGENT_MODEL_ROUTE_LITE:-}
      SIGNAL_ANALYSIS_MODEL: ${SIGNAL_ANALYSIS_MODEL:-}
      ASSISTANT_MODEL_ROUTE: ${ASSISTANT_MODEL_ROUTE:-}
      ASSISTANT_MODEL_CHAT: ${ASSISTANT_MODEL_CHAT:-}
      ASSISTANT_MODEL_COMPRESS: ${ASSISTANT_MODEL_COMPRESS:-}
      # HTTP 代理透传(Mac Docker Desktop 场景 · 宿主机开了 clash/verge TUN 时)
      # 容器直连外网被 TUN 劫持后超时 · 显式走宿主机代理绕开。
      # NO_PROXY 必须列出所有内部服务名,否则 api → postgres/redis/opencode 也会
      # 试图走代理 → ECONNREFUSED。留空则不注入,不影响非代理环境。
      HTTP_PROXY: ${HTTP_PROXY_UPSTREAM:-}
      HTTPS_PROXY: ${HTTPS_PROXY_UPSTREAM:-}
      NO_PROXY: ${NO_PROXY_UPSTREAM:-localhost,127.0.0.1,api,web,postgres,redis,opencode,llm-shim}
      # 默认留空,让代码去决定(app/providers/forecast/__init__.py → kronos_saas)。
      # **别在这里写 noop** —— compose 的 :- 对"未设"和"设为空"一视同仁,
      # 用户 .env 里留空时这里会把 noop 塞进容器,代码层的默认值永远轮不到生效,
      # 表现是"改了默认值却不起作用",极难排查。
      FORECAST_PROVIDER: ${FORECAST_PROVIDER:-}
      KRONOS_LOCAL_URL: ${KRONOS_LOCAL_URL:-}
      HUNTER_SAAS_KRONOS_URL: ${HUNTER_SAAS_KRONOS_URL:-}
      HUNTER_SAAS_KRONOS_KEY: ${HUNTER_SAAS_KRONOS_KEY:-}
      # SKILL 现在是 skills/ 下的标准 SKILL.md 文件(_14 Step A),api 要读它们
      HUNTER_SKILLS_DIR: /opt/hunter-skills
      HUNTER_USER_SKILLS_DIR: /opt/hunter-user-skills
      # api 写完 user-skills 之后要让 opencode 重扫(它只在启动时扫一次)。
      # 之前这三个只给了 web,api 打过去是 401 —— 而 401 跟"镜像旧没这端点"
      # 是两回事,不区分的话会把配置问题误报成版本问题。
      OPENCODE_URL: http://opencode:3901
      OPENCODE_SERVER_USERNAME: ${OPENCODE_USER:-}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_PASS:-}
    volumes:
      # SKILL 标准文件 · 我们发的 + 用户自己加的(同名时用户覆盖)
      # 内置能力只读 —— api **永远不该改它们**。
      # "恢复默认永远改不坏"这条,靠的就是内置层物理只读。
      - ./skills:/opt/hunter-skills:ro
      # 用户能力**可写** —— UI 里新建/编辑/删除 SKILL 要往这里写文件
      # (_19 §5.2)。opencode 那边仍然是 :ro,它只读不写。
      - ./user-skills:/opt/hunter-user-skills
      # 推荐安装的 SKILL 清单(`_24` §5.4)· 只读。
      # 挂载而不是打进镜像:换推荐不用重建,而且用户 fork 之后
      # 改成他们团队的推荐位是改一个 JSON 就生效
      - ./data:/opt/hunter-data:ro
      # 数据包 · 可读写。
      #
      # 用户把从云盘下载的 .tar 拖进 ./data-packages/ 就能在「数据」页
      # 看到并导入;我们这边打包也写到这里。
      #
      # 为什么不放 ./data 下面:那个是 :ro(内置数据不该被改),而打包
      # 要写。而且混在一起以后分不清哪个是随代码分发的、哪个是用户放的。
      - ./data-packages:/opt/hunter-packages
    ports:
      - "${API_HOST_PORT:-8100}:8000"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        # 构建期烘进前端产物 · 留空则走同源 /api/*（反代部署）
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    <<: *restart
    depends_on:
      - api
    environment:
      NODE_ENV: production
      # ── chat 依赖 · web 的 BFF 要反代到 opencode 容器 ──────────────────
      # 这几个都必须传给 web(不只是 opencode)，否则 /chat 起不来：
      #  · OPENCODE_URL 不传 → 代码回落 http://127.0.0.1:3901，在 web 容器内
      #    那是 web 自己 → 三个 chat 端点全 ECONNREFUSED(502)
      #  · 用户名/密码不传 → BFF 拼出 "opencode:"(空密码)，而 opencode 容器
      #    要的是 ${OPENCODE_PASS} → 401
      OPENCODE_URL: http://opencode:3901
      OPENCODE_SERVER_USERNAME: ${OPENCODE_USER:-}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_PASS:-}
      # BFF 还要回调 api 查会话归属(谁能看哪个 session)。
      # 不传 → 回落 http://127.0.0.1:8000 → 503 ownership_unavailable
      HERMES_API_URL: http://api:8000
      # BFF 拦截用户上传图片后调 /api/internal/ocr/extract 抽文本 · 走共享 secret
      # 必须与 api 服务的 HUNTER_INTERNAL_KEY 同源 · 缺了 OCR 会 401 · image → text 兜底走"OCR 失败"分支
      HUNTER_INTERNAL_KEY: ${HUNTER_INTERNAL_KEY:-hunter-internal-local}
    ports:
      - "${WEB_HOST_PORT:-3100}:3000"
    # Phase D-3 · public/ 目录 volume mount · 本地改 HTML/JS 立即生效
    # · 免每次都 docker cp · 参见 doc 13 §4.3
    volumes:
      - ./apps/web/public:/app/public:ro

  # opencode 送出的 tool schema 是完整 JSON Schema,Gemini 只认 OpenAPI 子集,
  # 收到 $schema / additionalProperties 之类会整个请求报错 —— 表现是"一发消息就没回复"。
  # 这一层只洗 tools[].function.parameters,其余原样转发。见 scripts/llm-shim/shim.py。
  # 不需要时(provider 本来就吃全量 JSON Schema)设 LLM_SCHEMA_SANITIZE=0,
  # gen-config 就会让 opencode 直连 LLM_BASE_URL,这个容器空转不影响。
  llm-shim:
    image: python:3.12-alpine
    <<: *restart
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-}
    volumes:
      - ./scripts/llm-shim:/app:ro
    command: ["python3", "/app/shim.py"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:3999/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

  opencode:
    # Built by huntercode private repo via
    # .github/workflows/hunter-community-publish.yml
    image: ghcr.io/agentpit-io/hunter-opencode:${OPENCODE_TAG:-latest}
    <<: *restart
    depends_on:
      api:
        condition: service_healthy
      llm-shim:
        condition: service_healthy
    environment:
      # Basic auth kept OFF by default · hunter-auth plugin is the real gate.
      # Set both env vars to non-empty to add belt-and-suspenders auth (nginx
      # would then need to inject Basic + JWT would move to a custom header).
      OPENCODE_SERVER_USERNAME: ${OPENCODE_USER:-}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_PASS:-}
      # Shared with api container · lets hunter-auth plugin verify Bearer JWT locally
      # 与 api 容器同源 · 见上面 api 服务处的说明
      JWT_SECRET: ${JWT_SECRET:?请在 .env 里设置 JWT_SECRET · 生成方法见 README「跑起来」第 2 步}
      # MCP subprocesses reach the api container via internal docker network
      HERMES_API_URL: http://api:8000
      # Shared secret for /api/internal/* calls
      HUNTER_INTERNAL_KEY: ${HUNTER_INTERNAL_KEY:-hunter-internal-local}
      # LLM · same source of truth as api container
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compat}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-gpt-4o-mini}
      # 自部署用户付的是自己的 LLM 账单,不该被我们限额。
      # 新镜像认 HUNTER_BUDGET_ENABLED=false;旧镜像不认这个开关(插件里根本没读过),
      # 所以再用它认得的 HUNTER_BUDGET_DAILY 兜一层 —— 否则聊一阵就会撞
      # "已达日 token 上限 500000 · 明日再试",而开关明明是关的,极难排查。
      # 审计日志默认写 /opt/opencode-audit/,但容器以非 root 跑,在 /opt 下建不了目录。
      # 旧镜像会因此每写一条就抛 ENOENT 刷一屏堆栈,把真正的报错淹掉;
      # 指到 /tmp 就没事(新镜像自己会退到 tmp,这行届时是冗余的,留着无害)。
      HUNTER_AUDIT_PATH: ${HUNTER_AUDIT_PATH:-/tmp/hunter-audit/AUDIT.jsonl}
      HUNTER_BUDGET_ENABLED: ${HUNTER_BUDGET_ENABLED:-false}
      HUNTER_BUDGET_DAILY: ${HUNTER_BUDGET_DAILY:-999999999}
      HUNTER_BUDGET_PER_REQUEST: ${HUNTER_BUDGET_PER_REQUEST:-999999999}
      # auto = 模型名含 gemini 时才经 shim(见 scripts/opencode/gen-config.py)
      LLM_SCHEMA_SANITIZE: ${LLM_SCHEMA_SANITIZE:-auto}
      LLM_SHIM_URL: http://llm-shim:3999/v1
    # 镜像里插件(plugins/)和 MCP(mcp/)都齐了,唯独没有把它们串起来的 opencode.json,
    # 而 opencode 只认配置文件里的 provider、不认 LLM_* 环境变量 —— 不生成这个文件
    # 它会回落到内置的 OpenCode Zen,根本不去调你配的网关。
    # 所以包一层入口:启动前按 .env 现生成配置。改完 .env 重新 up 即可生效。
    volumes:
      - ./scripts/opencode:/opt/hunter-boot:ro
      # 覆盖镜像自带的 watchlist_mcp.py · 加了 watchlist_add tool 让 chat NL
      # 「加XX到自选」能直接落库,而不是回落到"点击左侧菜单"的文本兜底。
      # 详见 scripts/opencode-mcp/watchlist_mcp.py 文件头注释。
      - ./scripts/opencode-mcp/watchlist_mcp.py:/opt/opencode-workspace/mcp/watchlist_mcp.py:ro
      # 覆盖镜像自带的 hunter-mcp-context.ts · HUNTER_TOOLS Set 里加了 watchlist_add,
      # 不然 tool.execute.before hook 不注入 _hermes_user_id · api 收不到
      # X-Hunter-User-Id → 401 unauthorized · LLM 会告诉用户"请登录",很误导。
      - ./scripts/opencode-mcp/plugins/hunter-mcp-context.ts:/opt/opencode-workspace/plugins/hunter-mcp-context.ts:ro
      # 平台自有能力的 MCP(_12 Step 3)· 镜像里没有,整目录挂进来由
      # gen-config.py 注册。放 /opt/hunter-mcp 而不是覆盖 mcp/ 目录 ——
      # 覆盖会把镜像自带的 4 个脚本一起遮掉。
      - ./scripts/opencode-mcp:/opt/hunter-mcp:ro
      # SKILL 标准文件 · opencode 自己也扫描这两处(实测见 _14 §2 结论 3):
      #   .opencode/skills/            我们发的(会遮掉镜像自带的 effect skill —
      #                                那是讲 Effect TS 库的,金融场景用不上)
      #   ~/.config/opencode/skills/   用户自己加的
      - ./skills:/opt/opencode-workspace/.opencode/skills:ro
      - ./user-skills:/home/hunter/.config/opencode/skills:ro
    entrypoint: ["/bin/sh", "/opt/hunter-boot/entrypoint.sh"]
    ports:
      - "${OPENCODE_HOST_PORT:-3921}:3901"

volumes:
  hunter_pg_data:
  hunter_redis_data:
