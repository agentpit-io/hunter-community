<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>魔法筛选器 · 猎鹿人 Hunter</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="/icon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/icon.png" />
  <!-- 悬停日K 用。版本与 backtest.html / workbench.html 一致,别各引各的 -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    /* ── 悬停日K 弹层 ───────────────────────────────────
       鼠标停在代码上弹出近一年日K,左键拖动平移,滚轮缩放,十字星读数。
       用 position:fixed —— 表格自己在 .sc-scroll 里横向滚动,
       用 absolute 会跟着滚出可视区。 */
    /* 弹层样式在 style.css(公共)—— agent 页也用同一套 */
    /* 代码列:提示这里能悬停 */
    /* 对照表命中:常驻显示在折叠区外面(新功能入口不许藏进二级面板 —— 仓内铁律) */
    .kw-learned{border:1px solid #e6cbaa;background:#fdf8f2;border-radius:10px;
      padding:10px 12px;margin:10px 0;font-size:12.5px;line-height:1.7}
    .kw-learned-hd{color:var(--brand-dark,#8f4f1d);margin-bottom:6px}
    .kw-learned .kw-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:3px 0}
    .kw-learned .kw-forget{margin-left:auto;font-size:11.5px;height:24px;padding:0 9px}
    .kw-learned-tag{font-size:10.5px;color:var(--brand-dark,#8f4f1d);background:#f6eee7;
      border-radius:4px;padding:0 5px;margin-left:6px}
    .sc-tb .cd2[data-kchart]{cursor:crosshair;border-bottom:1px dotted var(--line-strong,#cfcbbf)}
    .sc-tb .cd2[data-kchart]:hover{background:var(--brand-pale,#f6eee7)}
  </style>
  <style>
    /* ── 魔法筛选(生成区) ─────────────────────────────── */
    /* 卡片也要收住:只让 .mg-ta 变窄的话,卡片仍旧铺满 2000px 的屏,
       「生成」按钮右边空出一大片死区。1040 刚好装下
       追加/替换 + 市场 + 输入框(560) + 生成 这一行。 */
    .mg{background:#F2F8FE;border:1px solid #DCEBFA;border-radius:10px;padding:13px 15px 11px;
      max-width:1040px}
    .mg-hd{display:flex;align-items:center;gap:7px;color:#2E86DE;font-size:13.5px;
      font-weight:700;letter-spacing:.04em;margin-bottom:10px}
    .mg-row{display:flex;flex-wrap:wrap;gap:9px;align-items:stretch}
    .mg-seg{display:inline-flex;background:#fff;border:1px solid #DCEBFA;border-radius:8px;padding:3px}
    .mg-seg button{border:0;background:transparent;border-radius:6px;padding:6px 15px;cursor:pointer;
      font-size:13px;font-family:inherit;color:var(--muted)}
    .mg-seg button.on{background:#EDE4F7;color:#7B3FA8;font-weight:700}
    /* 生成框**不能**只写 flex:1 —— 宽屏上它会一直撑到屏幕边,
       把「生成」按钮甩到几百像素外,视线要横跨整屏才能从输入框走到按钮。
       给一个 max-width 收住,按钮就紧跟在它后面(2026-09-10 用户指出)。 */
    .mg-ta{flex:1 1 380px;min-width:240px;max-width:560px;box-sizing:border-box;
      min-height:40px;max-height:200px;resize:vertical;
      border:1px solid #DCEBFA;border-radius:8px;padding:9px 12px;background:#fff;color:var(--text);
      font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.55}
    .mg-ta:focus{outline:none;border-color:#2E86DE}
    /* 生成按钮和它下面那排(复制脚本/清空)竖着排成一列 */
    .mg-genwrap{display:flex;flex-direction:column;gap:7px}
    .mg-gen{border:0;background:#2E86DE;color:#fff;border-radius:8px;padding:0 22px;cursor:pointer;
      font-size:14px;font-weight:600;font-family:inherit;white-space:nowrap;display:flex;
      align-items:center;gap:7px;justify-content:center;min-height:40px;flex:1}
    .mg-gen:disabled{opacity:.5;cursor:not-allowed}
    .mg-genbar{display:flex;gap:6px}
    /* nowrap 不能省 —— 两个按钮平分「生成」那 122px 的话,
       「复制脚本」会被折成「复制脚 / 本」两行(实测)。
       nowrap 之后这一列按内容撑开,生成按钮跟着一起变宽,三个仍然左右对齐。 */
    .mg-genbar .btn{flex:1;justify-content:center;white-space:nowrap;padding:5px 10px}
    .mg-genbar .btn:disabled{opacity:.45;cursor:not-allowed}
    .mg-eg{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
    .mg-eg button{display:inline-flex;align-items:center;gap:7px;background:#fff;
      border:1px solid #DCEBFA;border-radius:8px;padding:6px 12px;cursor:pointer;
      font-size:12.5px;font-family:inherit;color:var(--text)}
    .mg-eg button:hover{border-color:#2E86DE;color:#2E86DE}
    .mg-eg .ar{color:#2E86DE;font-size:12px}
    /* 系统示例:按钮 + 一个很淡的小 ✕(隐藏)。边框挪到外层,两个按钮看起来是一个整体 */
    .mg-eg .mg-sys{display:inline-flex;align-items:stretch;border:1px solid #DCEBFA;
      border-radius:8px;overflow:hidden;background:#fff}
    .mg-eg .mg-sys:hover{border-color:#2E86DE}
    .mg-eg .mg-sys button{border:0;border-radius:0;background:transparent;margin:0}
    .mg-eg .mg-sys .nm{padding:6px 5px 6px 12px}
    .mg-eg .mg-sys .hide{padding:0 7px 0 2px;font-size:10px;line-height:1;color:#c9d4e0;gap:0}
    .mg-eg .mg-sys .hide:hover{color:var(--danger,#b34b43);background:#fbeceb}
    /* 我保存的扫描策略 —— 用站内品牌棕,和系统示例的蓝色一眼能分开。
       ✕ 删除按钮**常驻可见**,不藏 hover(仓内铁律:新功能入口不许藏在 hover 里)。 */
    .mg-eg .mg-sep{width:1px;background:#DCEBFA;margin:4px 2px}
    .mg-eg .mg-mine{display:inline-flex;align-items:stretch;border:1px solid #e6cbaa;
      border-radius:8px;overflow:hidden;background:#fdf8f2}
    .mg-eg .mg-mine button{border:0;border-radius:0;background:transparent;margin:0;
      padding:6px 9px;font-size:12.5px;font-family:inherit;cursor:pointer;
      display:inline-flex;align-items:center;gap:6px}
    .mg-eg .mg-mine .nm{color:var(--brand-dark,#8f4f1d);font-weight:600;padding-left:11px}
    .mg-eg .mg-mine .nm:hover{background:#f6eee7;color:var(--brand-dark,#8f4f1d)}
    .mg-eg .mg-mine .nm .mk{font-weight:400;color:var(--muted);font-size:11px}
    .mg-eg .mg-mine .del{color:var(--soft,#a2a49d);border-left:1px solid #efe0cc;padding:6px 8px}
    .mg-eg .mg-mine .del:hover{color:var(--danger,#b34b43);background:#fbeceb}
    .mg-eg .mg-mine.on{border-color:var(--brand,#b56b2d);box-shadow:inset 0 0 0 1px var(--brand,#b56b2d)}

    /* ── 条件区 ────────────────────────────────────────── */
    .cd-hd{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:14.5px;
      color:var(--text);margin:16px 0 4px}
    .cd-hd b{font-weight:700}
    .cd-hd .mk{background:#FDF3E7;color:#A85F17;border-radius:6px;padding:2px 9px;font-size:12px;font-weight:600}
    .cd-hd .ai-badge{background:#EDE4F7;color:#7B3FA8;border-radius:6px;padding:2px 9px;
      font-size:12px;font-weight:600}
    .cd-hd .kw-badge{background:#E4F1E8;color:#2F7A52;border-radius:6px;padding:2px 9px;
      font-size:12px;font-weight:600}
    .kw-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:4px 0;
      border-bottom:1px dashed var(--line,#E8E0D6)}
    .kw-row:last-of-type{border-bottom:0}
    .kw-src{font-size:12.5px;color:var(--text);min-width:150px}
    .kw-arrow{color:var(--soft,#B9AFA2);font-size:12px}
    .kw-expr{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;
      background:#fff;border:1px solid var(--line,#E8E0D6);border-radius:5px;padding:2px 7px}
    details.ai-note{width:auto;max-width:760px;border-color:#DCEBFA;background:#F7FBFF}
    .ai-script{margin:8px 0 0;padding:9px 11px;background:#fff;border:1px solid #DCEBFA;
      border-radius:7px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;
      line-height:1.65;color:var(--text);white-space:pre-wrap;overflow-x:auto}
    .cd-list{border-left:2px dashed var(--line,#E8E0D6);padding-left:14px;margin-top:6px}
    .cd{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:7px 2px;
      border-bottom:1px solid transparent}
    .cd:hover{background:#FBFAF8}
    .cd.off{opacity:.42}
    .cd .nm{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--soft,#B9AFA2);
      min-width:112px;flex-shrink:0}
    /* body 不占 flex:1、acts 不用 margin-left:auto —— 按钮**紧跟条件内容**,
       条件写得长按钮就自然往右挪。
       原来是 `flex:1` + `margin-left:auto` 把按钮钉在最右边,条件短的时候
       中间空出一大片,眼睛要横扫整屏才能从"这条是什么"找到"这条的按钮",
       条件越短越难对上(2026-09-10 用户指出)。 */
    .cd .body{display:flex;align-items:center;flex-wrap:wrap;gap:6px;min-width:0}
    /* 不做 hover 才显形 —— 仓内铁律「入口不许藏在 hover 里」,
       而且开关的绿色本身就是"这条启不启用"的状态指示,淡化了就看不清。 */
    .cd .acts{display:flex;align-items:center;gap:3px;flex-shrink:0;margin-left:12px}
    .cd .acts button{border:0;background:transparent;cursor:pointer;padding:3px 5px;border-radius:5px;
      font-size:13px;line-height:1;color:var(--soft,#B9AFA2)}
    .cd .acts button:hover{background:#F0EBE4;color:var(--text)}
    .cd .acts button.del:hover{background:#FDECEC;color:#9B2C2C}

    .tk{font-size:13.5px}
    .tk.f{color:var(--text);font-weight:600}
    .tk.o{color:#B4429B;font-weight:600}
    .tk.l{color:#2E86DE;font-weight:700}
    .tk.p{color:var(--soft,#B9AFA2)}
    .tk.r{color:#7B3FA8;font-weight:600}
    .cd-params{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:10px 4px 4px;
      border-top:1px dashed var(--line,#E8E1D6);margin-top:6px}
    .cd-sub{font-size:12px;color:var(--soft,#9A8F80)}
    .cd-param{white-space:nowrap}
    .cd-defs{margin-top:8px}
    .cd-def{display:flex;gap:10px;align-items:baseline;padding:4px 2px;flex-wrap:wrap}
    .cd-def .nm{min-width:90px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--soft,#9A8F80)}
    .tk.k{color:var(--muted)}
    .sc-num{background:#1E2740;color:#fff;border:0;border-radius:5px;padding:3px 7px;
      font-family:ui-monospace,Menlo,monospace;font-size:12.5px;text-align:center;
      min-width:34px;font-weight:600}
    .sc-num:focus{outline:2px solid #2E86DE}
    .cd.off .sc-num{background:#9A9A9A}

    /* 选择器必须写成 `.cd .acts button.sw` —— 上面那条 `.cd .acts button{background:transparent}`
       特异性是 (0,2,1),裸 `.sw` 只有 (0,1,0),会被压掉。
       2026-09-10 实测症状:开关整个透明,只剩白色圆点浮在白底上 = 看不见,
       而 classList 和点击都正常,所以功能测试全绿也发现不了。 */
    .cd .acts button.sw{position:relative;width:32px;height:17px;border-radius:9px;
      background:#D6CFC5;cursor:pointer;flex-shrink:0;border:0;padding:0;margin:0 2px}
    .cd .acts button.sw:hover{background:#C9C1B6}
    .cd .acts button.sw.on{background:#3FB27F}
    .cd .acts button.sw.on:hover{background:#37A071}
    .cd .acts button.sw i{position:absolute;top:2px;left:2px;width:13px;height:13px;
      border-radius:50%;background:#fff;transition:left .15s}
    .cd .acts button.sw.on i{left:17px}

    /* editbox 占满一行(靠 .cd 的 flex-wrap 换行),里面的输入框只占三分之一宽 ——
       改的是一句短表达式,给一整屏宽度反而看不出光标在哪 */
    .cd-editbox{width:100%;margin-top:8px}
    .cd-edit{width:33%;min-width:300px;max-width:560px;box-sizing:border-box;
      border:1px solid #2E86DE;border-radius:7px;padding:8px 10px;
      font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--text);
      background:#fff;min-height:52px;resize:vertical;display:block}
    .cd-edit:focus{outline:none}
    .cd-editbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:7px}

    /* ── 通用 ──────────────────────────────────────────── */
    .sc-err{background:#FDECEC;border:1px solid #F3C9C9;color:#9B2C2C;border-radius:8px;
      padding:10px 13px;font-size:12.5px;line-height:1.7;margin-top:10px;white-space:pre-wrap}
    .sc-warn{background:#FDF3E7;border:1px solid #F0DCC0;color:#8A5A1B;border-radius:8px;
      padding:9px 12px;font-size:12px;line-height:1.7;margin-top:10px}
    .sc-warn ul{margin:0;padding-left:17px}
    .sc-lasthit{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:#EEF4FB;border:1px solid #D3E2F2;
      color:#27496D;border-radius:8px;padding:10px 14px;margin-top:10px;font-size:13px;line-height:1.7}
    .sc-lasthit.dim{background:transparent;border-style:dashed;color:#6B7785}
    .sc-warn li+li{margin-top:4px}
    .sc-note{color:var(--muted);font-size:11.5px;line-height:1.7;margin-top:8px}

    .sc-stat{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:10px}
    .sc-stat .s{background:var(--bg,#FAF7F3);border-radius:8px;padding:8px 12px;min-width:78px}
    .sc-stat .s .k{color:var(--muted);font-size:11px}
    .sc-stat .s .v{font-size:17px;font-weight:600;margin-top:1px;font-variant-numeric:tabular-nums}
    .sc-stat .s.hit .v{color:var(--brand-dark)}

    .sc-scroll{overflow-x:auto;border:1px solid var(--line,#E8E0D6);border-radius:8px;background:#fff}
    .sc-tb{border-collapse:collapse;width:100%;font-size:12.5px;white-space:nowrap}
    .sc-tb th,.sc-tb td{padding:7px 10px;border-bottom:1px solid var(--line,#E8E0D6);text-align:left}
    .sc-tb th{background:var(--bg,#FAF7F3);color:var(--muted);font-weight:500;font-size:11.5px;
      position:sticky;top:0;cursor:pointer;user-select:none}
    .sc-tb th .ar{color:var(--brand);margin-left:3px}
    /* 数字列的列头也要右对齐,否则列头靠左、数字靠右,宽列上看起来错开一整格(2026-09-17 用户截图) */
    .sc-tb th.n{text-align:right}
    .sc-tb td.n{text-align:right;font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
    .sc-tb tr:last-child td{border-bottom:none}
    .sc-tb .cd2{font-family:ui-monospace,Menlo,monospace;color:var(--brand-dark);font-weight:600}
    .sc-na{color:var(--soft,#B9AFA2)}

    .sc-syn{font-size:12px;line-height:1.85;color:var(--muted)}
    .sc-syn code{background:var(--bg,#FAF7F3);border-radius:4px;padding:1px 5px;
      font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--text)}
    .sc-syn b{color:var(--text);font-weight:600}
    details.sc-fold{border:1px solid var(--line,#E8E0D6);border-radius:8px;padding:9px 12px;
      margin-top:10px;background:#fff}
    details.sc-fold summary{cursor:pointer;font-size:12.5px;color:var(--text);font-weight:600}
    details.sc-fold[open] summary{margin-bottom:8px}
    .sc-fd{display:flex;gap:7px;margin-bottom:8px}
    .sc-fd input{flex:1;border:1px solid var(--line,#E8E0D6);border-radius:7px;padding:6px 10px;
      font-size:12.5px;font-family:inherit;color:var(--text);background:#fff}
    .sc-fd input:focus{outline:none;border-color:var(--brand)}
    .sc-fl{display:flex;flex-wrap:wrap;gap:5px;max-height:190px;overflow-y:auto}
    .sc-fl span{background:var(--bg,#FAF7F3);border-radius:5px;padding:3px 7px;cursor:pointer;
      font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--text)}
    .sc-fl span:hover{background:#FDF3E7;color:#A85F17}
    /* 有中文名的用正文字体(等宽体排中文很丑),并留一点标记表示可悬停看英文 */
    .sc-fl span.cn{font-family:inherit;font-size:12px;border-bottom:1px dotted var(--soft,#B9AFA2)}
    /* 族标签:一眼看出这是一组,右上角是周期个数 */
    .sc-fl span.fam{font-family:inherit;font-size:12px;background:#EDE4F7;color:#7B3FA8;
      border-bottom:0;font-weight:600}
    .sc-fl span.fam b{margin-left:5px;font-size:10px;background:#7B3FA8;color:#fff;
      border-radius:8px;padding:0 5px;font-weight:600}
    .sc-fl span.fam.on{background:#7B3FA8;color:#fff}
    .sc-fl span.fam.on b{background:#fff;color:#7B3FA8}
    .sc-fl span.sub{margin-left:2px;background:#F6F1FB}

    .sc-runbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:14px}
    /* 会员(2026-09-14):没登录时顶上常驻一条登录 / 注册提示;登录后运行栏里常驻今日剩余次数 */
    .sc-login{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:#fff6e3;
      border:1px solid #e0b56a;color:#7a4b00;border-radius:10px;padding:10px 14px;font-size:13px}
    .sc-login b{font-weight:700}
    .sc-login a.btn,.sc-gate a.btn{text-decoration:none}
    .sc-quota{font-size:12px;color:#5b5d57;background:#f4f2ec;border-radius:8px;padding:5px 10px}
    .sc-quota b{color:#1f211f;font-variant-numeric:tabular-nums}
    .sc-quota b.zero{color:#9B2C2C}
    .sc-quota a{color:#2E86DE}
    .sc-reveal{display:flex;align-items:center;gap:10px;font-size:13px;color:#5b5d57}
    .sc-reveal b{font-size:20px;color:#2E86DE;font-variant-numeric:tabular-nums;min-width:1.2em;text-align:center}
    .sc-gate{padding:20px 22px;max-width:420px;line-height:1.7}
    .sc-gate h3{margin:0 0 6px;font-size:17px}
    .sc-gate p{margin:0 0 6px;font-size:13.5px;color:#3d3f3a}
    .sc-gate p.sm{font-size:12px;color:#777970}
    .sc-gate .row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
    /* 时间回溯:没开时是普通按钮;开了变成一枚醒目的琥珀色标签(整页此刻看的都是那天),
       两个小动作(改日期 / 回到今天)常驻在标签里 —— 退出入口不能藏 */
    .sc-asof{display:inline-flex;align-items:center;gap:8px;border:1px solid #e0b56a;background:#fff6e3;
      border-radius:8px;padding:5px 10px;font-size:12.5px;color:#7a4b00}
    .sc-asof b{font-weight:700}
    .sc-asof button{border:0;background:transparent;color:#2E86DE;cursor:pointer;font-size:12px;
      padding:0 2px;font-family:inherit;text-decoration:underline dotted;text-underline-offset:3px}
    .sc-asof button:hover{color:#1b5fa8}
    .panel.asof{border-color:#e0b56a;box-shadow:inset 0 0 0 1px #f2dfb0}
    .panel.asof .p-hd .cnt{color:#7a4b00}
    /* 左右留边 —— 与 agent.html 的 .ag-wrap 同一套(padding:0 20px 40px)。
       原来一条都没写,条件行的文字直接贴在窗口左边缘上。 */
    .sc-wrap{padding:0 20px 40px;display:flex;flex-direction:column;gap:12px}
    /* 说明性区块(条件区下面的提示、语法速查、可用字段)收成三分之一宽。
       它们都是「看一眼就走」的辅助信息,铺满整屏只会把真正要看的条件挤下去。
       选择器限定 `.sc-wrap >` —— 结果面板里的 .sc-warn 是另一回事,不受影响。
       min-width 兜住窄屏,不然在手机上会挤成一列字。 */
    .sc-wrap>.sc-warn,
    .sc-wrap>details.sc-fold{width:33%;min-width:360px;box-sizing:border-box}
    /* grid 子项默认 min-width:auto,不加这行结果面板会被宽表撑破,
       内层 .sc-scroll 的 overflow-x 会完全失效(2026-09-10 实测) */
    .sc-wrap>*{min-width:0}
  </style>
</head>

<script src="app.js?v=20261009-kline-market"></script>
<script>
// ═══════════════════════════════════════════════════════════════════
// 魔法筛选器 · 对齐 chartink 的「魔法筛选 + 可视条件行」交互
//
// 用 renderShell('screener', …) —— 顶栏高亮「魔法筛选器」(小鹿智能体左边)。
// 2026-09-13 用户要求升成一级页面:原来它算小鹿的取数入口、顶栏高亮小鹿,
// 现在找候选票是独立功能(研究台立新研究线之前也从这里开始)。
//
// ── 数据模型:脚本就是模型 ────────────────────────────────────────
// 界面上一行条件 = 脚本里一句 `def`;「同时满足以下全部条件」= `plot scan = a and b …`。
// 不另造一套条件对象再翻译回脚本 —— 那样前端认为的条件和后端真正跑的
// 会慢慢漂移,而且两边单独看都"对",极难发现。
// 所以:改任何东西都回写成脚本 → 送后端 /parse 重新解析 → 用返回的条件重渲染。
// 启用状态也不用前端自己记:build_script 只把启用的写进 plot,
// 解析回来 plot_refs 里有谁谁就是启用的,天然闭环。
//
// ── 三条边界写死在界面上 ────────────────────────────────────────
// 延迟 15 分钟 / 只有快照没有历史不能回测 / 市值口径与站内不一致。
// 后端每次都带 warnings,这里原样渲染,不折叠、不做"下次不再提示"。
// ═══════════════════════════════════════════════════════════════════
document.body.innerHTML = renderShell('screener', '策略广场 / 魔法筛选器',
  '写筛选脚本 · 扫全市场找候选票', '')      // 升成一级页面后不再挂「← 回小鹿智能体」:顶栏 tab 就能过去

const container = document.getElementById('page-content')
const META_API  = '/api/quant/screener/meta'
const PARSE_API = '/api/quant/screener/parse'
const RUN_API   = '/api/quant/screener/run'
const FIELD_API = '/api/quant/screener/fields'

const NA = '<span class="sc-na">—</span>'
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;')
}
function num(v) {
  if (!Number.isFinite(v)) return NA
  const a = Math.abs(v)
  if (a >= 1e8) return (v / 1e8).toFixed(2) + '亿'
  if (a >= 1e4) return (v / 1e4).toFixed(1) + '万'
  // 整数原样显示 —— RS 评级这类 1~99 的整数显示成「99.00」像是算出来的小数
  if (Number.isInteger(v)) return String(v)
  return v.toFixed(2)
}
function plain(v) { return Number.isFinite(v) ? v.toFixed(2) : (v == null ? NA : esc(v)) }

// ─── 状态 ─────────────────────────────────────────────────────────
const S = {
  meta: null, metaErr: null,
  market: 'us',
  input: '',                 // 生成框里的原文
  mode: 'append',            // append | replace
  conditions: [],            // 已生效的条件行(后端 /parse 产出)
  combine: 'all',            // all | custom
  plotName: 'scan', plotExpr: '',
  plotOrder: [],             // 条件行在 plot 里的先后(/parse 的 plot_order):名字项是 def 名,表达式项是 scan#1 …
  termHost: '',              // 条件宿主(/parse 的 term_host):plot 只写一个名字、条件都在那条 def 里时是它的名字
  extraPlots: [],            // 前面的 plot(/parse 的 extra_plots):扫描只看最后一个,但要原样写回,别静默删掉用户的语句
  draftPending: null,        // 启动时没解析成(没登录 / 额度)的草稿原文:留着,不许被之后的 saveDraft 覆盖成空串
  notes: [], parseWarnings: [],
  editing: null,             // 正在编辑原文的条件名
  pending: '',               // 正在生成的那段原文(S.input 会被清空,按钮文案要靠它)
  ai: null,                  // 这批条件是 AI 翻的话:{model, script, source_text, ...}
  kw: null,                  // 这批条件是本地关键词匹配出来的话:{matched, script, ...}
  fieldRows: [],             // 字段搜索结果(含折叠的族)
  fieldOpen: {},             // 哪些族被点开了
  canTryAi: false,           // 本地两条路都不通 —— 弹「AI 识别」按钮问用户要不要花 token
  aiText: '',                // 点 AI 识别时要重发的原文
  aiKind: 'text',            // text = 大白话没认出来 · script = 脚本编译不过(AI 只修报错那几处)
  generating: false, running: false,
  genError: null, runError: null,
  result: null,
  probe: {},                 // 条件名 → 单独测试的命中数
  saved: [], savedErr: null, savedMax: 50,   // 我保存的扫描策略(后端 per-user)
  loadedName: '',            // 当前这套条件是从哪个保存的策略加载来的 —— 保存弹窗默认填它,
                             // 「改完再存一次」直接回车就是覆盖,不用重新打名字
  sortBy: 'market_cap_basic', desc: true,
  // 时间回溯(2026-09-12):'YYYY-MM-DD' = 按那天收盘的自家日线跑;null = 今天的快照。
  // **不进草稿、不进保存的策略**:它是"此刻在看哪一天",刷新页面就回到今天 —— 存下来的话
  // 用户隔天打开还停在过去某一天,而页面上又没有足够醒目的提示,会拿旧数据当今天的
  asOf: null,
  asOfRange: {},            // 市场 → /screener/history-range 的结果(能选的日期范围)
  // 会员(2026-09-14):login null = 还不知道 · false = 没登录(弹登录 / 注册)· true
  login: null,
  quota: null,              // GET /screener/quota:{ scan: {remaining, limit, ...}, ai: {...} }
  reveal: 0,                // 扫描完成后倒数显示结果的剩余秒数(0 = 没在倒数)
}

const LS = 'hunter_screener_script_v2'
const LS_MK = 'hunter_screener_market'
function saveDraft() {
  try {
    // 启动时草稿没解析成(没登录被 401 拦下)、界面上还一条条件都没有:别拿空脚本把草稿冲掉(审计 2026-09-15)
    if (!S.conditions.length && S.draftPending) { localStorage.setItem(LS_MK, S.market); return }
    localStorage.setItem(LS, buildScript(true))
    localStorage.setItem(LS_MK, S.market)
  } catch (e) { /* 隐私模式会抛,草稿丢了不影响用 */ }
}

// ─── 条件 → 脚本(与后端 build_script 同规则) ──────────────────────
// 停用的条件**保留 def**、只是不进 plot —— 重新启用时原文一字不差地回来。
//
// kind='term' 是 plot 里直接写的一项(`bullStreak >= minBullDays`,2026-09-15):它不是 def,
// 只进 plot;停用 = plot 里去掉这一项。**停用的 term 在 buildScript(false) 里就没了**(没有 def 可以留),
// 所以 rebuild 走 buildScript(true) 再把开关恢复回来,保存弹窗里明说停用的 term 不会存。
function buildScript(allEnabled) {
  const lines = []
  const on = []
  S.conditions.forEach(function (c) {
    if (!c.expr || c.kind === 'term') return
    const kw = c.kind === 'input' ? 'input' : (c.kind === 'rec' ? 'rec' : 'def')
    lines.push(kw + ' ' + c.name + ' = ' + c.expr + ';')
  })
  condRows().forEach(function (x) {
    const c = x.c
    if (!c.expr || !(allEnabled || c.enabled)) return
    on.push(c.kind === 'term' ? wrapTerm(c) : c.name)
  })
  if (!lines.length && !on.length) return ''
  ;(S.extraPlots || []).forEach(function (p) { lines.push('plot ' + p.name + ' = ' + p.expr + ';') })
  if (S.combine === 'custom' && S.plotExpr) {
    lines.push('plot ' + S.plotName + ' = ' + S.plotExpr + ';')
  } else if (S.termHost) {
    // 原脚本是 `def FOMO_Setup = a and b …; plot scan = FOMO_Setup;`(2026-09-15):按原结构写回,
    // 不把条件搬进 plot —— 用户复制回 thinkorswim 时结构要和他粘进来的一样
    lines.push('def ' + S.termHost + ' = ' + (on.length ? on.join(' and ') : 'false') + ';')
    lines.push('plot ' + S.plotName + ' = ' + S.termHost + ';')
  } else if (on.length) {
    lines.push('plot ' + S.plotName + ' = ' + on.join(' and ') + ';')
  } else {
    lines.push('plot ' + S.plotName + ' = false;')
  }
  return lines.join('\n')
}

// 条件行(能开关的那些)按 plot 里的先后排 → [{c, i}],i 是在 S.conditions 里的下标(按钮 data-i 用)。
// 不在 plot_order 里的(停用的 def、刚追加的)排在后面,彼此保持原顺序
function condRows() {
  const pos = {}
  ;(S.plotOrder || []).forEach(function (n, k) { pos[n] = k })
  return S.conditions
    .map(function (c, i) { return { c: c, i: i } })
    .filter(function (x) { return x.c.is_bool })
    .sort(function (a, b) {
      const pa = pos[a.c.name] != null ? pos[a.c.name] : 1e9 + a.i
      const pb = pos[b.c.name] != null ? pos[b.c.name] : 1e9 + b.i
      return pa - pb
    })
}

// term 回写进 `a and b`:`x or y` 要补括号,不补就改了含义。后端给 paren;
// 用户手改过的 term 后端还没见过,这里再按原文兜一次。已经整段带括号的不补(往返会一层层叠)
function wrapTerm(c) {
  const e = String(c.expr).trim()
  if (isWrapped(e)) return e
  const needs = c.paren || /(^|[^A-Za-z0-9_.])(or)([^A-Za-z0-9_.]|$)|\|\|/i.test(e)
  return needs ? '(' + e + ')' : e
}
function isWrapped(e) {
  if (e.charAt(0) !== '(' || e.charAt(e.length - 1) !== ')') return false
  let d = 0
  for (let i = 0; i < e.length; i++) {
    if (e.charAt(i) === '(') d++
    else if (e.charAt(i) === ')') d--
    if (d === 0 && i < e.length - 1) return false
  }
  return true
}

// 用户是在写脚本还是在说大白话 —— 与后端 screen_nl.looks_like_script 同一判据。
// 只用来决定按钮显示「解析中」还是「识别中」;真正走哪条路由后端说了算,
// 前端猜错顶多是文案不准,不影响结果。
function looksLikeScript(t) {
  return /(^|\n)\s*(def|plot|input|rec|declare)\s+[A-Za-z_]/.test(t || '')
}

// 某个名字有没有被别的条件引用
function referenced(name, exceptIdx) {
  const hit = function (t) { return paramRe(name).test(stripComments(t || '')) }
  if (S.conditions.some(function (o, j) { return j !== exceptIdx && hit(o.expr) })) return true
  // 自定义组合下 plot 原文也在引用;前面的 plot 同样 —— 不看它们的话,改个参数就把 plot 用到的定义当孤儿清掉,
  // plot 引用了不存在的名字,解析失败(审计 2026-09-15 实跑)
  if (S.combine === 'custom' && hit(S.plotExpr)) return true
  return (S.extraPlots || []).some(function (p) { return hit(p.expr) })
}

// 清掉没人引用的中间变量。
//
// 变量在界面上不显示,所以一旦没人引用就成了**看不见又删不掉**的死代码:
// 它还会白白多请求一列扫描源字段。删条件/改表达式之后必须跑一次。
// 循环到不动为止 —— 变量可以引用变量(def a = …; def b = a * 2;),
// 删掉 b 之后 a 才变成孤儿。
//
// 只在**我们自己造成孤儿**的时候跑(删除/编辑/改数字)。用户刚粘进来的脚本
// 不动 —— 那是他的原文,里面有个没用到的变量也是他的事,静默改掉会让
// 「复制脚本」copy 出来的东西和他粘进去的对不上。
function pruneVars() {
  let changed = true
  while (changed) {
    changed = false
    for (let i = S.conditions.length - 1; i >= 0; i--) {
      const c = S.conditions[i]
      if (c.is_bool) continue
      if (!referenced(c.name, i)) { S.conditions.splice(i, 1); changed = true }
    }
  }
}

// 结构变了 → 清孤儿 → 回写脚本 → 重新解析(拿到最新 tokens)
//
// 停用状态:按 buildScript(true) 回写(停用的 term 才不会丢),解析回来再按 名字(def)/ 原文(term)关回去
async function rebuild() {
  pruneVars()
  return reparseKeepOff()
}

// 回写再解析、停用状态原样保留 → true = 解析成功。
// 所有「改完回写」的地方都走这里(编辑 / 删除 / 复制 / 改数字 / 切市场 / 追加生成):
// 用 buildScript(false) 回写的话,停用的 term 没有 def 可留,会被**永久**删掉(审计 2026-09-15:切市场、追加各漏了一处)
async function reparseKeepOff() {
  const offDef = {}, offTerm = {}
  S.conditions.forEach(function (c) {
    if (!c.is_bool || c.enabled) return
    if (c.kind === 'term') offTerm[String(c.expr).trim()] = 1
    else offDef[c.name] = 1
  })
  const ok = await reparse(buildScript(true))
  if (!ok) return false
  let changed = false
  S.conditions.forEach(function (c) {
    if (!c.is_bool) return
    if ((c.kind === 'term' && offTerm[String(c.expr).trim()]) || (c.kind !== 'term' && offDef[c.name])) {
      c.enabled = false; changed = true
    }
  })
  if (changed) { saveDraft(); render() }
  return true
}

// 改动之前的整份状态。回写解析失败(报错 / 被登录或额度拦下)时整份退回 ——
// 原来只有编辑框保存会回滚,改数字 / 删除 / 复制失败会把坏表达式留在条件区,之后单条测试和运行全挂(审计 2026-09-15)
function snapState() {
  return {
    conditions: S.conditions.map(function (o) { return Object.assign({}, o) }),
    plotOrder: (S.plotOrder || []).slice(), termHost: S.termHost, combine: S.combine,
    plotExpr: S.plotExpr, plotName: S.plotName, extraPlots: (S.extraPlots || []).slice(),
  }
}
function restoreState(sn) {
  S.conditions = sn.conditions; S.plotOrder = sn.plotOrder; S.termHost = sn.termHost; S.combine = sn.combine
  S.plotExpr = sn.plotExpr; S.plotName = sn.plotName; S.extraPlots = sn.extraPlots
}
async function mutateRebuild(mutate) {
  const sn = snapState()
  mutate()
  S.genError = null
  const ok = await rebuild()
  if (!ok) { restoreState(sn); saveDraft(); render() }
  return ok
}

// ═══ 魔法筛选(生成区) ═══════════════════════════════════════════
// ─── 系统示例:对自己隐藏 ─────────────────────────────────────────
// 2026-09-11 用户:「系统预设的选股器比较多,要能删,按钮做得小巧隐蔽一些」。
//   1. 示例是全站共用的(后端 screen_source.PRESETS),**不能真删,只能对自己隐藏**。
//   2. 存 localStorage 不存后端:没登录也能用;丢了(换浏览器 / 清缓存)的代价只是示例重新出现。
//   3. ✕ 做得小、颜色淡(用户要的「隐蔽」),但**常驻可见、不藏 hover** —— 仓内铁律
//      「新功能入口不许藏在 hover 里」。
//   4. **不留恢复入口**。第一版在行尾放了「已隐藏 N 个 · 恢复」,用户当天看了说
//      「不要这样显示隐藏,直接不显示,不用留恢复功能」—— 这是用户的明确决定,别再加回来。
//      想找回只能清掉这个站点的浏览器数据(或删 localStorage 里的 hunter_screener_hidden_presets)。
const LS_HIDE = 'hunter_screener_hidden_presets'
function hiddenPresets() {
  try {
    const v = JSON.parse(localStorage.getItem(LS_HIDE) || '[]')
    return Array.isArray(v) ? v : []
  } catch (e) { return [] }
}
function setHiddenPresets(keys) {
  try {
    if (keys.length) localStorage.setItem(LS_HIDE, JSON.stringify(keys))
    else localStorage.removeItem(LS_HIDE)
  } catch (e) { /* 存不了就只在这次页面里生效 */ }
}
function vPresetChips() {
  const presets = (S.meta && S.meta.presets) || []
  if (!presets.length) {
    return '<span class="sc-na" style="font-size:12px">' +
      (S.metaErr ? '示例没拿到' : '加载中…') + '</span>'
  }
  const hid = hiddenPresets()
  const shown = presets.filter(function (p) { return hid.indexOf(p.key) < 0 })
  return shown.map(function (p) {
    return '<span class="mg-sys">' +
      '<button class="nm" data-preset="' + esc(p.key) + '" title="' + esc(p.desc) + '">' +
        esc(p.name) + '<span class="ar">↵</span></button>' +
      '<button class="hide" data-hide="' + esc(p.key) + '" title="隐藏「' + esc(p.name) +
        '」· 只对你自己生效" aria-label="隐藏示例 ' + esc(p.name) + '">✕</button>' +
    '</span>'
  }).join('')
}

function vMagic() {
  const chips = vPresetChips()

  const markets = (S.meta && S.meta.markets) || []
  const mkBtns = markets.length
    ? markets.map(function (m) {
        return '<button data-mkt="' + esc(m.key) + '" class="' +
          (m.key === S.market ? 'on' : '') + '">' + esc(m.label) + '</button>'
      }).join('')
    : '<span class="sc-na" style="font-size:12px">' +
      (S.metaErr ? '市场没拿到' : '加载中…') + '</span>'

  return '<div class="mg">' +
    '<div class="mg-hd"><span class="hi hi-sparkle"></span>魔法筛选器</div>' +
    '<div class="mg-row">' +
      '<div class="mg-seg" id="mg-mode">' +
        '<button data-mode="append" class="' + (S.mode === 'append' ? 'on' : '') + '">追加</button>' +
        '<button data-mode="replace" class="' + (S.mode === 'replace' ? 'on' : '') + '">替换</button>' +
      '</div>' +
      '<div class="mg-seg" id="mg-mkts">' + mkBtns + '</div>' +
      '<textarea class="mg-ta" id="mg-input" ' +
        'placeholder="用大白话描述,或直接粘筛选脚本。例:\n成交量大于100万,且收盘价站上50日均线\ndef sma50 = Average(close, 50); plot scan = close > sma50;">' +
        esc(S.input) + '</textarea>' +
      // 「复制脚本 / 清空」放在生成按钮**正下方**:它们操作的是同一份东西
      // (生成框产出的条件),原来钉在条件区标题的最右端,和生成隔了整整一屏。
      '<div class="mg-genwrap">' +
        '<button class="mg-gen" id="mg-gen"' + (S.meta && !S.generating ? '' : ' disabled') + '>' +
          // 大白话要过一次 LLM,几秒起步。文案说清在等什么,不然用户以为卡死了
          (S.generating ? (looksLikeScript(S.pending) ? '解析中…' : '识别中…')
                        : '<span class="hi hi-play"></span> 生成') + '</button>' +
        '<div class="mg-genbar">' +
          '<button class="btn small" id="cd-copyall"' + (S.conditions.length ? '' : ' disabled') +
            '>复制脚本</button>' +
          '<button class="btn small" id="cd-clear"' + (S.conditions.length ? '' : ' disabled') +
            '>清空</button>' +
        '</div>' +
      '</div>' +
    '</div>' +
    // 系统示例全被隐藏时,「我的扫描策略」前面那根分隔线就成了孤零零的一道竖线,去掉
    '<div class="mg-eg" id="mg-eg">' +
      (chips ? chips + vSavedChips() : vSavedChips().replace('<span class="mg-sep"></span>', '')) +
    '</div>' +
    '</div>' +
    // 本地认不出来时**不直接烧 token**,把「AI 识别」摆出来让用户自己决定。
    // 按钮上写清「会消耗 token」—— 花钱的动作必须是用户明示的。
    (S.genError
      ? '<div class="sc-err">' + esc(maskSrc(S.genError)) +
        (S.canTryAi
          ? '<div class="sc-runbar" style="margin-top:9px">' +
              '<button class="btn small" id="mg-ai"' + (S.generating ? ' disabled' : '') + '>' +
                (S.generating ? (S.aiKind === 'script' ? '修改中…' : '识别中…')
                  : (S.aiKind === 'script' ? '✨ 用 AI 修脚本' : '✨ 用 AI 识别') + aiLeftText()) + '</button>' +
              '<span style="font-size:11.5px;color:#9B2C2C">' +
                (S.aiKind === 'script'
                  ? '脚本里有识别不了的写法 · AI 只改报错涉及的句子,改了哪几句会逐条列出 · 会消耗 token,点了才调用'
                  : '本地关键词没认出来 · AI 识别会消耗 token,点了才调用') + '</span>' +
            '</div>'
          : '') +
        '</div>'
      : '') +
    (S.metaErr ? '<div class="sc-err">读不到扫描配置:' + esc(maskSrc(S.metaErr)) +
      '\n后端可能还没部署 /api/quant/screener/*。界面骨架照常显示,但生成和扫描都会失败。</div>' : '')
}

// ═══ 条件行 ═══════════════════════════════════════════════════════
function vTok(t, ci, ti) {
  if (t.k === 'num') {
    return '<input class="sc-num" data-c="' + ci + '" data-t="' + ti + '" ' +
      'value="' + esc(t.t) + '" size="' + Math.max(1, String(t.t).length) + '" ' +
      'aria-label="数值" />'
  }
  const cls = { field: 'f', op: 'o', logic: 'l', paren: 'p', ref: 'r', kw: 'k', fn: 'f' }[t.k] || ''
  return '<span class="tk ' + cls + '">' + esc(t.t) + '</span>'
}

function vCond(c, i) {
  // 中间变量(def sma50 = Average(close,50))**不渲染**。
  //
  // 它不是条件,是实现细节:引用它的条件已经把它的标签内联显示了
  // (cond_sma20_50 渲染成「20日均线 大于 50日均线」,而不是「sma20 大于 sma50」),
  // 所以单独占一行只是噪音 —— 一份 7 条件的脚本会多出 5 行看不懂的东西。
  // chartink 也是这么处理的:它把指标直接写进条件行,没有变量的概念。
  //
  // 变量仍然留在脚本里(buildScript 照写),只是界面上不出现。
  // 配套的是 pruneVars():条件被删/改之后没人引用的变量自动清掉 ——
  // 否则会留下**看不见又删不掉**的死代码。
  if (!c.is_bool) return ''
  const off = !c.enabled
  const body = (c.tokens || []).map(function (t, ti) { return vTok(t, i, ti) }).join(' ')
  const sw = '<button class="sw ' + (c.enabled ? 'on' : '') + '" data-act="toggle" data-i="' + i +
      '" title="' + (c.enabled ? '停用这条(保留原文)' : '启用这条') + '"><i></i></button>'
  const probe = S.probe[c.name]
  const probeTxt = probe === undefined ? '' :
    (probe === null ? '<span class="sc-na" style="font-size:11px">单独测试失败</span>'
      : '<span style="font-size:11px;color:var(--brand-dark)">单独命中 ' + probe + '</span>')
  const isTerm = c.kind === 'term'
  return '<div class="cd' + (off ? ' off' : '') + '">' +
    // plot 里直接写的一项没有名字,标题用它引用的第一个定义名(bullStreak >= … 就叫 bullStreak)
    '<span class="nm"' + (isTerm ? ' title="' + esc(S.termHost ? S.termHost + ' 里的一项' : 'plot 里的一项') + '"' : '') + '>' +
      esc(isTerm ? (c.title || 'plot') : c.name) + '</span>' +
    '<span class="body">' + body + ' ' + probeTxt + '</span>' +
    '<span class="acts">' +
      '<button data-act="edit" data-i="' + i + '" title="编辑原文">✎</button>' +
      // 复制一条 = 再来一句同样的 def;term 不是 def,复制出来是 plot 里两句一模一样的 and,没意义
      (isTerm ? '' : '<button data-act="dup" data-i="' + i + '" title="复制一条">⧉</button>') +
      '<button data-act="copy" data-i="' + i + '" title="复制这一条的脚本文本(连同它用到的参数和中间定义,粘回生成框可直接用)">⎘</button>' +
      '<button data-act="probe" data-i="' + i + '" title="只用这一条扫一次">🐞</button>' +
      sw +
      '<button class="del" data-act="del" data-i="' + i + '" title="删除">✕</button>' +
    '</span>' +
    (S.editing === c.name
      ? '<div class="cd-editbox">' +
          '<textarea class="cd-edit" id="cd-edit" spellcheck="false">' +
            esc(S.editText != null ? S.editText : withParams(c.expr)) + '</textarea>' +
          '<div class="cd-editbar">' +
            '<button class="btn small" id="cd-save">保存</button>' +
            '<button class="btn small" id="cd-cancel">取消</button>' +
            '<span class="sc-note" style="margin:0">写原始表达式,分号不用写 · ' +
            (/\(/.test(withParams(c.expr)) && withParams(c.expr) !== c.expr ? '参数(括号里的数)直接改,保存后所有用到它的条件一起生效 · ' : '') +
            'Ctrl/Cmd + Enter 保存 · Esc 取消</span>' +
          '</div>' +
        '</div>'
      : '') +
    '</div>'
}

function vConditions() {
  if (!S.conditions.length) {
    return '<div class="sc-note" style="padding:22px 4px">' +
      '还没有条件。把筛选脚本粘进上面的框里点「生成」,或者直接点一个示例。</div>'
  }
  const rows = condRows()
  const onCount = rows.filter(function (x) { return x.c.enabled }).length
  const mk =(S.meta && (S.meta.markets || []).filter(function (m) { return m.key === S.market })[0]) || null
  // 复制脚本 / 清空已经挪到生成按钮正下方(vMagic),这里只留标题
  return '<div class="cd-hd">股票需<b>同时满足</b>以下<b>' + onCount + '</b> 个条件' +
      (mk ? '<span class="mk">' + esc(mk.label) + '</span>' : '') +
      (S.ai ? '<span class="ai-badge">AI 翻译</span>' : '') +
      (S.kw ? '<span class="kw-badge">本地识别</span>' : '') +
    '</div>' +
    vKwNote() + vAiNote() +
    (S.combine === 'custom'
      ? '<div class="sc-warn">这个脚本的最终条件不是「若干条件全部满足」,而是自定义组合:' +
        '<code>' + esc(S.plotExpr) + '</code>。所以下面每一条不能单独停用 —— ' +
        '停用开关会改变组合的含义。要逐条开关,请把最后一句改成 ' +
        '<code>plot scan = 条件A and 条件B;</code> 的形式。</div>'
      : '') +
    '<div class="cd-list" id="cd-list">' +
      rows.map(function (x) { return vCond(x.c, x.i) }).join('') +
      vDefs() +
    '</div>' +
    vNotes()
}

// 脚本里的参数(input)和中间定义(isBull / ret / volMA20 …)。
// 它们**不是条件**,不进上面的「同时满足」,但时间序列脚本里条件行显示的是它们的名字(bullStreak >= minBullDays(3)),
// 不摆出来用户看不到 bullStreak 是怎么算的。参数值和窗口长度可以直接改(数字框走同一个 onNumChange)。
// 横截面脚本的中间变量照旧不显示(条件行已经把它们内联成中文了,见 vCond 开头的注释)
function vDefs() {
  // 时间序列脚本的标志:有 input / rec,或者 token 里有函数名(fn)/ K 线偏移([n])—— 横截面脚本两样都没有
  const series = S.conditions.some(function (c) {
    return c.kind === 'input' || c.kind === 'rec' || (c.tokens || []).some(function (t) {
      return t.k === 'fn' || (t.k === 'op' && String(t.t).charAt(0) === '[')
    })
  })
  if (!series) return ''
  const inputs = [], defs = []
  S.conditions.forEach(function (c, i) {
    if (c.is_bool) return
    ;(c.kind === 'input' ? inputs : defs).push({ c: c, i: i })
  })
  if (!inputs.length && !defs.length) return ''
  const tok = function (x) {
    return (x.c.tokens || []).map(function (t, ti) { return vTok(t, x.i, ti) }).join(' ')
  }
  return (inputs.length
      ? '<div class="cd-params"><span class="cd-sub">参数</span>' +
          inputs.map(function (x) {
            return '<span class="cd-param"><span class="tk r">' + esc(x.c.name) + '</span> ' + tok(x) + '</span>'
          }).join('') + '</div>'
      : '') +
    (defs.length
      ? '<details class="sc-fold cd-defs"><summary>脚本里的中间定义 ' + defs.length +
          ' 个(不是条件,是上面条件用到的计算)· 点开看</summary>' +
          defs.map(function (x) {
            return '<div class="cd-def"><span class="nm">' + esc(x.c.name) + '</span>' +
              '<span class="body">' + tok(x) + '</span></div>'
          }).join('') + '</details>'
      : '')
}

// ─── 页面上不出现上游数据源的名字(2026-09-10 产品要求) ──────────
// **只改这个页面的展示**:后端照旧返回这些提示,MCP 工具那边也照旧收得到
// (模型需要知道"数据是延迟的"才不会拿盘中数据下结论)。
//
// 两种处理,别混:
//   · 提示条(notes / warnings)—— 整条丢掉。它们本来就只是提醒。
//   · 报错文案 —— 只把名字换掉,不能整条丢:丢了用户就不知道为什么失败了。
const SRC_ALIAS = '行情源'
// 要挡掉的提示,按**内容前缀**匹配 —— 不能再按厂商名匹配了:
// 2026-09-10 后端把文案里的厂商名换成中性词之后,按名字过滤的规则当场失效,
// 这两条提示又冒回页面上。用前缀是脆的,所以规则写在这里、并在后端那两个
// 常量(DELAY_WARN / MARKET_CAP_WARN)旁边留了指向本处的注释:改文案要同步改这里。
const DROP_PREFIX = ['免订阅通道数据延迟', 'market_cap_basic 是']
function dropSrc(list) {
  return (list || []).filter(function (w) {
    const t = String(w)
    if (t.indexOf('TradingView') >= 0) return false          // 兜底:万一哪里漏改
    return !DROP_PREFIX.some(function (p) { return t.indexOf(p) === 0 })
  })
}
function maskSrc(s) {
  return String(s == null ? '' : s).replace(/TradingView/g, SRC_ALIAS)
}

// 本地关键词匹配的可审计凭据:哪一句变成了哪个表达式。
// 规则匹配不会像模型那样瞎编,但会**理解偏**(比如把"量"当成成交量而不是量比),
// 所以逐句对照必须摆出来 —— 和 AI 那份一个道理。
function vKwNote() {
  if (!S.kw) return ''
  const rows = (S.kw.matched || []).map(function (m) {
    return '<div class="kw-row"><span class="kw-src">' + esc(m.text) + '</span>' +
      '<span class="kw-arrow">→</span>' +
      '<code class="kw-expr">' + esc(m.expr) + '</code>' +
      (m.learned ? '<span class="kw-learned-tag">来自对照表</span>' : '') + '</div>'
  }).join('')
  // 来自对照表(之前的 AI 识别)的句子 —— **放在折叠区外面、常驻可见**。
  // 对照表是全站共享、AI 学来的,学错一条所有人都会反复用到,
  // 所以「这条不对,忘掉它」必须一眼能看见,不能让用户先去点开折叠区才发现。
  // 一句话可能展开成好几个条件(整句学的那种),按对照表条目归并,每条一个按钮。
  const groups = []
  const byId = {}
  ;(S.kw.matched || []).forEach(function (m) {
    if (!m.learned || !m.learned.id) return
    let g = byId[m.learned.id]
    if (!g) { g = byId[m.learned.id] = { id: m.learned.id, text: m.text, exprs: [] }; groups.push(g) }
    g.exprs.push(m.expr)
  })
  const learnedBox = groups.length
    ? '<div class="kw-learned"><div class="kw-learned-hd"><span class="hi hi-book"></span> ' +
        '这 ' + groups.length + ' 句是从之前的 AI 识别里学来的(对照表),<b>这次没花 token</b>。' +
        '对照表是 AI 学的,请核对:</div>' +
      groups.map(function (g) {
        return '<div class="kw-row"><span class="kw-src">' + esc(g.text) + '</span>' +
          '<span class="kw-arrow">→</span>' +
          '<code class="kw-expr">' + esc(g.exprs.join(' 且 ')) + '</code>' +
          '<button class="btn small kw-forget" data-forget="' + g.id + '">这条不对,忘掉它</button></div>'
      }).join('') + '</div>'
    : ''
  // 有损近似(「上穿」只能按"当前在上方"判断)**不能**放进折叠区,也不能走
  // parseWarnings —— 生成之后前端会再 reparse 一次脚本,脚本走不到关键词分支,
  // warnings 会被覆盖成没有这条(2026-09-11 实测:接口返回了,页面上没有)。
  // 挂在 S.kw 上,reparse 之后 generate 会把它补回来。
  const lossy = (S.kw.notes || []).length
    ? '<div class="sc-warn"><ul>' + S.kw.notes.map(function (n) {
        return '<li>' + esc(maskSrc(n)).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>') + '</li>'
      }).join('') + '</ul></div>'
    : ''
  return lossy + learnedBox + '<details class="sc-fold ai-note"><summary>' +
      '本地识别把「' + esc(String(S.kw.source_text || '').slice(0, 40)) +
      '」拆成了这些条件 · 点开逐句对照' +
    '</summary>' + rows +
    '<div class="sc-note">关键词匹配,<b>未使用 AI、零成本</b>。' +
    '理解偏了的话直接改下面的条件,或者换个说法重新生成。</div></details>'
}

// AI 翻译的可审计凭据:原话 + 它实际写出来的脚本。
// 只显示"AI 翻译"四个字是不够的 —— 用户没法判断它有没有理解对,
// 必须能看见它到底写了什么(仓内铁律:AI 产出要可核对,不能只给结论)。
function vAiNote() {
  if (!S.ai) return ''
  // 修脚本:改动逐句摆在折叠区**外面** —— 被改的周期 / 数字不是用户写的,藏起来等于悄悄改。
  // changes 由后端逐句比对算出,不是模型自述。
  if (S.ai.mode === 'fix') {
    const ch = S.ai.changes || []
    return '<div class="sc-warn"><b>AI 按报错改了 ' + ch.length + ' 句脚本,其余原样保留。</b>' +
        '改动的周期 / 数字不是你写的,跑扫描前请确认:<ul>' +
        ch.map(function (x) {
          return '<li><code>' + esc(x.name) + '</code>:' +
            (x.before == null ? '(新增)' : '<code>' + esc(x.before) + '</code>') + ' → ' +
            (x.after == null ? '(删掉了)' : '<code>' + esc(x.after) + '</code>') + '</li>'
        }).join('') + '</ul>' +
        '<div style="font-size:11.5px;margin-top:4px">原报错:' + esc(maskSrc(S.ai.error || '')) + '</div></div>' +
      '<details class="sc-fold ai-note"><summary>点开看 AI 改好的完整脚本</summary>' +
        '<pre class="ai-script">' + esc(S.ai.script || '') + '</pre>' +
        '<div class="sc-note">模型 ' + esc(S.ai.model || '') +
          (S.ai.attempts > 1 ? ' · 第 ' + S.ai.attempts + ' 次才通过校验' : '') +
          ' · 修出来的脚本不进对照表</div></details>'
  }
  return '<details class="sc-fold ai-note"><summary>' +
      'AI 把「' + esc(String(S.ai.source_text || '').slice(0, 40)) + '」翻成了这些条件 · 点开看它写的脚本' +
    '</summary>' +
    '<pre class="ai-script">' + esc(S.ai.script || '') + '</pre>' +
    '<div class="sc-note">模型 ' + esc(S.ai.model || '') +
      (S.ai.attempts > 1 ? ' · 第 ' + S.ai.attempts + ' 次才通过校验' : '') +
      ' · 脚本已通过语法与字段校验,但<b>是否符合你的本意要你自己确认</b>。' +
      '不对的话直接改下面的条件,或者换个说法重新生成。</div></details>' +
    (S.ai.learned > 0
      ? '<div class="sc-note" style="margin:6px 0 0"><span class="hi hi-book"></span> ' +
        '已记进对照表 —— 下次同样的说法(数字可以不同)直接本地识别,不再花 token。</div>'
      : '')
}

function vNotes() {
  const ws = dropSrc(S.notes).concat(dropSrc(S.parseWarnings))
  if (!ws.length) return ''
  return '<div class="sc-warn"><ul>' +
    ws.map(function (w) { return '<li>' + warnHtml(w) + '</li>' }).join('') + '</ul></div>'
}
// 后端提示里用 **…** 标重点(本地识别那段早就这么渲染);先转义再换成粗体,不给 HTML 注入留口子
function warnHtml(w) { return esc(w).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>') }

// ═══ 结果 ═════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════════
// 我保存的扫描策略
// ═══════════════════════════════════════════════════════════════
// 后端 per-user 存(services/screen_saved.py,那里写了为什么不存 localStorage)。
//
// 三个容易写错的点:
//   1. 保存必须 buildScript(false)。草稿用的 true 会把停用的条件也写进 plot,
//      加载回来用户关掉的开关全亮了。false 只写启用的,加载时 reparse →
//      applyParsed 按 plot_refs 恢复开关,往返一致。
//   2. 加载 = **替换**,不管上面「追加/替换」选的是哪个。那个开关管的是
//      「生成框里的新条件怎么合进来」;加载一个存好的策略是「回到那套设置」,
//      追加进去就变成两套条件的混合,不是用户要的东西。
//   3. 同名覆盖要确认 —— 但如果名字就是刚加载的那个(用户在「改完再存」),
//      不弹确认,那是预期行为,弹了反而烦。
const SAVED_API = '/api/quant/screener/saved'
const MKT_LABEL = { a: 'A股', hk: '港股', us: '美股' }

function vSavedChips() {
  if (S.savedErr) {
    return '<span class="mg-sep"></span><span class="sc-na" style="font-size:12px;align-self:center">' +
      '我的扫描策略没拉到 · ' + esc(S.savedErr) + '</span>'
  }
  if (!S.saved.length) return ''
  return '<span class="mg-sep"></span>' + S.saved.map(function (p) {
    return '<span class="mg-mine' + (p.name === S.loadedName ? ' on' : '') + '">' +
      '<button class="nm" data-saved="' + p.id + '" title="加载「' + esc(p.name) + '」(替换当前条件)">' +
        '<span class="hi hi-save"></span>' + esc(p.name) +
        '<span class="mk">' + esc(MKT_LABEL[p.market] || p.market) + '</span></button>' +
      '<button class="del" data-del="' + p.id + '" title="删除「' + esc(p.name) + '」">✕</button>' +
    '</span>'
  }).join('')
}

async function loadSaved() {
  let r
  try {
    r = await fetch(SAVED_API, { headers: apiHeaders(), cache: 'no-store' })
  } catch (e) {
    S.savedErr = '请求没发出去'; render(); return
  }
  // 没登录:不显示也不报错 —— 列表本来就是空的。点「保存」时才提示要登录。
  if (r.status === 401) { S.saved = []; S.savedErr = null; render(); return }
  if (!r.ok) { S.savedErr = 'HTTP ' + r.status; render(); return }
  try {
    const d = await r.json()
    S.saved = d.items || []
    S.savedMax = d.max || 50
    S.savedErr = null
  } catch (e) { S.savedErr = '返回的不是合法 JSON' }
  render()
}

function openSaveDialog() {
  if (!S.conditions.length) return
  const bools = S.conditions.filter(function (c) { return c.is_bool })
  const on = bools.filter(function (c) { return c.enabled }).length
  // plot 里直接写的项(term)没有 def 可以留,停用的存不进去 —— 明说,别让用户加载回来才发现少了
  const offTerms = bools.filter(function (c) { return c.kind === 'term' && !c.enabled }).length
  const m = openModal(
    '<div class="modal-hd"><span class="hi hi-save" style="color:var(--brand)"></span> 保存扫描策略' +
      '<span class="close" data-close>×</span></div>' +
    '<div class="modal-body">' +
      '<div class="field"><div class="lbl">名称</div>' +
        '<input id="sv-name" maxlength="30" autocomplete="off" ' +
        'placeholder="比如:美股放量突破 · 市值大于 100 亿" value="' + esc(S.loadedName) + '"></div>' +
      '<div class="sc-note" style="line-height:1.8">会保存 <b>' + bools.length + '</b> 个条件' +
        (bools.length !== on
          ? (offTerms
            ? '(其中 <b>' + on + '</b> 个启用;停用的 <b>' + offTerms + '</b> 条是 plot 里直接写的比较式,<b>不会存进去</b>)'
            : '(其中 <b>' + on + '</b> 个启用,停用的也一起存,加载回来开关不变)')
          : '') +
        ' · 市场 <b>' + esc(MKT_LABEL[S.market] || S.market) + '</b>' +
        ' · 排序 <b>' + esc(S.sortBy || '—') + '</b> ' + (S.desc ? '↓' : '↑') + '<br>' +
        '同名会覆盖原来那个。保存后会出现在示例按钮那一排,点一下就能加载回来。</div>' +
      '<div class="sc-err" id="sv-err" style="display:none;margin-top:10px"></div>' +
    '</div>' +
    '<div class="modal-ft"><button class="btn" data-close>取消</button>' +
      '<button class="btn primary" id="sv-ok">保存</button></div>')
  const inp = m.querySelector('#sv-name')
  if (inp) { inp.focus(); inp.select() }
  const go = function () { doSave(inp ? inp.value : '', m) }
  const ok = m.querySelector('#sv-ok')
  if (ok) ok.addEventListener('click', go)
  if (inp) inp.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); go() }
  })
}

async function doSave(raw, modal) {
  const name = String(raw || '').trim()
  const err = modal.querySelector('#sv-err')
  const show = function (t) { if (err) { err.textContent = t; err.style.display = t ? '' : 'none' } }
  if (!name) { show('给这个扫描策略起个名字'); return }
  const dup = S.saved.filter(function (p) { return p.name === name })[0]
  if (dup && name !== S.loadedName &&
      !confirm('已经有一个叫「' + name + '」的扫描策略了,覆盖它吗?')) return
  const btn = modal.querySelector('#sv-ok')
  if (btn) { btn.disabled = true; btn.textContent = '保存中…' }
  const r = await post(SAVED_API, {
    name: name,
    market: S.market,
    // ⚠️ 必须是 false,见本节开头第 1 条
    script: buildScript(false),
    sort_by: S.sortBy,
    sort_desc: S.desc,
  })
  if (btn) { btn.disabled = false; btn.textContent = '保存' }
  if (r.status === 401 && !getToken()) {
    // 压根没登录过(本地没有令牌):说「登录已失效」是错的 —— 2026-09-14 执行用例 QX-007 时发现
    if (err) {
      err.innerHTML = '登录后才能保存和查看自己的扫描策略。' +
        '<a href="' + loginUrl('login') + '" style="color:inherit;text-decoration:underline">登录</a> / ' +
        '<a href="' + loginUrl('register') + '" style="color:inherit;text-decoration:underline">注册</a>' +
        ' —— 当前的条件已存为草稿,登录回来还在。'
      err.style.display = ''
    }
    return
  }
  if (r.status === 401) {
    // 走到这里说明 app.js 的自动续期**已经试过并失败了** —— 不是「没登录」,
    // 是登录真的失效了(refresh token 30 天没用 / 在别处退出过)。
    // 原来那句「登录后才能保存」会让明明登录着的用户以为是 bug(2026-09-11 就是这么报上来的)。
    // 新窗口打开登录页:在本页跳走的话,用户会以为刚调好的条件没了(其实草稿还在)。
    if (err) {
      err.innerHTML = '登录已失效(超过 30 天没用,或在别处退出过)。' +
        '<a href="/login" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">' +
        '在新窗口重新登录</a>,回到这里再点保存 —— 当前的条件不会丢。'
      err.style.display = ''
    }
    return
  }
  if (!r.ok) { show(errOf(r, httpFail('保存失败', r.status))); return }
  modal.remove()
  S.loadedName = name
  await loadSaved()
  toast((r.data && r.data.created ? '已保存' : '已覆盖') + '「' + name + '」', 'success')
}

// 点官方示例 = 直接换成那套条件(2026-09-22 用户:「官方预留的就直接记录筛选器就行,不要再生成一次」)。
// 原来是把示例脚本塞进生成框再走 generate(),受「追加 / 替换」开关影响:追加模式下拿当前条件当上下文编译,
// 当前是「上升趋势」(有 def sma50)时点「VCP 波段收缩」,VCP 里的 SMA50 被当成上下文里的 sma50,报「不认识 'sma50'」。
// 现在不进生成框、不再点「生成」:替换模式(或当前没有条件)直接换成示例那套;追加模式把示例的条件追加进来
// (同日用户纠正:第一版一律替换,「我选的追加,它点击后却是替换」)。失败时市场退回、条件不动。
async function loadOfficialPreset(p) {
  const before = S.conditions.filter(function (c) { return c.is_bool }).length
  const prevMarket = S.market
  // 追加模式 + 已有条件 → 把示例的条件追加进来(同日用户:「我选的追加,它点击后却是替换」)。
  // 走 generate 的追加路径(当前脚本当上下文编译、重名改名、回写失败整份退回),只是示例脚本不进生成框
  if (S.mode === 'append' && before > 0) {
    if (p.market) S.market = p.market
    S.genError = null
    await generate(false, p)
    if (S.genError) { S.market = prevMarket; render(); return }
    S.loadedName = ''
    const added = S.conditions.filter(function (c) { return c.is_bool }).length - before
    render()
    toast('已追加官方示例「' + p.name + '」的 ' + added + ' 个条件')
    return
  }
  if (p.market) S.market = p.market
  S.genError = null             // 生成框里用户正在写的字不动(示例不经过生成框)
  const ok = await reparse(p.script)
  if (!ok || S.genError) {
    S.market = prevMarket
    render()
    return
  }
  S.loadedName = ''         // 换成系统示例了,就不再是「基于我那个策略」
  render()
  toast('已加载官方示例「' + p.name + '」' + (before ? ' · 替换了原来的 ' + before + ' 个条件' : ''))
}

async function loadSavedPreset(id) {
  const p = S.saved.filter(function (x) { return x.id === id })[0]
  if (!p) return
  const before = S.conditions.filter(function (c) { return c.is_bool }).length
  const prevMarket = S.market
  S.market = p.market
  if (p.sort_by) { S.sortBy = p.sort_by; S.desc = !!p.sort_desc }
  S.input = ''
  S.genError = null
  await reparse(p.script)
  if (S.genError) {
    // 解析失败(比如上游撤掉了某个字段):条件没换,市场也退回去,别让界面处于半加载状态
    S.market = prevMarket
    S.loadedName = ''
    render()
    return
  }
  S.loadedName = p.name
  render()
  toast('已加载「' + p.name + '」' + (before ? ' · 替换了原来的 ' + before + ' 个条件' : ''))
}

async function deleteSaved(id) {
  const p = S.saved.filter(function (x) { return x.id === id })[0]
  if (!p) return
  if (!confirm('删除扫描策略「' + p.name + '」?删了不能恢复。')) return
  let r
  try {
    r = await fetch(SAVED_API + '/' + encodeURIComponent(id),
                    { method: 'DELETE', headers: apiHeaders() })
  } catch (e) { toast('删除失败:请求没发出去', 'warn'); return }
  if (!r.ok) {
    let d = null
    try { d = await r.json() } catch (e) { /* 非 JSON */ }
    toast((d && d.detail) || ('删除失败 · HTTP ' + r.status), 'warn')
    return
  }
  if (S.loadedName === p.name) S.loadedName = ''
  await loadSaved()
  toast('已删除「' + p.name + '」')
}

// ─── 时间回溯 ──────────────────────────────────────────────────
// 跳到过去某一天,按那天收盘的自家日线重算字段再跑同一套条件(后端 screen_asof)。
// 扫描源只有当天快照,所以市值 / 财务类字段回溯不了 —— 对话框和结果里都要说。
function vAsOf() {
  if (!S.asOf) {
    return '<button class="btn" id="sc-asof" title="跳到过去的某一天,按那天收盘的数据跑同一套条件">' +
      '<span class="hi hi-clock"></span> 时间回溯</button>'
  }
  return '<span class="sc-asof"><span class="hi hi-clock"></span>回溯到 <b>' + esc(S.asOf) + '</b> 收盘' +
    '<button id="sc-asof" title="换一天">改日期</button>' +
    '<button id="sc-asof-off" title="回到今天的快照">回到今天</button></span>'
}

function todayStr() {
  const d = new Date()
  const p = function (x) { return (x < 10 ? '0' : '') + x }
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate())
}

async function loadAsOfRange(market) {
  if (S.asOfRange[market]) return S.asOfRange[market]
  try {
    const r = await fetch('/api/quant/screener/history-range?market=' + encodeURIComponent(market),
                          { headers: apiHeaders(), cache: 'no-store' })
    const d = r.ok ? await r.json() : null
    if (d) S.asOfRange[market] = d
    return d
  } catch (e) { return null }
}

// prefill:从「最近一次命中」提示点进来时预先填好那天(按钮直接绑成 click 回调时第一个参数是事件,不当日期用)
async function openAsOfDialog(prefill) {
  const today = todayStr()
  const initial = (typeof prefill === 'string' && prefill) ? prefill : (S.asOf || today)
  const m = openModal(
    '<div class="modal-hd"><span class="hi hi-clock" style="color:var(--brand)"></span> 时间回溯' +
      '<span class="close" data-close>×</span></div>' +
    '<div class="modal-body">' +
      '<div class="field"><div class="lbl">跳到哪一天(按那天收盘)</div>' +
        '<input id="ao-date" type="date" value="' + esc(initial) + '" max="' + today + '"></div>' +
      '<div class="sc-note" id="ao-range" style="line-height:1.8">正在查能回溯的范围…</div>' +
      '<div class="sc-note" style="line-height:1.8;margin-top:8px">' +
        '回溯用的是每晚落库的全市场日线(约 320 个交易日),只有<b>价格 / 成交量类</b>字段能重算:' +
        '收盘、均线、EMA、RSI、区间高低、涨幅、均量、RS 评级、VCP。' +
        '<b>市值、PE、ROE、股息率这类财务字段没有历史值</b>,回溯时会整批「算不出」。' +
        '选今天 = 回到正常的快照扫描。</div>' +
      '<div class="sc-err" id="ao-err" style="display:none;margin-top:10px"></div>' +
    '</div>' +
    '<div class="modal-ft"><button class="btn" data-close>取消</button>' +
      '<button class="btn primary" id="ao-ok">跳转</button></div>')
  const inp = m.querySelector('#ao-date')
  const rangeEl = m.querySelector('#ao-range')
  loadAsOfRange(S.market).then(function (d) {
    if (!rangeEl) return
    if (!d || !d.min_date) {
      rangeEl.textContent = '这个市场还没有日线,回溯不了(日线由每晚的定时任务拉取)'
      return
    }
    if (inp) inp.min = d.min_date
    rangeEl.innerHTML = esc(MKT_LABEL[S.market] || S.market) + ' 的日线:<b>' + esc(d.min_date) +
      '</b> ~ <b>' + esc(d.max_date) + '</b>,' + d.n_codes + ' 只' +
      (d.full_from ? ' · 52 周高低 / 精确 RS 评级这类长窗口字段从 <b>' + esc(d.full_from) + '</b> 起才算得出' : '')
  })
  const go = function () {
    const v = inp ? String(inp.value || '').trim() : ''
    const err = m.querySelector('#ao-err')
    if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) {
      if (err) { err.textContent = '请选一个日期'; err.style.display = '' }
      return
    }
    if (v > today) {
      if (err) { err.textContent = '不能选未来的日期'; err.style.display = '' }
      return
    }
    setAsOf(v >= today ? null : v)
    m.remove()
  }
  const ok = m.querySelector('#ao-ok')
  if (ok) ok.addEventListener('click', go)
  if (inp) inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') go() })
}

function setAsOf(v) {
  if (v === S.asOf) return
  S.asOf = v
  // 旧结果是另一天的,留着会让人拿两天的数据对着看
  S.result = null; S.probe = {}; S.runError = null
  KC.cache.clear()          // 悬停日 K 按回溯日截断,缓存的是整段,换天要重画
  KC.asOf = S.asOf          // 截断口径交给公共模块(app.js),它不认识本页的 S
  render()
  toast(v ? '已回溯到 ' + v + ' 收盘 · 现在运行扫描就是按那天的数据' : '已回到今天')
}

function vRunBar() {
  const n = S.conditions.filter(function (c) { return c.is_bool && c.enabled }).length
  const official = isOfficialNow()
  // 原样的官方示例不扣扫描次数:次数用完了也照样能跑

  return '<div class="sc-runbar">' +

        : S.reveal ? '扫描完成 · <span id="sc-reveal-btn">' + S.reveal + '</span> 秒后显示'
        : used ? '今天的扫描次数已用完'
        : '<span class="hi hi-search"></span> 运行扫描') + '</button>' +
    '<button class="btn" id="sc-save"' + (S.conditions.length ? '' : ' disabled') +
      ' title="把当前的条件、开关状态、市场和排序存成一个扫描策略">' +
      '<span class="hi hi-save"></span> 保存扫描策略</button>' +
    vAsOf() + vQuota() +
    (official ? '<span class="sc-quota" style="background:#e6f1eb;color:#2f725b" title="改动任何一条条件、开关或市场后就不再是官方示例,运行会照常计次数">' +
      '官方示例「' + esc(S.officialPreset.name) + '」· 原样运行不计扫描次数</span>' : '') +

}

function vResult() {
  if (S.reveal) {
    return '<div class="panel" style="margin-top:14px"><div class="p-bd sc-reveal">' +
      '<b id="sc-reveal-n">' + S.reveal + '</b><span>扫描已完成,结果稍后显示。' +
      '每次扫描后等 ' + revealSeconds() + ' 秒再出结果 —— 数据源是免费通道,会员多了要一起省着用。</span></div></div>'
  }
  if (!S.result) return ''
  const r = S.result
  const stats = [
    [r.as_of ? '日线池' : '全市场', r.universe_total, ''], ['已扫描', r.scanned, ''],
    ['命中', r.matched, 'hit'], ['算不出', r.skipped_incomplete, ''],
  ].map(function (s) {
    return '<div class="s ' + s[2] + '"><div class="k">' + s[0] + '</div><div class="v">' +
      (Number.isFinite(s[1]) ? s[1] : NA) + '</div></div>'
  }).join('')
  const t = r.timing_ms || {}
  const timing = (Number.isFinite(t.fetch) ? '取数 ' + t.fetch + 'ms' : '') +
    (Number.isFinite(t.evaluate) ? ' · 求值 ' + t.evaluate + 'ms' : '')
  // 「回溯」只在用户点了时间回溯时才标(as_of_requested 非空)。时间序列模式正常扫描也会带 as_of(=日线最新一天),
  // 拿 as_of 判断会把普通「运行扫描」也标成回溯(2026-09-16 用户指出)
  const retro = r.as_of_requested != null
  return '<div class="panel' + (retro ? ' asof' : '') + '" style="margin-top:14px"><div class="p-hd">' +
    (retro ? '回溯扫描结果' : '扫描结果') +
    '<span class="cnt">' + esc(r.market_label || '') +
    (r.as_of ? ' · 截至 ' + esc(r.as_of) + ' 收盘' : '') +
    (r.returned != null ? ' · 显示前 ' + r.returned + ' 只' : '') + '</span></div>' +
    '<div class="sc-stat">' + stats + '</div>' +
    vWarn(r) + vLastHit(r) + vTable(r) +
    '<div class="sc-runbar">' +
      '<button class="btn small" id="sc-copy">复制命中代码</button>' +
      '<span class="sc-na" style="font-size:11.5px;margin-left:auto">' + esc(timing) + '</span>' +
    '</div></div>'
}

// ─── 官方示例 0 命中:最近一次命中的日子(2026-09-16 用户要求)────────────────
// 后端 screen_last_hit 在后台逐日跑真正的时间回溯往前找,没算好时是 pending,这里轮询。
// 只在「官方示例 · 普通扫描(没点时间回溯)· 0 命中」时出现;日期 / 只数全部来自后端,算不出就不显示
const LAST_HIT_API = '/api/quant/screener/last-hit'
function vLastHit(r) {
  const lh = r.last_hit
  if (!r.official_preset || r.matched !== 0 || r.as_of_requested != null || !lh) return ''
  if (lh.status === 'ready' && lh.date) {
    return '<div class="sc-lasthit"><span>距离今日最近一次扫描命中的日子为 <b>' + esc(lh.date) + '</b>' +
      (Number.isFinite(lh.matched) ? '(当天命中 ' + lh.matched + ' 只)' : '') + ',可以通过时间回溯查看详情。</span>' +
      '<button class="btn small" id="sc-lasthit-go" data-date="' + esc(lh.date) + '">' +
      '<span class="hi hi-clock"></span> 时间回溯</button></div>'
  }
  if (lh.status === 'pending') return '<div class="sc-lasthit dim">正在往前查找最近一次命中的日子…</div>'
  if (lh.status === 'none' && Number.isFinite(lh.searched_days) && lh.searched_days > 0) {
    return '<div class="sc-lasthit dim">往前查了 ' + lh.searched_days + ' 个交易日' +
      (lh.oldest ? '(到 ' + esc(lh.oldest) + ')' : '') + ',都没有命中。</div>'
  }
  return ''
}

let lastHitTimer = null
function watchLastHit() {
  clearTimeout(lastHitTimer)
  const r = S.result
  if (!r || !r.official_preset || !r.last_hit || r.last_hit.status !== 'pending') return
  const started = Date.now()
  const tick = async function () {
    if (S.result !== r) return                 // 结果换了(重跑 / 换回溯日),这次的轮询作废
    if (Date.now() - started > 16 * 60 * 1000) { r.last_hit = null; render(); return }
    let d = null
    try {
      const res = await fetch(LAST_HIT_API + '?market=' + encodeURIComponent(r.official_preset.market) +
        '&preset=' + encodeURIComponent(r.official_preset.key), { headers: apiHeaders(), cache: 'no-store' })
      d = res.ok ? await res.json() : null
    } catch (e) { d = null }
    if (S.result !== r) return
    if (d && d.status && d.status !== 'pending') {
      // idle = 服务重启过、后台任务没了;error = 查找失败 —— 都不显示,不猜
      r.last_hit = (d.status === 'ready' || d.status === 'none') ? d : null
      render(); return
    }
    lastHitTimer = setTimeout(tick, 3000)
  }
  lastHitTimer = setTimeout(tick, 3000)
}

function vWarn(r) {
  const ws = dropSrc(r.notes).concat(dropSrc(r.warnings))
  if (!ws.length) return ''
  return '<div class="sc-warn"><ul>' +
    ws.map(function (w) { return '<li>' + warnHtml(w) + '</li>' }).join('') + '</ul></div>'
}

function vTable(r) {
  const picks = r.picks || []
  if (!picks.length) {
    return '<div class="sc-note" style="padding:20px 4px;text-align:center">' +
      '没有一只满足全部条件。<br>把条件放宽一点再试 —— 或者看看上面「算不出」的数量,' +
      '如果它很大,说明这个市场缺你用到的字段。</div>'
  }
  const skip = { name: 1, description: 1, close: 1, currency: 1 }
  const cols = (r.columns || []).filter(function (c) { return !skip[c] })
  // 文字列(板块 / 行业 这类)列头和单元格一起靠左,数字列一起靠右 —— 按这次结果里的真实取值判断
  const isText = {}
  cols.forEach(function (c) {
    isText[c] = picks.some(function (p) { const v = (p.fields || {})[c]; return v != null && typeof v !== 'number' })
  })
  const head = '<tr><th>代码</th><th>名称</th><th data-sort="close" class="n">现价</th>' +
    cols.map(function (c) {
      // 中文列头 + 悬停看英文原名(与条件行一致);后端拿不准的字段 label 为空,照旧显示原名
      const lb = (r.column_labels || {})[c]
      return '<th data-sort="' + esc(c) + '"' + (isText[c] ? '' : ' class="n"') + ' title="' + esc(c) + '">' + esc(lb || c) +
        (S.sortBy === c ? '<span class="ar">' + (S.desc ? '↓' : '↑') + '</span>' : '') + '</th>'
    }).join('') + '</tr>'
  const rows = picks.map(function (p) {
    const f = p.fields || {}
    // data-kchart 是悬停日K 的钩子(见 §悬停日K)。没有 code 就不挂,
    // 免得弹出一个必然失败的空图。
    const kc = p.code
      ? ' data-kchart="' + esc(p.code) + '" data-kmarket="' + esc((S.resultScan && S.resultScan.market) || S.market) + '" data-kname="' + esc(String(p.name || '').slice(0, 34)) + '"'
      : ''
    return '<tr><td class="cd2"' + kc + '>' + esc(p.code || '') + '</td>' +
      '<td>' + (p.name ? esc(String(p.name).slice(0, 34)) : NA) + '</td>' +
      '<td class="n">' + plain(p.close) + ' <span class="sc-na">' + esc(p.currency || '') + '</span></td>' +
      cols.map(function (c) {
        const v = f[c]
        if (v == null) return '<td' + (isText[c] ? '' : ' class="n"') + '>' + NA + '</td>'
        if (typeof v === 'number') return '<td class="n">' + num(v) + '</td>'
        return '<td>' + esc(String(v).slice(0, 22)) + '</td>'
      }).join('') + '</tr>'
  }).join('')
  return '<div class="sc-scroll"><table class="sc-tb"><thead>' + head +
    '</thead><tbody>' + rows + '</tbody></table></div>'
}

function bind() {
  const inp = document.getElementById('mg-input')
  if (inp) {
    inp.addEventListener('input', function () { S.input = inp.value })
    inp.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); generate() }
    })
  }
  const gen = document.getElementById('mg-gen')
  if (gen) gen.addEventListener('click', function () { generate() })
  // 唯一会花 token 的入口
  const aiBtn = document.getElementById('mg-ai')
  if (aiBtn) aiBtn.addEventListener('click', function () { generate(true) })

  const mode = document.getElementById('mg-mode')
  if (mode) mode.addEventListener('click', function (e) {
    const b = e.target && e.target.closest ? e.target.closest('button') : null
    if (!b || !b.dataset.mode) return
    S.mode = b.dataset.mode; render()
  })
  const mkts = document.getElementById('mg-mkts')
  if (mkts) mkts.addEventListener('click', function (e) {
    const b = e.target && e.target.closest ? e.target.closest('button') : null
    if (!b || !b.dataset.mkt) return
    S.market = b.dataset.mkt; S.probe = {}; saveDraft()
    // 换市场要重新解析:字段在不同市场的可用性不一样(A 股没有的字段在美股有)

  })
  const eg = document.getElementById('mg-eg')

    const b = e.target && e.target.closest ? e.target.closest('button') : null

    if (b.dataset.del) { deleteSaved(+b.dataset.del); return }
    if (b.dataset.saved) { loadSavedPreset(+b.dataset.saved); return }
    if (b.dataset.hide) {
      const h = hiddenPresets()
      if (h.indexOf(b.dataset.hide) < 0) h.push(b.dataset.hide)
      setHiddenPresets(h); render(); return
    }
    if (!b.dataset.preset) return
    const p = ((S.meta && S.meta.presets) || []).filter(function (x) {
      return x.key === b.dataset.preset
    })[0]

  })

  const list = document.getElementById('cd-list')

    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); commitEdit(edt.value) }
    if (e.key === 'Escape') { S.editing = null; render() }
  })

  if (copyAll) copyAll.addEventListener('click', function () { copyText(buildScript(), '脚本') })
  const clr = document.getElementById('cd-clear')
  if (clr) clr.addEventListener('click', function () {

    const n = S.conditions.filter(function (c) { return c.is_bool }).length
    if (!confirm('清空全部 ' + n + ' 个条件和当前扫描结果?草稿也会一起清掉。')) return
    S.conditions = []; S.result = null; S.probe = {}; S.notes = []; S.parseWarnings = []
    S.combine = 'all'; S.plotExpr = ''; S.plotOrder = []; S.termHost = ''; S.extraPlots = []; S.draftPending = null; S.loadedName = ''; S.officialPreset = null; saveDraft(); render()
  })

  const run = document.getElementById('sc-run')
  if (run) run.addEventListener('click', runScan)
  const sv = document.getElementById('sc-save')
  if (sv) sv.addEventListener('click', openSaveDialog)
  const ao = document.getElementById('sc-asof')

  if (copy) copy.addEventListener('click', function () {
    const codes = ((S.result && S.result.picks) || []).map(function (p) { return p.code }).join('\n')
    copyText(codes, codes ? codes.split('\n').length + ' 个代码' : '')

    if (S.sortBy === c.dataset.sort) S.desc = !S.desc
    else { S.sortBy = c.dataset.sort; S.desc = true }
    resortResult()           // 不重新扫描、不扣次数(2026-09-14 用户要求,见 resortResult)
  })
