<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>扫描筛选 · 猎鹿人 Hunter</title>
  <link rel="stylesheet" href="style.css" />
  <!-- 悬停日K 用。版本与 backtest.html / workbench.html 一致,别各引各的 -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    /* ── 悬停日K 弹层 ───────────────────────────────────
       鼠标停在代码上弹出近一年日K,滚轮缩放,十字星读数。
       用 position:fixed —— 表格自己在 .sc-scroll 里横向滚动,
       用 absolute 会跟着滚出可视区。 */
    .kc-pop{
      position:fixed;z-index:120;width:560px;
      background:#fff;border:1px solid var(--line,#E8E0D6);border-radius:12px;
      box-shadow:0 18px 55px rgba(38,31,25,.16);padding:10px 12px 8px;
      opacity:0;pointer-events:none;transition:opacity .12s
    }
    .kc-pop.on{opacity:1;pointer-events:auto}
    .kc-hd{display:flex;align-items:baseline;gap:8px;font-size:12.5px;margin-bottom:5px}
    .kc-hd .sy{font-family:ui-monospace,Menlo,monospace;font-weight:700;color:var(--brand-dark)}
    .kc-hd .nm{color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .kc-hd .px{font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;font-weight:600}
    .kc-hd .px.up{color:var(--up,#a4332b)} .kc-hd .px.dn{color:var(--dn,#3f6b40)}
    .kc-box{height:252px}
    .kc-msg{height:252px;display:grid;place-items:center;text-align:center;
      color:var(--muted);font-size:12.5px;line-height:1.9;padding:0 24px}
    .kc-ft{font-size:10.5px;color:var(--soft,#a2a49d);margin-top:3px;display:flex;gap:10px}
    .kc-ft .r{margin-left:auto}
    /* 代码列:提示这里能悬停 */
    .sc-tb .cd2[data-kchart]{cursor:crosshair;border-bottom:1px dotted var(--line-strong,#cfcbbf)}
    .sc-tb .cd2[data-kchart]:hover{background:var(--brand-pale,#f6eee7)}
  </style>
  <style>
    /* ── 魔法筛选(生成区) ─────────────────────────────── */
    /* 卡片也要收住:只让 .mg-ta 变窄的话,卡片仍旧铺满 2000px 的屏,
       「生成」按钮右边空出一大片死区。1040 刚好装下
       追加/替换 + 市场 + 输入框(560) + 生成 这一行。 */
    .mg{background:#F2F8FE;border:1px solid #DCEBFA;border-radius:10px;padding:13px 15px 11px;
      max-width:1040px}
    .mg-hd{display:flex;align-items:center;gap:7px;color:#2E86DE;font-size:13.5px;
      font-weight:700;letter-spacing:.04em;margin-bottom:10px}
    .mg-row{display:flex;flex-wrap:wrap;gap:9px;align-items:stretch}
    .mg-seg{display:inline-flex;background:#fff;border:1px solid #DCEBFA;border-radius:8px;padding:3px}
    .mg-seg button{border:0;background:transparent;border-radius:6px;padding:6px 15px;cursor:pointer;
      font-size:13px;font-family:inherit;color:var(--muted)}
    .mg-seg button.on{background:#EDE4F7;color:#7B3FA8;font-weight:700}
    /* 生成框**不能**只写 flex:1 —— 宽屏上它会一直撑到屏幕边,
       把「生成」按钮甩到几百像素外,视线要横跨整屏才能从输入框走到按钮。
       给一个 max-width 收住,按钮就紧跟在它后面(2026-09-10 用户指出)。 */
    .mg-ta{flex:1 1 380px;min-width:240px;max-width:560px;box-sizing:border-box;
      min-height:40px;max-height:200px;resize:vertical;
      border:1px solid #DCEBFA;border-radius:8px;padding:9px 12px;background:#fff;color:var(--text);
      font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.55}
    .mg-ta:focus{outline:none;border-color:#2E86DE}
    /* 生成按钮和它下面那排(复制脚本/清空)竖着排成一列 */
    .mg-genwrap{display:flex;flex-direction:column;gap:7px}
    .mg-gen{border:0;background:#2E86DE;color:#fff;border-radius:8px;padding:0 22px;cursor:pointer;
      font-size:14px;font-weight:600;font-family:inherit;white-space:nowrap;display:flex;
      align-items:center;gap:7px;justify-content:center;min-height:40px;flex:1}
    .mg-gen:disabled{opacity:.5;cursor:not-allowed}
    .mg-genbar{display:flex;gap:6px}
    /* nowrap 不能省 —— 两个按钮平分「生成」那 122px 的话,
       「复制脚本」会被折成「复制脚 / 本」两行(实测)。
       nowrap 之后这一列按内容撑开,生成按钮跟着一起变宽,三个仍然左右对齐。 */
    .mg-genbar .btn{flex:1;justify-content:center;white-space:nowrap;padding:5px 10px}
    .mg-genbar .btn:disabled{opacity:.45;cursor:not-allowed}
    .mg-eg{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
    .mg-eg button{display:inline-flex;align-items:center;gap:7px;background:#fff;
      border:1px solid #DCEBFA;border-radius:8px;padding:6px 12px;cursor:pointer;
      font-size:12.5px;font-family:inherit;color:var(--text)}
    .mg-eg button:hover{border-color:#2E86DE;color:#2E86DE}
    .mg-eg .ar{color:#2E86DE;font-size:12px}
    /* 我保存的扫描策略 —— 用站内品牌棕,和系统示例的蓝色一眼能分开。
       ✕ 删除按钮**常驻可见**,不藏 hover(仓内铁律:新功能入口不许藏在 hover 里)。 */
    .mg-eg .mg-sep{width:1px;background:#DCEBFA;margin:4px 2px}
    .mg-eg .mg-mine{display:inline-flex;align-items:stretch;border:1px solid #e6cbaa;
      border-radius:8px;overflow:hidden;background:#fdf8f2}
    .mg-eg .mg-mine button{border:0;border-radius:0;background:transparent;margin:0;
      padding:6px 9px;font-size:12.5px;font-family:inherit;cursor:pointer;
      display:inline-flex;align-items:center;gap:6px}
    .mg-eg .mg-mine .nm{color:var(--brand-dark,#8f4f1d);font-weight:600;padding-left:11px}
    .mg-eg .mg-mine .nm:hover{background:#f6eee7;color:var(--brand-dark,#8f4f1d)}
    .mg-eg .mg-mine .nm .mk{font-weight:400;color:var(--muted);font-size:11px}
    .mg-eg .mg-mine .del{color:var(--soft,#a2a49d);border-left:1px solid #efe0cc;padding:6px 8px}
    .mg-eg .mg-mine .del:hover{color:var(--danger,#b34b43);background:#fbeceb}
    .mg-eg .mg-mine.on{border-color:var(--brand,#b56b2d);box-shadow:inset 0 0 0 1px var(--brand,#b56b2d)}

    /* ── 条件区 ────────────────────────────────────────── */
    .cd-hd{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:14.5px;
      color:var(--text);margin:16px 0 4px}
    .cd-hd b{font-weight:700}
    .cd-hd .mk{background:#FDF3E7;color:#A85F17;border-radius:6px;padding:2px 9px;font-size:12px;font-weight:600}
    .cd-hd .ai-badge{background:#EDE4F7;color:#7B3FA8;border-radius:6px;padding:2px 9px;
      font-size:12px;font-weight:600}
    .cd-hd .kw-badge{background:#E4F1E8;color:#2F7A52;border-radius:6px;padding:2px 9px;
      font-size:12px;font-weight:600}
    .kw-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:4px 0;
      border-bottom:1px dashed var(--line,#E8E0D6)}
    .kw-row:last-of-type{border-bottom:0}
    .kw-src{font-size:12.5px;color:var(--text);min-width:150px}
    .kw-arrow{color:var(--soft,#B9AFA2);font-size:12px}
    .kw-expr{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;
      background:#fff;border:1px solid var(--line,#E8E0D6);border-radius:5px;padding:2px 7px}
    details.ai-note{width:auto;max-width:760px;border-color:#DCEBFA;background:#F7FBFF}
    .ai-script{margin:8px 0 0;padding:9px 11px;background:#fff;border:1px solid #DCEBFA;
      border-radius:7px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;
      line-height:1.65;color:var(--text);white-space:pre-wrap;overflow-x:auto}
    .cd-list{border-left:2px dashed var(--line,#E8E0D6);padding-left:14px;margin-top:6px}
    .cd{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:7px 2px;
      border-bottom:1px solid transparent}
    .cd:hover{background:#FBFAF8}
    .cd.off{opacity:.42}
    .cd .nm{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--soft,#B9AFA2);
      min-width:112px;flex-shrink:0}
    /* body 不占 flex:1、acts 不用 margin-left:auto —— 按钮**紧跟条件内容**,
       条件写得长按钮就自然往右挪。
       原来是 `flex:1` + `margin-left:auto` 把按钮钉在最右边,条件短的时候
       中间空出一大片,眼睛要横扫整屏才能从"这条是什么"找到"这条的按钮",
       条件越短越难对上(2026-09-10 用户指出)。 */
    .cd .body{display:flex;align-items:center;flex-wrap:wrap;gap:6px;min-width:0}
    /* 不做 hover 才显形 —— 仓内铁律「入口不许藏在 hover 里」,
       而且开关的绿色本身就是"这条启不启用"的状态指示,淡化了就看不清。 */
    .cd .acts{display:flex;align-items:center;gap:3px;flex-shrink:0;margin-left:12px}
    .cd .acts button{border:0;background:transparent;cursor:pointer;padding:3px 5px;border-radius:5px;
      font-size:13px;line-height:1;color:var(--soft,#B9AFA2)}
    .cd .acts button:hover{background:#F0EBE4;color:var(--text)}
    .cd .acts button.del:hover{background:#FDECEC;color:#9B2C2C}

    .tk{font-size:13.5px}
    .tk.f{color:var(--text);font-weight:600}
    .tk.o{color:#B4429B;font-weight:600}
    .tk.l{color:#2E86DE;font-weight:700}
    .tk.p{color:var(--soft,#B9AFA2)}
    .tk.r{color:#7B3FA8;font-weight:600}
    .tk.k{color:var(--muted)}
    .sc-num{background:#1E2740;color:#fff;border:0;border-radius:5px;padding:3px 7px;
      font-family:ui-monospace,Menlo,monospace;font-size:12.5px;text-align:center;
      min-width:34px;font-weight:600}
    .sc-num:focus{outline:2px solid #2E86DE}
    .cd.off .sc-num{background:#9A9A9A}

    /* 选择器必须写成 `.cd .acts button.sw` —— 上面那条 `.cd .acts button{background:transparent}`
       特异性是 (0,2,1),裸 `.sw` 只有 (0,1,0),会被压掉。
       2026-09-10 实测症状:开关整个透明,只剩白色圆点浮在白底上 = 看不见,
       而 classList 和点击都正常,所以功能测试全绿也发现不了。 */
    .cd .acts button.sw{position:relative;width:32px;height:17px;border-radius:9px;
      background:#D6CFC5;cursor:pointer;flex-shrink:0;border:0;padding:0;margin:0 2px}
    .cd .acts button.sw:hover{background:#C9C1B6}
    .cd .acts button.sw.on{background:#3FB27F}
    .cd .acts button.sw.on:hover{background:#37A071}
    .cd .acts button.sw i{position:absolute;top:2px;left:2px;width:13px;height:13px;
      border-radius:50%;background:#fff;transition:left .15s}
    .cd .acts button.sw.on i{left:17px}

    /* editbox 占满一行(靠 .cd 的 flex-wrap 换行),里面的输入框只占三分之一宽 ——
       改的是一句短表达式,给一整屏宽度反而看不出光标在哪 */
    .cd-editbox{width:100%;margin-top:8px}
    .cd-edit{width:33%;min-width:300px;max-width:560px;box-sizing:border-box;
      border:1px solid #2E86DE;border-radius:7px;padding:8px 10px;
      font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--text);
      background:#fff;min-height:52px;resize:vertical;display:block}
    .cd-edit:focus{outline:none}
    .cd-editbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:7px}

    /* ── 通用 ──────────────────────────────────────────── */
    .sc-err{background:#FDECEC;border:1px solid #F3C9C9;color:#9B2C2C;border-radius:8px;
      padding:10px 13px;font-size:12.5px;line-height:1.7;margin-top:10px;white-space:pre-wrap}
    .sc-warn{background:#FDF3E7;border:1px solid #F0DCC0;color:#8A5A1B;border-radius:8px;
      padding:9px 12px;font-size:12px;line-height:1.7;margin-top:10px}
    .sc-warn ul{margin:0;padding-left:17px}
    .sc-warn li+li{margin-top:4px}
    .sc-note{color:var(--muted);font-size:11.5px;line-height:1.7;margin-top:8px}

    .sc-stat{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:10px}
    .sc-stat .s{background:var(--bg,#FAF7F3);border-radius:8px;padding:8px 12px;min-width:78px}
    .sc-stat .s .k{color:var(--muted);font-size:11px}
    .sc-stat .s .v{font-size:17px;font-weight:600;margin-top:1px;font-variant-numeric:tabular-nums}
    .sc-stat .s.hit .v{color:var(--brand-dark)}

    .sc-scroll{overflow-x:auto;border:1px solid var(--line,#E8E0D6);border-radius:8px;background:#fff}
    .sc-tb{border-collapse:collapse;width:100%;font-size:12.5px;white-space:nowrap}
    .sc-tb th,.sc-tb td{padding:7px 10px;border-bottom:1px solid var(--line,#E8E0D6);text-align:left}
    .sc-tb th{background:var(--bg,#FAF7F3);color:var(--muted);font-weight:500;font-size:11.5px;
      position:sticky;top:0;cursor:pointer;user-select:none}
    .sc-tb th .ar{color:var(--brand);margin-left:3px}
    .sc-tb td.n{text-align:right;font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
    .sc-tb tr:last-child td{border-bottom:none}
    .sc-tb .cd2{font-family:ui-monospace,Menlo,monospace;color:var(--brand-dark);font-weight:600}
    .sc-na{color:var(--soft,#B9AFA2)}

    .sc-syn{font-size:12px;line-height:1.85;color:var(--muted)}
    .sc-syn code{background:var(--bg,#FAF7F3);border-radius:4px;padding:1px 5px;
      font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--text)}
    .sc-syn b{color:var(--text);font-weight:600}
    details.sc-fold{border:1px solid var(--line,#E8E0D6);border-radius:8px;padding:9px 12px;
      margin-top:10px;background:#fff}
    details.sc-fold summary{cursor:pointer;font-size:12.5px;color:var(--text);font-weight:600}
    details.sc-fold[open] summary{margin-bottom:8px}
    .sc-fd{display:flex;gap:7px;margin-bottom:8px}
    .sc-fd input{flex:1;border:1px solid var(--line,#E8E0D6);border-radius:7px;padding:6px 10px;
      font-size:12.5px;font-family:inherit;color:var(--text);background:#fff}
    .sc-fd input:focus{outline:none;border-color:var(--brand)}
    .sc-fl{display:flex;flex-wrap:wrap;gap:5px;max-height:190px;overflow-y:auto}
    .sc-fl span{background:var(--bg,#FAF7F3);border-radius:5px;padding:3px 7px;cursor:pointer;
      font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--text)}
    .sc-fl span:hover{background:#FDF3E7;color:#A85F17}
    /* 有中文名的用正文字体(等宽体排中文很丑),并留一点标记表示可悬停看英文 */
    .sc-fl span.cn{font-family:inherit;font-size:12px;border-bottom:1px dotted var(--soft,#B9AFA2)}
    /* 族标签:一眼看出这是一组,右上角是周期个数 */
    .sc-fl span.fam{font-family:inherit;font-size:12px;background:#EDE4F7;color:#7B3FA8;
      border-bottom:0;font-weight:600}
    .sc-fl span.fam b{margin-left:5px;font-size:10px;background:#7B3FA8;color:#fff;
      border-radius:8px;padding:0 5px;font-weight:600}
    .sc-fl span.fam.on{background:#7B3FA8;color:#fff}
    .sc-fl span.fam.on b{background:#fff;color:#7B3FA8}
    .sc-fl span.sub{margin-left:2px;background:#F6F1FB}

    .sc-runbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:14px}
    /* 左右留边 —— 与 agent.html 的 .ag-wrap 同一套(padding:0 20px 40px)。
       原来一条都没写,条件行的文字直接贴在窗口左边缘上。 */
    .sc-wrap{padding:0 20px 40px;display:flex;flex-direction:column;gap:12px}
    /* 说明性区块(条件区下面的提示、语法速查、可用字段)收成三分之一宽。
       它们都是「看一眼就走」的辅助信息,铺满整屏只会把真正要看的条件挤下去。
       选择器限定 `.sc-wrap >` —— 结果面板里的 .sc-warn 是另一回事,不受影响。
       min-width 兜住窄屏,不然在手机上会挤成一列字。 */
    .sc-wrap>.sc-warn,
    .sc-wrap>details.sc-fold{width:33%;min-width:360px;box-sizing:border-box}
    /* grid 子项默认 min-width:auto,不加这行结果面板会被宽表撑破,
       内层 .sc-scroll 的 overflow-x 会完全失效(2026-09-10 实测) */
    .sc-wrap>*{min-width:0}
  </style>
</head>
<body>
<script src="app.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════
// 扫描筛选 · 对齐 chartink 的「魔法筛选 + 可视条件行」交互
//
// 用 renderShell('agent', …) —— 顶栏高亮仍停在「小鹿智能体」。
// 它是小鹿的取数入口(候选票从哪来),不是并列的第六个一级功能。
//
// ── 数据模型:脚本就是模型 ────────────────────────────────────────
// 界面上一行条件 = 脚本里一句 `def`;「同时满足以下全部条件」= `plot scan = a and b …`。
// 不另造一套条件对象再翻译回脚本 —— 那样前端认为的条件和后端真正跑的
// 会慢慢漂移,而且两边单独看都"对",极难发现。
// 所以:改任何东西都回写成脚本 → 送后端 /parse 重新解析 → 用返回的条件重渲染。
// 启用状态也不用前端自己记:build_script 只把启用的写进 plot,
// 解析回来 plot_refs 里有谁谁就是启用的,天然闭环。
//
// ── 三条边界写死在界面上 ────────────────────────────────────────
// 延迟 15 分钟 / 只有快照没有历史不能回测 / 市值口径与站内不一致。
// 后端每次都带 warnings,这里原样渲染,不折叠、不做"下次不再提示"。
// ═══════════════════════════════════════════════════════════════════
document.body.innerHTML = renderShell('agent', '策略广场 / 扫描筛选',
  '写筛选脚本 · 扫全市场找候选票',
  '<a class="btn small" href="/strategies/agent.html">← 回小鹿智能体</a>')

const container = document.getElementById('page-content')
const META_API  = '/api/quant/screener/meta'
const PARSE_API = '/api/quant/screener/parse'
const RUN_API   = '/api/quant/screener/run'
const FIELD_API = '/api/quant/screener/fields'

const NA = '<span class="sc-na">—</span>'
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;')
}
function num(v) {
  if (!Number.isFinite(v)) return NA
  const a = Math.abs(v)
  if (a >= 1e8) return (v / 1e8).toFixed(2) + '亿'
  if (a >= 1e4) return (v / 1e4).toFixed(1) + '万'
  return v.toFixed(2)
}
function plain(v) { return Number.isFinite(v) ? v.toFixed(2) : (v == null ? NA : esc(v)) }

// ─── 状态 ─────────────────────────────────────────────────────────
const S = {
  meta: null, metaErr: null,
  market: 'us',
  input: '',                 // 生成框里的原文
  mode: 'append',            // append | replace
  conditions: [],            // 已生效的条件行(后端 /parse 产出)
  combine: 'all',            // all | custom
  plotName: 'scan', plotExpr: '',
  notes: [], parseWarnings: [],
  editing: null,             // 正在编辑原文的条件名
  pending: '',               // 正在生成的那段原文(S.input 会被清空,按钮文案要靠它)
  ai: null,                  // 这批条件是 AI 翻的话:{model, script, source_text, ...}
  kw: null,                  // 这批条件是本地关键词匹配出来的话:{matched, script, ...}
  fieldRows: [],             // 字段搜索结果(含折叠的族)
  fieldOpen: {},             // 哪些族被点开了
  canTryAi: false,           // 本地两条路都不通 —— 弹「AI 识别」按钮问用户要不要花 token
  aiText: '',                // 点 AI 识别时要重发的原文
  generating: false, running: false,
  genError: null, runError: null,
  result: null,
  probe: {},                 // 条件名 → 单独测试的命中数
  saved: [], savedErr: null, savedMax: 50,   // 我保存的扫描策略(后端 per-user)
  loadedName: '',            // 当前这套条件是从哪个保存的策略加载来的 —— 保存弹窗默认填它,
                             // 「改完再存一次」直接回车就是覆盖,不用重新打名字
  sortBy: 'market_cap_basic', desc: true,
}

const LS = 'hunter_screener_script_v2'
const LS_MK = 'hunter_screener_market'
function saveDraft() {
  try {
    localStorage.setItem(LS, buildScript(true))
    localStorage.setItem(LS_MK, S.market)
  } catch (e) { /* 隐私模式会抛,草稿丢了不影响用 */ }
}

// ─── 条件 → 脚本(与后端 build_script 同规则) ──────────────────────
// 停用的条件**保留 def**、只是不进 plot —— 重新启用时原文一字不差地回来。
function buildScript(allEnabled) {
  const lines = []
  const on = []
  S.conditions.forEach(function (c) {
    if (!c.expr) return
    lines.push('def ' + c.name + ' = ' + c.expr + ';')
    if (c.is_bool && (allEnabled || c.enabled)) on.push(c.name)
  })
  if (!lines.length) return ''
  if (S.combine === 'custom' && S.plotExpr) {
    lines.push('plot ' + S.plotName + ' = ' + S.plotExpr + ';')
  } else if (on.length) {
    lines.push('plot ' + S.plotName + ' = ' + on.join(' and ') + ';')
  } else {
    lines.push('plot ' + S.plotName + ' = false;')
  }
  return lines.join('\n')
}

// 用户是在写脚本还是在说大白话 —— 与后端 screen_nl.looks_like_script 同一判据。
// 只用来决定按钮显示「解析中」还是「识别中」;真正走哪条路由后端说了算,
// 前端猜错顶多是文案不准,不影响结果。
function looksLikeScript(t) {
  return /(^|\n)\s*(def|plot)\s+[A-Za-z_]/.test(t || '')
}

// 某个名字有没有被别的条件引用
function referenced(name, exceptIdx) {
  const re = new RegExp('\\b' + name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b')
  return S.conditions.some(function (o, j) {
    return j !== exceptIdx && re.test(o.expr || '')
  })
}

// 清掉没人引用的中间变量。
//
// 变量在界面上不显示,所以一旦没人引用就成了**看不见又删不掉**的死代码:
// 它还会白白多请求一列扫描源字段。删条件/改表达式之后必须跑一次。
// 循环到不动为止 —— 变量可以引用变量(def a = …; def b = a * 2;),
// 删掉 b 之后 a 才变成孤儿。
//
// 只在**我们自己造成孤儿**的时候跑(删除/编辑/改数字)。用户刚粘进来的脚本
// 不动 —— 那是他的原文,里面有个没用到的变量也是他的事,静默改掉会让
// 「复制脚本」copy 出来的东西和他粘进去的对不上。
function pruneVars() {
  let changed = true
  while (changed) {
    changed = false
    for (let i = S.conditions.length - 1; i >= 0; i--) {
      const c = S.conditions[i]
      if (c.is_bool) continue
      if (!referenced(c.name, i)) { S.conditions.splice(i, 1); changed = true }
    }
  }
}

// 结构变了 → 清孤儿 → 回写脚本 → 重新解析(拿到最新 tokens)
function rebuild() { pruneVars(); return reparse(buildScript()) }

// ═══ 魔法筛选(生成区) ═══════════════════════════════════════════

        esc(S.input) + '</textarea>' +

      // (生成框产出的条件),原来钉在条件区标题的最右端,和生成隔了整整一屏。
      '<div class="mg-genwrap">' +

          // 大白话要过一次 LLM,几秒起步。文案说清在等什么,不然用户以为卡死了
          (S.generating ? (looksLikeScript(S.pending) ? '解析中…' : '识别中…')
                        : '<span class="hi hi-play"></span> 生成') + '</button>' +

    // 本地认不出来时**不直接烧 token**,把「AI 识别」摆出来让用户自己决定。
    // 按钮上写清「会消耗 token」—— 花钱的动作必须是用户明示的。
    (S.genError
      ? '<div class="sc-err">' + esc(maskSrc(S.genError)) +
        (S.canTryAi
          ? '<div class="sc-runbar" style="margin-top:9px">' +
              '<button class="btn small" id="mg-ai"' + (S.generating ? ' disabled' : '') + '>' +
                (S.generating ? '识别中…' : '✨ 用 AI 识别') + '</button>' +
              '<span style="font-size:11.5px;color:#9B2C2C">' +

          : '') +

      : '') +
    (S.metaErr ? '<div class="sc-err">读不到扫描配置:' + esc(maskSrc(S.metaErr)) +
      '\n后端可能还没部署 /api/quant/screener/*。界面骨架照常显示,但生成和扫描都会失败。</div>' : '')

// ═══ 条件行 ═══════════════════════════════════════════════════════
function vTok(t, ci, ti) {
  if (t.k === 'num') {
    return '<input class="sc-num" data-c="' + ci + '" data-t="' + ti + '" ' +
      'value="' + esc(t.t) + '" size="' + Math.max(1, String(t.t).length) + '" ' +
      'aria-label="数值" />'
  }
  const cls = { field: 'f', op: 'o', logic: 'l', paren: 'p', ref: 'r', kw: 'k' }[t.k] || ''
  return '<span class="tk ' + cls + '">' + esc(t.t) + '</span>'
}

function vCond(c, i) {
  // 中间变量(def sma50 = Average(close,50))**不渲染**。
  //
  // 它不是条件,是实现细节:引用它的条件已经把它的标签内联显示了
  // (cond_sma20_50 渲染成「20日均线 大于 50日均线」,而不是「sma20 大于 sma50」),
  // 所以单独占一行只是噪音 —— 一份 7 条件的脚本会多出 5 行看不懂的东西。
  // chartink 也是这么处理的:它把指标直接写进条件行,没有变量的概念。
  //
  // 变量仍然留在脚本里(buildScript 照写),只是界面上不出现。
  // 配套的是 pruneVars():条件被删/改之后没人引用的变量自动清掉 ——
  // 否则会留下**看不见又删不掉**的死代码。
  if (!c.is_bool) return ''
  const off = !c.enabled
  const body = (c.tokens || []).map(function (t, ti) { return vTok(t, i, ti) }).join(' ')
  const sw = '<button class="sw ' + (c.enabled ? 'on' : '') + '" data-act="toggle" data-i="' + i +
      '" title="' + (c.enabled ? '停用这条(保留原文)' : '启用这条') + '"><i></i></button>'
  const probe = S.probe[c.name]
  const probeTxt = probe === undefined ? '' :
    (probe === null ? '<span class="sc-na" style="font-size:11px">单独测试失败</span>'
      : '<span style="font-size:11px;color:var(--brand-dark)">单独命中 ' + probe + '</span>')
  return '<div class="cd' + (off ? ' off' : '') + '">' +
    '<span class="nm">' + esc(c.name) + '</span>' +
    '<span class="body">' + body + ' ' + probeTxt + '</span>' +
    '<span class="acts">' +
      '<button data-act="edit" data-i="' + i + '" title="编辑原文">✎</button>' +
      '<button data-act="dup" data-i="' + i + '" title="复制一条">⧉</button>' +
      '<button data-act="copy" data-i="' + i + '" title="复制脚本文本">⎘</button>' +
      '<button data-act="probe" data-i="' + i + '" title="只用这一条扫一次">🐞</button>' +
      sw +
      '<button class="del" data-act="del" data-i="' + i + '" title="删除">✕</button>' +
    '</span>' +
    (S.editing === c.name
      ? '<div class="cd-editbox">' +
          '<textarea class="cd-edit" id="cd-edit" spellcheck="false">' + esc(c.expr) + '</textarea>' +
          '<div class="cd-editbar">' +
            '<button class="btn small" id="cd-save">保存</button>' +
            '<button class="btn small" id="cd-cancel">取消</button>' +
            '<span class="sc-note" style="margin:0">写原始表达式,分号不用写 · ' +
            'Ctrl/Cmd + Enter 保存 · Esc 取消</span>' +
          '</div>' +
        '</div>'
      : '') +
    '</div>'
}

function vConditions() {
  if (!S.conditions.length) {
    return '<div class="sc-note" style="padding:22px 4px">' +
      '还没有条件。把筛选脚本粘进上面的框里点「生成」,或者直接点一个示例。</div>'
  }
  const onCount = S.conditions.filter(function (c) { return c.is_bool && c.enabled }).length
  const mk = (S.meta && (S.meta.markets || []).filter(function (m) { return m.key === S.market })[0]) || null
  // 复制脚本 / 清空已经挪到生成按钮正下方(vMagic),这里只留标题
  return '<div class="cd-hd">股票需<b>同时满足</b>以下<b>' + onCount + '</b> 个条件' +
      (mk ? '<span class="mk">' + esc(mk.label) + '</span>' : '') +
      (S.ai ? '<span class="ai-badge">AI 翻译</span>' : '') +
      (S.kw ? '<span class="kw-badge">本地识别</span>' : '') +
    '</div>' +
    vKwNote() + vAiNote() +
    (S.combine === 'custom'
      ? '<div class="sc-warn">这个脚本的最终条件不是「若干条件全部满足」,而是自定义组合:' +
        '<code>' + esc(S.plotExpr) + '</code>。所以下面每一条不能单独停用 —— ' +
        '停用开关会改变组合的含义。要逐条开关,请把最后一句改成 ' +
        '<code>plot scan = 条件A and 条件B;</code> 的形式。</div>'
      : '') +
    '<div class="cd-list" id="cd-list">' +
      S.conditions.map(vCond).join('') +
    '</div>' +
    vNotes()
}

// ─── 页面上不出现上游数据源的名字(2026-09-10 产品要求) ──────────
// **只改这个页面的展示**:后端照旧返回这些提示,MCP 工具那边也照旧收得到
// (模型需要知道"数据是延迟的"才不会拿盘中数据下结论)。
//
// 两种处理,别混:
//   · 提示条(notes / warnings)—— 整条丢掉。它们本来就只是提醒。
//   · 报错文案 —— 只把名字换掉,不能整条丢:丢了用户就不知道为什么失败了。
const SRC_ALIAS = '行情源'
// 要挡掉的提示,按**内容前缀**匹配 —— 不能再按厂商名匹配了:
// 2026-09-10 后端把文案里的厂商名换成中性词之后,按名字过滤的规则当场失效,
// 这两条提示又冒回页面上。用前缀是脆的,所以规则写在这里、并在后端那两个
// 常量(DELAY_WARN / MARKET_CAP_WARN)旁边留了指向本处的注释:改文案要同步改这里。
const DROP_PREFIX = ['免订阅通道数据延迟', 'market_cap_basic 是']
function dropSrc(list) {
  return (list || []).filter(function (w) {
    const t = String(w)
    if (t.indexOf('TradingView') >= 0) return false          // 兜底:万一哪里漏改
    return !DROP_PREFIX.some(function (p) { return t.indexOf(p) === 0 })
  })
}
function maskSrc(s) {
  return String(s == null ? '' : s).replace(/TradingView/g, SRC_ALIAS)
}

// 本地关键词匹配的可审计凭据:哪一句变成了哪个表达式。
// 规则匹配不会像模型那样瞎编,但会**理解偏**(比如把"量"当成成交量而不是量比),
// 所以逐句对照必须摆出来 —— 和 AI 那份一个道理。
function vKwNote() {
  if (!S.kw) return ''
  const rows = (S.kw.matched || []).map(function (m) {
    return '<div class="kw-row"><span class="kw-src">' + esc(m.text) + '</span>' +
      '<span class="kw-arrow">→</span>' +
      '<code class="kw-expr">' + esc(m.expr) + '</code></div>'
  }).join('')
  // 有损近似(「上穿」只能按"当前在上方"判断)**不能**放进折叠区,也不能走
  // parseWarnings —— 生成之后前端会再 reparse 一次脚本,脚本走不到关键词分支,
  // warnings 会被覆盖成没有这条(2026-09-11 实测:接口返回了,页面上没有)。
  // 挂在 S.kw 上,reparse 之后 generate 会把它补回来。
  const lossy = (S.kw.notes || []).length
    ? '<div class="sc-warn"><ul>' + S.kw.notes.map(function (n) {
        return '<li>' + esc(maskSrc(n)).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>') + '</li>'
      }).join('') + '</ul></div>'
    : ''
  return lossy + '<details class="sc-fold ai-note"><summary>' +
      '本地识别把「' + esc(String(S.kw.source_text || '').slice(0, 40)) +
      '」拆成了这些条件 · 点开逐句对照' +
    '</summary>' + rows +
    '<div class="sc-note">关键词匹配,<b>未使用 AI、零成本</b>。' +
    '理解偏了的话直接改下面的条件,或者换个说法重新生成。</div></details>'
}

// AI 翻译的可审计凭据:原话 + 它实际写出来的脚本。
// 只显示"AI 翻译"四个字是不够的 —— 用户没法判断它有没有理解对,
// 必须能看见它到底写了什么(仓内铁律:AI 产出要可核对,不能只给结论)。
function vAiNote() {
  if (!S.ai) return ''
  return '<details class="sc-fold ai-note"><summary>' +
      'AI 把「' + esc(String(S.ai.source_text || '').slice(0, 40)) + '」翻成了这些条件 · 点开看它写的脚本' +
    '</summary>' +
    '<pre class="ai-script">' + esc(S.ai.script || '') + '</pre>' +
    '<div class="sc-note">模型 ' + esc(S.ai.model || '') +
      (S.ai.attempts > 1 ? ' · 第 ' + S.ai.attempts + ' 次才通过校验' : '') +
      ' · 脚本已通过语法与字段校验,但<b>是否符合你的本意要你自己确认</b>。' +
      '不对的话直接改下面的条件,或者换个说法重新生成。</div></details>'
}

function vNotes() {
  const ws = dropSrc(S.notes).concat(dropSrc(S.parseWarnings))
  if (!ws.length) return ''
  return '<div class="sc-warn"><ul>' +
    ws.map(function (w) { return '<li>' + esc(w) + '</li>' }).join('') + '</ul></div>'
}

// ═══ 结果 ═════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════════
// 我保存的扫描策略
// ═══════════════════════════════════════════════════════════════
// 后端 per-user 存(services/screen_saved.py,那里写了为什么不存 localStorage)。
//
// 三个容易写错的点:
//   1. 保存必须 buildScript(false)。草稿用的 true 会把停用的条件也写进 plot,
//      加载回来用户关掉的开关全亮了。false 只写启用的,加载时 reparse →
//      applyParsed 按 plot_refs 恢复开关,往返一致。
//   2. 加载 = **替换**,不管上面「追加/替换」选的是哪个。那个开关管的是
//      「生成框里的新条件怎么合进来」;加载一个存好的策略是「回到那套设置」,
//      追加进去就变成两套条件的混合,不是用户要的东西。
//   3. 同名覆盖要确认 —— 但如果名字就是刚加载的那个(用户在「改完再存」),
//      不弹确认,那是预期行为,弹了反而烦。
const SAVED_API = '/api/quant/screener/saved'
const MKT_LABEL = { a: 'A股', hk: '港股', us: '美股' }

function vSavedChips() {
  if (S.savedErr) {
    return '<span class="mg-sep"></span><span class="sc-na" style="font-size:12px;align-self:center">' +
      '我的扫描策略没拉到 · ' + esc(S.savedErr) + '</span>'
  }
  if (!S.saved.length) return ''
  return '<span class="mg-sep"></span>' + S.saved.map(function (p) {
    return '<span class="mg-mine' + (p.name === S.loadedName ? ' on' : '') + '">' +
      '<button class="nm" data-saved="' + p.id + '" title="加载「' + esc(p.name) + '」(替换当前条件)">' +
        '<span class="hi hi-save"></span>' + esc(p.name) +
        '<span class="mk">' + esc(MKT_LABEL[p.market] || p.market) + '</span></button>' +
      '<button class="del" data-del="' + p.id + '" title="删除「' + esc(p.name) + '」">✕</button>' +
    '</span>'
  }).join('')
}

async function loadSaved() {
  let r
  try {
    r = await fetch(SAVED_API, { headers: apiHeaders(), cache: 'no-store' })
  } catch (e) {
    S.savedErr = '请求没发出去'; render(); return
  }
  // 没登录:不显示也不报错 —— 列表本来就是空的。点「保存」时才提示要登录。
  if (r.status === 401) { S.saved = []; S.savedErr = null; render(); return }
  if (!r.ok) { S.savedErr = 'HTTP ' + r.status; render(); return }
  try {
    const d = await r.json()
    S.saved = d.items || []
    S.savedMax = d.max || 50
    S.savedErr = null
  } catch (e) { S.savedErr = '返回的不是合法 JSON' }
  render()
}

function openSaveDialog() {
  if (!S.conditions.length) return
  const bools = S.conditions.filter(function (c) { return c.is_bool })
  const on = bools.filter(function (c) { return c.enabled }).length
  const m = openModal(
    '<div class="modal-hd"><span class="hi hi-save" style="color:var(--brand)"></span> 保存扫描策略' +
      '<span class="close" data-close>×</span></div>' +
    '<div class="modal-body">' +
      '<div class="field"><div class="lbl">名称</div>' +
        '<input id="sv-name" maxlength="30" autocomplete="off" ' +
        'placeholder="比如:美股放量突破 · 市值大于 100 亿" value="' + esc(S.loadedName) + '"></div>' +
      '<div class="sc-note" style="line-height:1.8">会保存 <b>' + bools.length + '</b> 个条件' +
        (bools.length !== on ? '(其中 <b>' + on + '</b> 个启用,停用的也一起存,加载回来开关不变)' : '') +
        ' · 市场 <b>' + esc(MKT_LABEL[S.market] || S.market) + '</b>' +
        ' · 排序 <b>' + esc(S.sortBy || '—') + '</b> ' + (S.desc ? '↓' : '↑') + '<br>' +
        '同名会覆盖原来那个。保存后会出现在示例按钮那一排,点一下就能加载回来。</div>' +
      '<div class="sc-err" id="sv-err" style="display:none;margin-top:10px"></div>' +
    '</div>' +
    '<div class="modal-ft"><button class="btn" data-close>取消</button>' +
      '<button class="btn primary" id="sv-ok">保存</button></div>')
  const inp = m.querySelector('#sv-name')
  if (inp) { inp.focus(); inp.select() }
  const go = function () { doSave(inp ? inp.value : '', m) }
  const ok = m.querySelector('#sv-ok')
  if (ok) ok.addEventListener('click', go)
  if (inp) inp.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); go() }
  })
}

async function doSave(raw, modal) {
  const name = String(raw || '').trim()
  const err = modal.querySelector('#sv-err')
  const show = function (t) { if (err) { err.textContent = t; err.style.display = t ? '' : 'none' } }
  if (!name) { show('给这个扫描策略起个名字'); return }
  const dup = S.saved.filter(function (p) { return p.name === name })[0]
  if (dup && name !== S.loadedName &&
      !confirm('已经有一个叫「' + name + '」的扫描策略了,覆盖它吗?')) return
  const btn = modal.querySelector('#sv-ok')
  if (btn) { btn.disabled = true; btn.textContent = '保存中…' }
  const r = await post(SAVED_API, {
    name: name,
    market: S.market,
    // ⚠️ 必须是 false,见本节开头第 1 条
    script: buildScript(false),
    sort_by: S.sortBy,
    sort_desc: S.desc,
  })
  if (btn) { btn.disabled = false; btn.textContent = '保存' }
  if (r.status === 401) { show('登录后才能保存扫描策略'); return }
  if (!r.ok) { show(errOf(r, '保存失败 · HTTP ' + r.status)); return }
  modal.remove()
  S.loadedName = name
  await loadSaved()
  toast((r.data && r.data.created ? '已保存' : '已覆盖') + '「' + name + '」', 'success')
}

async function loadSavedPreset(id) {
  const p = S.saved.filter(function (x) { return x.id === id })[0]
  if (!p) return
  const before = S.conditions.filter(function (c) { return c.is_bool }).length
  const prevMarket = S.market
  S.market = p.market
  if (p.sort_by) { S.sortBy = p.sort_by; S.desc = !!p.sort_desc }
  S.input = ''
  S.genError = null
  await reparse(p.script)
  if (S.genError) {
    // 解析失败(比如上游撤掉了某个字段):条件没换,市场也退回去,别让界面处于半加载状态
    S.market = prevMarket
    S.loadedName = ''
    render()
    return
  }
  S.loadedName = p.name
  render()
  toast('已加载「' + p.name + '」' + (before ? ' · 替换了原来的 ' + before + ' 个条件' : ''))
}

async function deleteSaved(id) {
  const p = S.saved.filter(function (x) { return x.id === id })[0]
  if (!p) return
  if (!confirm('删除扫描策略「' + p.name + '」?删了不能恢复。')) return
  let r
  try {
    r = await fetch(SAVED_API + '/' + encodeURIComponent(id),
                    { method: 'DELETE', headers: apiHeaders() })
  } catch (e) { toast('删除失败:请求没发出去', 'warn'); return }
  if (!r.ok) {
    let d = null
    try { d = await r.json() } catch (e) { /* 非 JSON */ }
    toast((d && d.detail) || ('删除失败 · HTTP ' + r.status), 'warn')
    return
  }
  if (S.loadedName === p.name) S.loadedName = ''
  await loadSaved()
  toast('已删除「' + p.name + '」')
}

function vResult() {

function vWarn(r) {

function vTable(r) {
  const picks = r.picks || []
  if (!picks.length) {
    return '<div class="sc-note" style="padding:20px 4px;text-align:center">' +
      '没有一只满足全部条件。<br>把条件放宽一点再试 —— 或者看看上面「算不出」的数量,' +
      '如果它很大,说明这个市场缺你用到的字段。</div>'
  }
  const skip = { name: 1, description: 1, close: 1, currency: 1 }
  const cols = (r.columns || []).filter(function (c) { return !skip[c] })
  const head = '<tr><th>代码</th><th>名称</th><th data-sort="close" class="n">现价</th>' +
    cols.map(function (c) {
      return '<th data-sort="' + esc(c) + '" class="n">' + esc(c) +
        (S.sortBy === c ? '<span class="ar">' + (S.desc ? '↓' : '↑') + '</span>' : '') + '</th>'
    }).join('') + '</tr>'
  const rows = picks.map(function (p) {
    const f = p.fields || {}
    // data-kchart 是悬停日K 的钩子(见 §悬停日K)。没有 code 就不挂,
    // 免得弹出一个必然失败的空图。
    const kc = p.code
      ? ' data-kchart="' + esc(p.code) + '" data-kname="' + esc(String(p.name || '').slice(0, 34)) + '"'
      : ''
    return '<tr><td class="cd2"' + kc + '>' + esc(p.code || '') + '</td>' +
      '<td>' + (p.name ? esc(String(p.name).slice(0, 34)) : NA) + '</td>' +
      '<td class="n">' + plain(p.close) + ' <span class="sc-na">' + esc(p.currency || '') + '</span></td>' +
      cols.map(function (c) {
        const v = f[c]
        if (v == null) return '<td class="n">' + NA + '</td>'
        if (typeof v === 'number') return '<td class="n">' + num(v) + '</td>'
        return '<td>' + esc(String(v).slice(0, 22)) + '</td>'
      }).join('') + '</tr>'
  }).join('')
  return '<div class="sc-scroll"><table class="sc-tb"><thead>' + head +
    '</thead><tbody>' + rows + '</tbody></table></div>'
}

function render() {
  const html = '<div class="sc-wrap">' + vMagic() + vConditions() + vRunBar() +
    vResult() + vHelp() + '</div>'
  container.innerHTML = html
  bind()
  const ed = document.getElementById('cd-edit')
  if (ed) { ed.focus(); ed.setSelectionRange(ed.value.length, ed.value.length) }
  return html
}

function bind() {
  const inp = document.getElementById('mg-input')
  if (inp) {
    inp.addEventListener('input', function () { S.input = inp.value })
    inp.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); generate() }
    })
  }
  const gen = document.getElementById('mg-gen')
  if (gen) gen.addEventListener('click', function () { generate() })
  // 唯一会花 token 的入口
  const aiBtn = document.getElementById('mg-ai')
  if (aiBtn) aiBtn.addEventListener('click', function () { generate(true) })

  const mode = document.getElementById('mg-mode')
  if (mode) mode.addEventListener('click', function (e) {
    const b = e.target && e.target.closest ? e.target.closest('button') : null
    if (!b || !b.dataset.mode) return
    S.mode = b.dataset.mode; render()
  })
  const mkts = document.getElementById('mg-mkts')
  if (mkts) mkts.addEventListener('click', function (e) {
    const b = e.target && e.target.closest ? e.target.closest('button') : null
    if (!b || !b.dataset.mkt) return
    S.market = b.dataset.mkt; S.probe = {}; saveDraft()
    // 换市场要重新解析:字段在不同市场的可用性不一样(A 股没有的字段在美股有)
    if (S.conditions.length) reparse(buildScript()); else render()
  })
  const eg = document.getElementById('mg-eg')
  if (eg) eg.addEventListener('click', function (e) {
    const b = e.target && e.target.closest ? e.target.closest('button') : null
    if (!b) return
    if (b.dataset.del) { deleteSaved(+b.dataset.del); return }
    if (b.dataset.saved) { loadSavedPreset(+b.dataset.saved); return }
    if (!b.dataset.preset) return
    S.loadedName = ''         // 换成系统示例了,就不再是「基于我那个策略」
    const p = ((S.meta && S.meta.presets) || []).filter(function (x) {
      return x.key === b.dataset.preset
    })[0]
    if (!p) return
    S.input = p.script
    if (p.market) S.market = p.market
    generate()
  })

  const list = document.getElementById('cd-list')
  if (list) list.addEventListener('click', onCondAction)
  if (list) list.addEventListener('change', onNumChange)
  const edt = document.getElementById('cd-edit')
  if (edt) edt.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); commitEdit(edt.value) }
    if (e.key === 'Escape') { S.editing = null; render() }
  })
  // 快捷键之外必须有按钮 —— 只写「Ctrl+Enter 生效」等于把保存藏起来,
  // 用户改完看不到任何可点的东西,会以为编辑功能是坏的(2026-09-10 用户指出)
  const save = document.getElementById('cd-save')
  if (save) save.addEventListener('click', function () {
    const t = document.getElementById('cd-edit')
    if (t) commitEdit(t.value)
  })
  const cancel = document.getElementById('cd-cancel')
  if (cancel) cancel.addEventListener('click', function () { S.editing = null; render() })

  const copyAll = document.getElementById('cd-copyall')
  if (copyAll) copyAll.addEventListener('click', function () { copyText(buildScript(), '脚本') })
  const clr = document.getElementById('cd-clear')
  if (clr) clr.addEventListener('click', function () {
    S.conditions = []; S.result = null; S.probe = {}; S.notes = []; S.parseWarnings = []
    S.combine = 'all'; S.plotExpr = ''; S.loadedName = ''; saveDraft(); render()
  })

  const run = document.getElementById('sc-run')
  if (run) run.addEventListener('click', runScan)
  const sv = document.getElementById('sc-save')
  if (sv) sv.addEventListener('click', openSaveDialog)
  const copy = document.getElementById('sc-copy')
  if (copy) copy.addEventListener('click', function () {
    const codes = ((S.result && S.result.picks) || []).map(function (p) { return p.code }).join('\n')
    copyText(codes, codes ? codes.split('\n').length + ' 个代码' : '')
  })
  const th = document.querySelector('.sc-tb thead')
  if (th) th.addEventListener('click', function (e) {
    const c = e.target && e.target.closest ? e.target.closest('th') : null
    if (!c || !c.dataset.sort) return
    if (S.sortBy === c.dataset.sort) S.desc = !S.desc
    else { S.sortBy = c.dataset.sort; S.desc = true }
    runScan()
  })
  const q = document.getElementById('sc-fd-q')
  if (q) q.addEventListener('input', debounceFields)
  const fl = document.getElementById('sc-fd-list')
  if (fl) fl.addEventListener('click', insertField)
  bindKChart()
}

// ═══════════════════════════════════════════════════════════════
// 悬停日K —— 鼠标停在代码上弹出近一年日线 · 滚轮缩放 · 十字星读数
// ═══════════════════════════════════════════════════════════════
// 数据走现成的 GET /api/kline/{code}?period=daily&limit=250。
// 那个端点内部按代码形态分派(A 股走 finance-data,港美股走免费通道),
// 2026-09-10 实测三个市场都能拿到 250 根:600519 / 00700 / NVDA。
// 筛选结果的 code 与 market_source.market_of 的格式是**有意对齐**的
// (见 screen_source._normalize_code 的注释),所以能直接喂,不用转换。
//
// 四个体验点,少一个都不像样:
//   1. 悬停 180ms 才请求 —— 否则鼠标扫过一列会连打几十个请求
//   2. 移出 260ms 才隐藏 —— 这段时间够鼠标从代码移进弹层
//   3. 弹层自己 mouseenter 时取消隐藏 —— 否则滚轮还没碰到图它就没了
//   4. 同一只票只请求一次,回头再看是瞬开的
//
// ⚠️ 用 opacity 而不是 display:none 来隐藏:display:none 的容器尺寸为 0,
// echarts 在里面 init 会画出一张 0×0 的图,再 resize 也回不来。

const KC = { el: null, chart: null, cache: new Map(),
             seq: 0, showT: null, hideT: null, cur: null, bound: false }
const KC_LIMIT = 250          // 一年大约 250 个交易日
// 中式红涨绿跌,与站内其它页面一致(标的可能是美股,但全站配色统一)
const KC_UP = '#a4332b', KC_DN = '#3f6b40'

function kcNum(v, d) {
  return Number.isFinite(v) ? v.toFixed(d == null ? 2 : d) : '—'
}
function kcVol(v) {
  if (!Number.isFinite(v)) return '—'
  if (v >= 1e8) return (v / 1e8).toFixed(2) + '亿'
  if (v >= 1e4) return (v / 1e4).toFixed(1) + '万'
  return String(Math.round(v))
}

function kcEl() {
  if (KC.el) return KC.el
  const d = document.createElement('div')
  d.className = 'kc-pop'
  d.style.left = '-9999px'
  d.style.top = '0px'
  d.innerHTML =
    '<div class="kc-hd"><span class="sy" id="kc-sy"></span>' +
    '<span class="nm" id="kc-nm"></span><span class="px" id="kc-px"></span></div>' +
    '<div class="kc-box" id="kc-box"></div>' +
    '<div class="kc-ft"><span>滚轮缩放 · 十字星读数</span><span class="r" id="kc-rg"></span></div>'
  document.body.appendChild(d)
  // 鼠标进了弹层就别关 —— 用户要在里面滚轮缩放
  d.addEventListener('mouseenter', function () { clearTimeout(KC.hideT) })
  d.addEventListener('mouseleave', kcHide)
  KC.el = d
  return d
}

function kcPlace(rect) {
  const el = kcEl()
  const W = el.offsetWidth || 560
  const H = el.offsetHeight || 320
  let x = rect.right + 14
  if (x + W > window.innerWidth - 8) x = rect.left - W - 14   // 右边放不下就翻到左边
  if (x < 8) x = 8
  let y = rect.top + rect.height / 2 - H / 2
  y = Math.max(8, Math.min(y, window.innerHeight - H - 8))     // 上下都夹住
  el.style.left = Math.round(x) + 'px'
  el.style.top = Math.round(y) + 'px'
}

function kcHide() {
  clearTimeout(KC.showT)
  KC.hideT = setTimeout(function () {
    if (KC.el) KC.el.classList.remove('on')
    KC.cur = null
  }, 60)
}

function kcMsg(html) {
  const box = document.getElementById('kc-box')
  if (box) box.innerHTML = '<div class="kc-msg">' + html + '</div>'
}

function kcOption(rows) {
  const dates = rows.map(function (r) { return String(r.ts || r.date || '').slice(5) })
  const ohlc = rows.map(function (r) { return [r.open, r.close, r.low, r.high] })
  const vols = rows.map(function (r) { return r.volume })
  const axisLbl = { fontSize: 10, color: '#777970' }
  return {
    animation: false,
    // 两个 grid:主图 + 成交量。link 让两边的十字线一起动
    axisPointer: { link: [{ xAxisIndex: 'all' }] },
    grid: [{ left: 54, right: 12, top: 8, height: 158 },
           { left: 54, right: 12, top: 182, height: 42 }],
    xAxis: [
      { type: 'category', data: dates, gridIndex: 0, boundaryGap: true,
        axisLabel: { show: false }, axisTick: { show: false },
        axisLine: { lineStyle: { color: '#deddd5' } },
        axisPointer: { label: { show: false } } },
      { type: 'category', data: dates, gridIndex: 1, boundaryGap: true,
        axisLabel: axisLbl, axisTick: { show: false },
        axisLine: { lineStyle: { color: '#deddd5' } } },
    ],
    yAxis: [
      { scale: true, gridIndex: 0, axisLabel: axisLbl,
        splitLine: { lineStyle: { color: '#f2f0ea' } },
        axisLine: { show: false }, axisTick: { show: false } },
      { gridIndex: 1, splitNumber: 2, axisLabel: { show: false },
        splitLine: { show: false }, axisLine: { show: false }, axisTick: { show: false } },
    ],
    dataZoom: [{
      type: 'inside', xAxisIndex: [0, 1], start: 0, end: 100,
      zoomOnMouseWheel: true,
      // ⚠️ 这两个必须关掉。开着的话鼠标一动图就平移,十字星根本读不了数 ——
      // 而「十字星读数」正是这个弹层存在的理由。
      moveOnMouseMove: false, moveOnMouseWheel: false,
      minValueSpan: 8,        // 最多放大到 8 根,再放大就看不出形态了
    }],
    tooltip: {
      trigger: 'axis',
      axisPointer: { type: 'cross', lineStyle: { color: '#b56b2d', width: 1, type: 'dashed' },
                     crossStyle: { color: '#b56b2d', width: 1, type: 'dashed' },
                     label: { backgroundColor: '#8f4f1d', fontSize: 10.5 } },
      backgroundColor: 'rgba(255,255,255,.97)',
      borderColor: '#deddd5', borderWidth: 1, padding: [7, 9],
      textStyle: { color: '#1f211f', fontSize: 11.5 },
      formatter: function (ps) {
        if (!ps || !ps.length) return ''
        const i = ps[0].dataIndex
        const r = rows[i]
        if (!r) return ''
        const prev = i > 0 ? rows[i - 1].close : r.open
        const chg = (Number.isFinite(prev) && prev) ? (r.close - prev) / prev * 100 : null
        const cls = chg == null ? '' : (chg >= 0 ? KC_UP : KC_DN)
        return '<b>' + esc(String(r.ts || r.date || '')) + '</b><br>' +
          '开 ' + kcNum(r.open) + '　高 ' + kcNum(r.high) + '<br>' +
          '低 ' + kcNum(r.low) + '　收 <b>' + kcNum(r.close) + '</b><br>' +
          '涨跌 <b style="color:' + cls + '">' +
            (chg == null ? '—' : (chg >= 0 ? '+' : '') + chg.toFixed(2) + '%') + '</b><br>' +
          '量 ' + kcVol(r.volume)
      },
    },
    series: [
      { type: 'candlestick', data: ohlc, xAxisIndex: 0, yAxisIndex: 0,
        itemStyle: { color: KC_UP, color0: KC_DN,
                     borderColor: KC_UP, borderColor0: KC_DN, borderWidth: 1 } },
      { type: 'bar', data: vols, xAxisIndex: 1, yAxisIndex: 1,
        itemStyle: { color: function (p) {
          const r = rows[p.dataIndex]
          return (r && r.close >= r.open) ? 'rgba(164,51,43,.45)' : 'rgba(63,107,64,.45)'
        } } },
    ],
  }
}

function kcRender(code, name, payload) {
  const el = kcEl()
  const sy = document.getElementById('kc-sy')
  const nm = document.getElementById('kc-nm')
  const px = document.getElementById('kc-px')
  const rg = document.getElementById('kc-rg')
  if (sy) sy.textContent = code
  if (nm) nm.textContent = name || ''

  const rows = (payload && payload.rows) || []
  if (!rows.length) {
    // 拿不到就明说,不要一直转圈 —— 与 routers/kline.py 那条注释同一个道理:
    // 用户分不清「这只票没数据」和「还在加载」,只会一直等下去。
    if (px) { px.textContent = ''; px.className = 'px' }
    if (rg) rg.textContent = ''
    kcMsg(esc((payload && payload.error) || '暂无日线数据'))
    if (KC.chart) { KC.chart.dispose(); KC.chart = null }
    return
  }

  const last = rows[rows.length - 1]
  const prev = rows.length > 1 ? rows[rows.length - 2].close : last.open
  const chg = (Number.isFinite(prev) && prev) ? (last.close - prev) / prev * 100 : null
  if (px) {
    px.textContent = kcNum(last.close) + (chg == null ? '' :
      '　' + (chg >= 0 ? '+' : '') + chg.toFixed(2) + '%')
    px.className = 'px' + (chg == null ? '' : (chg >= 0 ? ' up' : ' dn'))
  }
  if (rg) rg.textContent = String(rows[0].ts || '').slice(0, 10) + ' → ' +
                           String(last.ts || '').slice(0, 10) + ' · ' + rows.length + ' 根'

  const box = document.getElementById('kc-box')
  if (!box) return
  box.innerHTML = ''
  if (KC.chart) { KC.chart.dispose(); KC.chart = null }
  if (!window.echarts) { kcMsg('图表库没加载出来'); return }
  KC.chart = window.echarts.init(box)
  KC.chart.setOption(kcOption(rows))
  kcPlace(el._rect || { right: 0, left: 0, top: 0, height: 0 })
}

async function kcFetch(code) {
  if (KC.cache.has(code)) return KC.cache.get(code)
  let out
  try {
    const r = await fetch('/api/kline/' + encodeURIComponent(code) +
                          '?period=daily&limit=' + KC_LIMIT,
                          { headers: apiHeaders(), cache: 'no-store' })
    const j = await r.json()
    out = Array.isArray(j)
      ? { rows: j, error: null }
      : { rows: [], error: (j && (j.message || j.error)) || ('HTTP ' + r.status) }
  } catch (e) {
    out = { rows: [], error: '请求失败:' + ((e && e.message) || e) }
  }
  // 失败也缓存 —— 否则鼠标每划过一次就重打一次必然失败的请求。
  // 代价是这次会话里不会自动重试,用户刷新页面即可。
  KC.cache.set(code, out)
  return out
}

function kcShow(td) {
  const code = td.dataset.kchart
  if (!code || code === KC.cur) { clearTimeout(KC.hideT); return }
  clearTimeout(KC.hideT)
  clearTimeout(KC.showT)
  KC.showT = setTimeout(async function () {
    const el = kcEl()
    KC.cur = code
    const seq = ++KC.seq
    el._rect = td.getBoundingClientRect()
    const sy = document.getElementById('kc-sy')
    const nm = document.getElementById('kc-nm')
    if (sy) sy.textContent = code
    if (nm) nm.textContent = td.dataset.kname || ''
    if (!KC.cache.has(code)) kcMsg('加载中…')
    el.classList.add('on')
    kcPlace(el._rect)
    const payload = await kcFetch(code)
    // 竞态:鼠标已经划到别的票上了,这次的响应直接丢掉
    if (seq !== KC.seq) return
    kcRender(code, td.dataset.kname, payload)
  }, 180)
}

function bindKChart() {
  if (KC.bound) return           // 表格每次都重渲染,所以委托绑在 document 上,只绑一次
  KC.bound = true
  document.addEventListener('mouseover', function (e) {
    const td = e.target && e.target.closest ? e.target.closest('[data-kchart]') : null
    if (td) kcShow(td)
  })
  document.addEventListener('mouseout', function (e) {
    const td = e.target && e.target.closest ? e.target.closest('[data-kchart]') : null
    if (!td) return
    const to = e.relatedTarget
    if (to && KC.el && KC.el.contains(to)) return    // 移进弹层了,别关
    clearTimeout(KC.showT)
    kcHide()
  })
  // 页面滚动 / 窗口变化时位置会失效,直接收起比错位好
  window.addEventListener('scroll', function () {
    if (KC.el && KC.el.classList.contains('on')) { KC.cur = null; KC.el.classList.remove('on') }
  }, true)
}

function copyText(txt, what) {
  if (!txt) { toast('没有可复制的内容', 'warn'); return }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(
      function () { toast('已复制' + (what ? ' ' + what : '')) },
      function () { toast('复制失败,请手动选中', 'warn') })
  } else { toast('这个浏览器不支持一键复制', 'warn') }
}

// ─── 条件行的动作 ─────────────────────────────────────────────────
function onCondAction(e) {
  const b = e.target && e.target.closest ? e.target.closest('[data-act]') : null
  if (!b) return
  const i = parseInt(b.dataset.i, 10)
  const c = S.conditions[i]
  if (!c) return
  const act = b.dataset.act
  if (act === 'toggle') {
    if (S.combine === 'custom') { toast('自定义组合下不能单独停用', 'warn'); return }
    c.enabled = !c.enabled; S.probe = {}; saveDraft(); render(); return
  }
  if (act === 'del') {
    // 被别人引用的不能删 —— 删了引用方会直接报"不认识 xxx"。
    // (变量现在不渲染、点不到这里;留着是因为条件之间也可以互相引用。)
    if (referenced(c.name, i)) {
      toast('「' + c.name + '」被别的条件引用着,先改那一条', 'warn'); return
    }
    S.conditions.splice(i, 1); S.probe = {}
    rebuild(); return
  }
  if (act === 'edit') { S.editing = (S.editing === c.name ? null : c.name); render(); return }
  if (act === 'dup') {
    const copy = { name: uniqName(c.name), expr: c.expr, is_bool: c.is_bool, enabled: c.enabled }
    S.conditions.splice(i + 1, 0, copy)
    rebuild(); return
  }
  if (act === 'copy') { copyText('def ' + c.name + ' = ' + c.expr + ';', '这一条'); return }
  if (act === 'probe') { probeOne(c); return }
}

function uniqName(base) {
  const taken = {}
  S.conditions.forEach(function (c) { taken[c.name] = 1 })
  let n = 2
  while (taken[base + '_' + n]) n++
  return base + '_' + n
}

// 数字内联编辑:按 token 自带的源码偏移做**精确替换**。
// 不用"第 n 个数字"做正则 —— `Average(close,50) > 50` 会认错人。
function onNumChange(e) {
  const el = e.target
  if (!el || !el.classList || !el.classList.contains('sc-num')) return
  const ci = parseInt(el.dataset.c, 10), ti = parseInt(el.dataset.t, 10)
  const c = S.conditions[ci]
  if (!c) return
  const tok = (c.tokens || [])[ti]
  if (!tok || tok.k !== 'num') return
  const v = (el.value || '').trim()
  if (!/^-?\d+(\.\d+)?$/.test(v)) { toast('要填一个数字', 'warn'); render(); return }
  c.expr = c.expr.slice(0, tok.s) + v + c.expr.slice(tok.e)
  rebuild()
}

function commitEdit(text) {
  const c = S.conditions.filter(function (x) { return x.name === S.editing })[0]
  if (!c) { S.editing = null; render(); return }
  c.expr = (text || '').trim().replace(/;+$/, '')
  S.editing = null
  // 改完表达式可能把某个变量的最后一个引用去掉了 → rebuild 里会清孤儿
  rebuild()
}

// ─── 与后端往返 ───────────────────────────────────────────────────
async function post(url, body) {
  const r = await fetch(url, {
    method: 'POST',
    headers: apiHeaders({ 'Content-Type': 'application/json' }),
    body: JSON.stringify(body),
  })
  let d = null
  try { d = await r.json() } catch (e) { /* 400 也可能不是 JSON */ }
  return { ok: r.ok, status: r.status, data: d }
}

function applyParsed(d) {
  // 启用状态不由前端记 —— 谁在 plot_refs 里谁就是启用的(buildScript 只写启用的)。
  // 变量(非布尔)没有启用概念,恒为 true。见 condsOf。
  S.conditions = condsOf(d)
  // 手工改过之后就不再是"AI 那次翻译的结果"了,徽标跟着清掉 ——
  // 留着会让人以为下面展示的脚本还是当前这套条件(generate 里会再设回去)
  S.ai = d.ai || null
  S.kw = d.kw || null
  S.combine = d.combine || 'all'
  S.plotName = d.plot_name || 'scan'
  S.plotExpr = d.combine === 'custom' ? (d.plot_expr || '') : ''
  S.notes = d.notes || []
  S.parseWarnings = d.warnings || []
}

// 后端的 detail 现在可能是对象:NeedsAI 会带 {message, can_try_ai}。
// 老的字符串形式也还在(普通 ScreenError),两种都要认。
function errOf(r, fallback) {
  const d = r && r.data
  const det = d && d.detail
  if (det && typeof det === 'object') return det.message || fallback
  return det || (d && d.error) || fallback
}
function canAi(r) {
  const det = r && r.data && r.data.detail
  return !!(det && typeof det === 'object' && det.can_try_ai)
}

async function reparse(script) {
  if (!script) {
    S.conditions = []; S.result = null; saveDraft(); render(); return
  }
  const r = await post(PARSE_API, { script: script, market: S.market })
  if (!r.ok) {
    S.genError = errOf(r, '解析失败 · HTTP ' + r.status)
    S.canTryAi = false
    render(); return
  }
  S.genError = null
  applyParsed(r.data)
  S.result = null           // 条件变了,旧结果就不是这套条件的结果了,不能留着骗人
  S.probe = {}
  saveDraft(); render()
}

async function generate(allowAi) {
  // allowAi=true 只可能来自用户点「AI 识别」。生成按钮永远传 undefined,
  // 所以正常点生成**一分钱都不花**:后端先试脚本、再试本地关键词。
  const text = allowAi ? (S.aiText || '') : (S.input || '').trim()
  if (!text) { S.genError = '生成框是空的。把筛选脚本粘进来,或者点一个示例。'; render(); return }
  const appending = (S.mode === 'append' && S.conditions.length > 0)

  // 自定义组合下不许追加 —— 现有 plot 是 `a and (b or c)` 这类表达式,
  // 往里塞新条件必然改变它的含义,而"改成什么"只有用户自己知道。
  // 与其猜,不如说清楚让他用「替换」。
  if (appending && S.combine === 'custom') {
    S.genError = '当前条件用的是自定义组合(' + S.plotExpr + '),追加会改变它的含义。' +
      '请切到「替换」,或先把最后一句改成 `plot scan = 条件A and 条件B;` 的形式。'
    render(); return
  }

  S.generating = true; S.genError = null; S.canTryAi = false; S.pending = text; render()
  // **先单独解析新脚本**,拿到它自己的条件对象再合并 ——
  // 早先的做法是把两段脚本用字符串拼起来(还得把旧的 plot 降级成 def),
  // 实测会把脚本绞成 `def scan2 = … and scan and cond_pe;`,而且 400 之后
  // 用户完全看不出发生了什么。结构化合并没有这类惊喜。
  const r = await post(PARSE_API, { script: text, market: S.market, allow_ai: !!allowAi })
  S.generating = false
  if (!r.ok) {
    S.genError = errOf(r, '生成失败 · HTTP ' + r.status)
    // 后端说"本地两条路都不通,可以试 AI" → 把原文记下来,弹按钮等用户点
    S.canTryAi = canAi(r)
    S.aiText = S.canTryAi ? text : ''
    render(); return
  }
  const d = r.data
  if (appending && d.combine === 'custom') {
    S.genError = '新脚本的最终条件是自定义组合(' + (d.plot_expr || '') + '),' +
      '追加进来会丢掉这层组合关系。请切到「替换」。'
    render(); return
  }

  const fresh = condsOf(d)
  if (!appending) {
    S.conditions = fresh
    S.combine = d.combine || 'all'
    S.plotName = d.plot_name || 'scan'
    S.plotExpr = d.combine === 'custom' ? (d.plot_expr || '') : ''
  } else {
    mergeAppend(fresh)
  }
  S.input = ''
  S.canTryAi = false; S.aiText = ''
  S.result = null; S.probe = {}
  // 回写再解析一次 —— 保证 tokens / is_bool 与后端完全一致(合并后名字可能改过)。
  // reparse 送的是脚本,不会再触发 AI,所以 d.ai 要在这之后补回去。
  await reparse(buildScript())
  S.ai = d.ai || null
  S.kw = d.kw || null
  render()
}

// 把 /parse 的返回变成条件对象(启用状态取自 plot_refs)
function condsOf(d) {
  const refs = {}
  ;(d.plot_refs || []).forEach(function (n) { refs[n] = 1 })
  return (d.conditions || []).map(function (c) {
    return {
      name: c.name, expr: c.expr, tokens: c.tokens, is_bool: c.is_bool,
      enabled: !c.is_bool ? true : (d.combine === 'custom' ? true : !!refs[c.name]),
    }
  })
}

// 追加合并:重名的自动改名,并把新条件内部对被改名者的引用一起改掉。
// 两趟走 —— 先算完整张改名表再改写表达式,不然改到一半的名字会被二次替换。
function mergeAppend(fresh) {
  const taken = {}
  S.conditions.forEach(function (c) { taken[c.name] = 1 })
  const map = {}
  fresh.forEach(function (c) {
    if (!taken[c.name]) { taken[c.name] = 1; return }
    let k = 2
    while (taken[c.name + '_' + k]) k++
    map[c.name] = c.name + '_' + k
    taken[map[c.name]] = 1
  })
  fresh.forEach(function (c) {
    Object.keys(map).forEach(function (old) {
      c.expr = (c.expr || '').replace(new RegExp('\\b' + old + '\\b', 'g'), map[old])
    })
  })
  fresh.forEach(function (c) {
    if (map[c.name]) c.name = map[c.name]
    S.conditions.push(c)
  })
}

async function runScan() {
  const script = buildScript()
  if (!script) { S.runError = '还没有条件'; render(); return }
  S.running = true; S.runError = null; render()
  const r = await post(RUN_API, {
    script: script, market: S.market, limit: 100,
    sort_by: S.sortBy || null, descending: S.desc,
  })
  S.running = false
  if (!r.ok) {
    S.runError = (r.data && (r.data.detail || r.data.error)) || ('扫描失败 · HTTP ' + r.status)
    S.result = null; render(); return
  }
  S.result = r.data
  render()
}

// 单独测试一条:只留这一条(和它依赖的变量)跑一次,看它自己能命中多少。
// 用来判断"是哪一条把结果筛没了"。
async function probeOne(c) {
  const lines = []
  S.conditions.forEach(function (o) {
    if (o.expr) lines.push('def ' + o.name + ' = ' + o.expr + ';')
  })
  lines.push('plot ' + S.plotName + ' = ' + c.name + ';')
  const r = await post(RUN_API, { script: lines.join('\n'), market: S.market, limit: 1 })
  S.probe[c.name] = (r.ok && r.data && Number.isFinite(r.data.matched)) ? r.data.matched : null
  render()
}

// ─── 字段搜索 ─────────────────────────────────────────────────────
let fdTimer = null
function debounceFields() {
  if (fdTimer) clearTimeout(fdTimer)
  fdTimer = setTimeout(searchFields, 220)
}
async function searchFields() {
  const q = document.getElementById('sc-fd-q')
  const list = document.getElementById('sc-fd-list')
  if (!q || !list) return
  const kw = (q.value || '').trim()
  if (!kw) { list.innerHTML = '<span class="sc-na">输入关键词开始搜索</span>'; return }
  let r
  try {
    r = await fetch(FIELD_API + '?market=' + encodeURIComponent(S.market) +
      '&q=' + encodeURIComponent(kw) + '&limit=60', { headers: apiHeaders() })
  } catch (e) { list.innerHTML = '<span class="sc-na">搜索请求没发出去</span>'; return }
  if (!r.ok) { list.innerHTML = '<span class="sc-na">搜索失败 HTTP ' + r.status + '</span>'; return }
  let d
  try { d = await r.json() } catch (e) { list.innerHTML = '<span class="sc-na">返回的不是合法 JSON</span>'; return }
  const fs = (d && d.fields) || []
  if (!fs.length) { list.innerHTML = '<span class="sc-na">没有匹配的字段</span>'; return }
  // 只写内容,不挂监听 —— 监听在 bind() 里挂一次(2026-09-10:原来每次搜完都再挂一个,
  // 连搜三次后点一个字段会插三份)
  // 显示中文名、鼠标悬停出英文原名;**插进脚本的永远是英文字段名**
  // (DSL 只认英文,插中文进去必然解析失败)。
  // 后端拿不准时 label 为 null,这里就照旧显示英文 —— 半吊子翻译更误导。
  S.fieldRows = fs
  S.fieldOpen = {}          // 换了关键词就把展开状态清掉
  paintFields()
}

// 把搜索结果画出来。只有数字不同的字段(EMA10…EMA300)后端已经折叠成一族,
// 这里画成一个可点开的族标签 —— 不折叠的话搜个 "e" 就被 31 个 EMA 刷满整屏。
function paintFields() {
  const list = document.getElementById('sc-fd-list')
  if (!list) return
  const rows = S.fieldRows || []
  const html = rows.map(function (f) {
    const name = (typeof f === 'string') ? f : (f && f.name)
    if (!name) return ''
    if (f.members && f.members.length) {
      const open = !!S.fieldOpen[f.family]
      const head = '<span class="fam' + (open ? ' on' : '') + '" data-fam="' + esc(f.family) + '"' +
        ' title="' + esc(f.family) + ' · ' + f.count + ' 个周期,点开选">' +
        esc(f.label || f.family) + '<b>' + f.count + '</b></span>'
      if (!open) return head
      return head + f.members.map(function (m) {
        return '<span data-f="' + esc(m.name) + '" title="' + esc(m.name) + '"' +
          (m.label ? ' class="cn sub"' : ' class="sub"') + '>' + esc(m.label || m.name) + '</span>'
      }).join('')
    }
    const label = f.label || ''
    return '<span data-f="' + esc(name) + '" title="' + esc(name) + '"' +
      (label ? ' class="cn"' : '') + '>' + esc(label || name) + '</span>'
  }).join('')
  list.innerHTML = html || '<span class="sc-na">没有匹配的字段</span>'
}

function insertField(e) {
  const t = e.target
  // 族标签:点开/收起,不插入。族里的周期各不相同,替用户挑一个是瞎猜。
  const fam = t && t.dataset ? t.dataset.fam : null
  if (fam) {
    S.fieldOpen[fam] = !S.fieldOpen[fam]
    paintFields()
    return
  }
  const s = t && t.dataset ? t.dataset.f : null
  if (!s) return
  const ed = document.getElementById('mg-input')
  if (!ed) return
  const v = ed.value || ''
  let a = ed.selectionStart, b = ed.selectionEnd
  if (typeof a !== 'number' || typeof b !== 'number') { a = v.length; b = v.length }
  S.input = v.slice(0, a) + s + v.slice(b)
  ed.value = S.input
  const pos = a + s.length
  try { ed.focus(); ed.setSelectionRange(pos, pos) } catch (err) { /* 老浏览器 */ }
}

// ─── 启动 ─────────────────────────────────────────────────────────
async function boot() {
  try {
    const m = localStorage.getItem(LS_MK)
    if (m) S.market = m
  } catch (e) { /* 隐私模式 */ }
  render()                                   // 先把骨架画出来,不等网络

  let r
  try {
    r = await fetch(META_API, { headers: apiHeaders(), cache: 'no-store' })
  } catch (e) {
    S.metaErr = '请求没发出去 · ' + (e && e.message ? e.message : e); render(); return
  }
  if (!r.ok) { S.metaErr = 'HTTP ' + r.status; render(); return }
  try { S.meta = await r.json() } catch (e) { S.metaErr = '返回的不是合法 JSON'; render(); return }
  loadSaved()

  // ?preset=xxx 是明确指令,优先级高于上次草稿
  let want = null
  try { want = new URLSearchParams(location.search || '').get('preset') } catch (e) { /* 老浏览器 */ }
  const chosen = want ? (S.meta.presets || []).filter(function (p) { return p.key === want })[0] : null
  if (chosen) {
    S.input = chosen.script
    S.market = chosen.market || S.market
    S.mode = 'replace'
    await generate()
    S.mode = 'append'
    render(); return
  }
  let draft = null
  try { draft = localStorage.getItem(LS) } catch (e) { /* 隐私模式 */ }
  if (draft && draft.trim()) { await reparse(draft); return }
  render()
}

boot()
</script>
</body>
</html>
