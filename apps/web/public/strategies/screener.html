}

// 悬停日K 的实现搬到了 app.js(2026-09-12)—— 智能体的历史交易记录也要用它,
// 两份抄写迟早漂移。这里只负责:在代码列挂 data-kchart,并在回溯时告诉它截到哪天。

// ─── 对照表:忘掉一条学错的 ─────────────────────────────────────────
let _forgetBound = false
function bindForget() {
  if (_forgetBound) return
  _forgetBound = true
  document.addEventListener('click', async function (e) {
    const b = e.target && e.target.closest ? e.target.closest('[data-forget]') : null
    if (!b) return
    const id = +b.dataset.forget
    if (!confirm('忘掉这条对照表记录?\n\n下次这句话会重新交给 AI 识别(会花 token),' +
                 '新的结果会重新记进来。这条影响所有用户。')) return
    b.disabled = true
    let r
    try {
      r = await fetch('/api/quant/screener/learned/' + encodeURIComponent(id),
                      { method: 'DELETE', headers: apiHeaders() })
    } catch (err) { b.disabled = false; toast('没忘掉:请求没发出去', 'warn'); return }
    if (!r.ok) {
      b.disabled = false
      let d = null
      try { d = await r.json() } catch (err) { /* 非 JSON */ }
      toast(r.status === 401 ? '登录后才能改对照表' : ((d && d.detail) || ('没忘掉 · HTTP ' + r.status)), 'warn')
      return
    }
    // 界面上这几句仍然保留(用户可能已经在改了),只是不再标成「来自对照表」
    if (S.kw && S.kw.matched) S.kw.matched.forEach(function (m) {
      if (m.learned && m.learned.id === id) delete m.learned
    })
    render()
    toast('已忘掉 · 下次这句会重新交给 AI', 'success')
  })
}

function copyText(txt, what) {
  if (!txt) { toast('没有可复制的内容', 'warn'); return }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(
      function () { toast('已复制' + (what ? ' ' + what : '')) },
      function () { toast('复制失败,请手动选中', 'warn') })
  } else { toast('这个浏览器不支持一键复制', 'warn') }
}

// ─── 条件行的动作 ─────────────────────────────────────────────────
function onCondAction(e) {
  const b = e.target && e.target.closest ? e.target.closest('[data-act]') : null
  if (!b) return
  const i = parseInt(b.dataset.i, 10)
  const c = S.conditions[i]
  if (!c) return
  const act = b.dataset.act
  if (act === 'toggle') {
    if (S.combine === 'custom') { toast('自定义组合下不能单独停用', 'warn'); return }
    c.enabled = !c.enabled; S.probe = {}; saveDraft(); render(); return
  }
  if (act === 'del') {
    // 被别人引用的不能删 —— 删了引用方会直接报"不认识 xxx"。
    // (变量现在不渲染、点不到这里;留着是因为条件之间也可以互相引用。)
    if (referenced(c.name, i)) {
      toast('「' + c.name + '」被别的条件引用着,先改那一条', 'warn'); return
    }
    return mutateRebuild(function () { S.conditions.splice(i, 1); S.probe = {} })
  }
  if (act === 'edit') { S.editing = (S.editing === c.name ? null : c.name); S.editText = null; render(); return }
  if (act === 'dup') {
    if (c.kind === 'term') return
    // 带上 kind(input / rec 关键字回写要靠它)
    const copy = { name: uniqName(c.name), expr: c.expr, is_bool: c.is_bool, enabled: c.enabled, kind: c.kind || 'def' }
    return mutateRebuild(function () { S.conditions.splice(i + 1, 0, copy) })
  }
  if (act === 'copy') {
    const sn = copySnippet(c)
    const extra = [sn.params ? sn.params + ' 个参数' : '', sn.defs ? sn.defs + ' 个中间定义' : ''].filter(Boolean).join('、')
    copyText(sn.text, extra ? '这一条(连同 ' + extra + ')' : '这一条'); return
  }
  if (act === 'probe') { probeOne(c); return }
}

function uniqName(base) {
  const taken = {}
  S.conditions.forEach(function (c) { taken[c.name] = 1 })
  if (S.termHost) taken[S.termHost] = 1
  ;(S.extraPlots || []).forEach(function (p) { taken[p.name] = 1 })
  let n = 2
  while (taken[base + '_' + n]) n++
  return base + '_' + n
}

// 数字内联编辑:按 token 自带的源码偏移做**精确替换**。
// 不用"第 n 个数字"做正则 —— `Average(close,50) > 50` 会认错人。
function onNumChange(e) {
  const el = e.target
  if (!el || !el.classList || !el.classList.contains('sc-num')) return
  const ci = parseInt(el.dataset.c, 10), ti = parseInt(el.dataset.t, 10)
  const c = S.conditions[ci]
  if (!c) return
  const tok = (c.tokens || [])[ti]
  if (!tok || tok.k !== 'num') return
  const v = (el.value || '').trim()
  if (!/^-?\d+(\.\d+)?$/.test(v)) { toast('要填一个数字', 'warn'); render(); return }
  // s / e 是后端按**码点**算的;JS 字符串按 UTF-16 切 —— 表达式里(比如注释)有 emoji 时差一位,改到别的字上(审计 2026-09-15 实跑)
  const a = u16At(c.expr, tok.s), b = u16At(c.expr, tok.e)
  return mutateRebuild(function () { c.expr = c.expr.slice(0, a) + v + c.expr.slice(b) })
}

async function commitEdit(text) {
  const c = S.conditions.filter(function (x) { return x.name === S.editing })[0]
  if (!c) { S.editing = null; S.editText = null; render(); return }
  // 先留一份原样:写错的表达式不能把原条件冲掉(2026-09-14 执行用例 GN-026 发现 ——
  // 原来 c.expr 直接换成新写法再解析,解析失败只报错,条件区里留着一行坏表达式,之后的单条测试 / 运行全挂)
  const snapshot = S.conditions.map(function (o) { return Object.assign({}, o) })
  // raw = 用户在框里看到并改过的原文(带参数值);失败时原样还给他,不能还一份把参数值剥掉的
  const raw = (text || '').trim().replace(/;+$/, '')
  const pp = applyParams(raw)
  if (pp.err) { toast(pp.err, 'warn'); S.editText = raw; render(); return }
  const changed = []
  Object.keys(pp.changes).forEach(function (n) {
    const inp = S.conditions.filter(function (o) { return o.kind === 'input' && o.name === n })[0]
    if (inp && String(inp.expr).trim() !== pp.changes[n]) { inp.expr = pp.changes[n]; changed.push(n) }
  })
  c.expr = pp.text
  S.editing = null
  S.editText = null
  S.genError = null
  // 改完表达式可能把某个变量的最后一个引用去掉了 → rebuild 里会清孤儿
  const ok = await rebuild()
  if (!ok) {
    // 解析失败或被登录 / 额度拦下:恢复原条件(参数值一起恢复),编辑框留着刚才写的内容,报错照常显示,用户改完再提交
    S.conditions = snapshot
    S.editing = c.name
    S.editText = raw
    render()
  } else if (changed.length) {
    // 参数是整份脚本共用的:改一处,别的条件里同名参数也变了 —— 必须说,不说用户会以为只改了这一条
    toast(changed.map(function (n) {
      const users = S.conditions.filter(function (o) { return o.kind !== 'input' && paramRe(n).test(o.expr || '') }).length
      return '参数 ' + n + ' 改成 ' + pp.changes[n] + (users > 1 ? ',用到它的 ' + users + ' 处一起生效' : '')
    }).join(';'), 'ok')
  }
}

// ─── 复制这一条:连同用到的参数(2026-09-15 用户)───────────────────────
// 原来复制出来只有 `totalReturn >= minTotalReturn`,阈值 0.80 在另一句 input 里,粘到别处就丢了。
// 现在前面带上**这一条直接用到的** input 行(按脚本里 input 的先后),后面是这一条本身 —— 整段是合法 ThinkScript,能直接粘。
// 只带直接引用的参数,和条件行上显示「参数名(值)」的范围一致;中间定义(totalReturn 怎么算)不带,那是整份脚本的事,用「复制脚本」
// 2026-09-17 起连同它**间接**用到的中间定义一起复制(原来只带直接用到的参数、不带中间定义):
// 用户复制「c_depth: rng3m >= 0.15」粘回生成框,rng3m 不在片段里,单独解析必然「不认识」——自家复制的东西自家不认。
// 现在复制出来的片段自带依赖,粘到替换模式、别的脚本、thinkorswim 都能用;追加回同一份脚本时,
// 和原脚本一字不差的依赖由后端沿用原来的(screen_dsl.complete_fragment),不会多出 rng3m_2。
function copySnippet(c) {
  const byName = {}
  S.conditions.forEach(function (o) { if (o.kind !== 'term') byName[o.name] = o })
  const need = {}
  const walk = function (expr, self) {
    const code = stripComments(expr || '')
    Object.keys(byName).forEach(function (n) {
      if (n === self || need[n] || !paramRe(n).test(code)) return
      need[n] = 1
      walk(byName[n].expr, n)
    })
  }
  walk(c.expr, c.name)
  const deps = S.conditions.filter(function (o) { return o.kind !== 'term' && need[o.name] && o.name !== c.name })
  const kw = function (o) { return o.kind === 'input' ? 'input ' : (o.kind === 'rec' ? 'rec ' : 'def ') }
  const used = deps.filter(function (o) { return o.kind === 'input' })
  const defs = deps.filter(function (o) { return o.kind !== 'input' })
  const body = c.kind === 'term' ? String(c.expr || '').trim() : kw(c) + c.name + ' = ' + c.expr + ';'
  const lines = used.map(function (o) { return 'input ' + o.name + ' = ' + String(o.expr).trim() + ';' })
    .concat(defs.map(function (o) { return kw(o) + o.name + ' = ' + o.expr + ';' }))
  lines.push(body)
  return { text: lines.join('\n'), params: used.length, defs: defs.length }
}

// ─── 编辑框里的参数值(2026-09-15 用户)───────────────────────────────
// 条件行显示 `minTotalReturn(0.80)`,点 ✎ 编辑框里原来只有 `minTotalReturn` —— 数字不见了,
// 用户看不到也改不了阈值。编辑框因此显示成「参数名(当前值)」;保存时括号里的值写回那条 input、表达式里还原成参数名,
// 脚本本身始终是合法 ThinkScript(`minTotalReturn(0.8)` 在 ThinkScript 里是函数调用,不能留在脚本里)。
// 只认本脚本 input 的名字、整词匹配(`minStreak` 不会命中 `minStreak2` / `x.minStreak`),已经带 `(` / `[` 的不重复包
function paramRe(n, tail) {
  return new RegExp('(^|[^A-Za-z0-9_.])(' + String(n).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')' + (tail || '(?![A-Za-z0-9_.])'), 'g')
}
function inputVals() {
  const m = {}
  S.conditions.forEach(function (c) { if (c.kind === 'input' && c.expr != null) m[c.name] = String(c.expr).trim() })
  return m
}
function withParams(expr) {
  const vals = inputVals()
  let out = String(expr == null ? '' : expr)
  Object.keys(vals).forEach(function (n) {
    // 注释里的参数名不动(审计:注释写 `# minStreak(小盘5)` 时,保存会报「只能填数字」)
    out = mapCode(out, function (seg) {
      return seg.replace(paramRe(n, '(?![A-Za-z0-9_.(\\[])'), function (_, pre, nm) { return pre + nm + '(' + vals[n] + ')' })
    })
  })
  return out
}
// 只对代码部分做替换:ThinkScript 注释从 # 到行尾
function mapCode(text, fn) {
  return String(text == null ? '' : text).split('\n').map(function (line) {
    const k = line.indexOf('#')
    return k < 0 ? fn(line) : fn(line.slice(0, k)) + line.slice(k)
  }).join('\n')
}
function stripComments(text) {
  return String(text == null ? '' : text).split('\n').map(function (line) {
    const k = line.indexOf('#')
    return k < 0 ? line : line.slice(0, k)
  }).join('\n')
}
// 后端 token 的 s / e 是码点偏移 → JS 字符串(UTF-16)里的下标
function u16At(str, cp) {
  str = String(str == null ? '' : str)
  let i = 0, n = 0
  while (n < cp && i < str.length) {
    const code = str.charCodeAt(i)
    i += (code >= 0xD800 && code <= 0xDBFF && i + 1 < str.length) ? 2 : 1
    n++
  }
  return i
}
const PARAM_VAL = /^(?:[-+]?(?:\d+(?:\.\d*)?|\.\d+)|yes|no|true|false)$/i
function applyParams(text) {
  const vals = inputVals()
  const changes = {}
  let err = null
  let out = String(text == null ? '' : text)
  Object.keys(vals).forEach(function (n) {
    out = mapCode(out, function (seg) {
      return seg.replace(paramRe(n, '\\s*\\(([^()]*)\\)'), function (all, pre, nm, v) {
        v = v.trim()
        if (!PARAM_VAL.test(v)) {
          err = err || ('参数 ' + nm + ' 括号里只能填数字(或 yes / no),这里是「' + v + '」')
          return all
        }
        if (changes[nm] != null && changes[nm] !== v) {
          err = err || ('参数 ' + nm + ' 在这一条里填了两个不同的值(' + changes[nm] + ' 和 ' + v + '),参数是整份脚本共用的,只能有一个值')
          return all
        }
        changes[nm] = v
        return pre + nm
      })
    })
  })
  return { text: out, changes: changes, err: err }
}

// ─── 会员校验与额度(2026-09-14 用户定)──────────────────────────────
// 规则在后端 services/quant/screen_quota.py:要登录;普通会员每天扫描 20 次、AI 识别 10 次;
// 每次扫描后等 5 秒再显示结果。前端只负责三件事:
//   · 没登录**立刻**提醒(打开页面就弹,不等用户点了按钮才说)
//   · 每用一次提示剩余次数,运行栏里常驻今日剩余
//   · 扫描结果倒数 5 秒再显示
// 真正的拦截在接口层 —— 这里藏按钮拦不住任何人。
const QUOTA_API = '/api/quant/screener/quota'
const REVEAL_S = 5
// 实际倒数几秒以后端 /screener/quota 的 scan_gap_s 为准(env SCREEN_SCAN_GAP_S,自用本地部署设 0 = 扫完立刻显示)。
// 额度还没拉到 / 字段缺失 / 写错一律按 5 —— 宁可多等,别悄悄把等待关掉。
function revealSeconds() {
  const v = S.quota && S.quota.scan_gap_s
  return (typeof v === 'number' && Number.isFinite(v) && v >= 0) ? Math.ceil(v) : REVEAL_S
}
const LOGIN_BACK = '/strategies/screener.html'
const LOGIN_MSG = '魔法筛选器是会员功能,登录或注册后即可使用。'

function loginUrl(kind) {
  return '/' + (kind === 'register' ? 'register' : 'login') + '?return_to=' + encodeURIComponent(LOGIN_BACK)
}

function needLogin(msg) {
  S.login = false
  render()
  if (typeof openModal !== 'function') return
  if (document.querySelector('.sc-gate')) return          // 已经弹着了,别叠第二层
  openModal('<div class="sc-gate"><h3>登录后使用魔法筛选器</h3>' +
    '<p>' + esc(msg || LOGIN_MSG) + '</p>' +
    '<p class="sm">普通会员每天可扫描 20 次、AI 识别 10 次,零点(上海时间)重置。登录后会回到这个页面。</p>' +
    '<div class="row"><a class="btn" href="' + loginUrl('login') + '">登录</a>' +
    '<a class="btn small" href="' + loginUrl('register') + '">注册新账号</a>' +
    '<button class="btn small" data-close>先看看</button></div></div>')
}

function vLoginBar() {
  if (S.login !== false) return ''
  return '<div class="sc-login"><span><b>还没登录</b> · ' + esc(LOGIN_MSG) +
    ' 没登录可以看示例,生成条件和运行扫描要先登录。</span>' +
    '<a class="btn small" href="' + loginUrl('login') + '">登录</a>' +
    '<a class="btn small" href="' + loginUrl('register') + '">注册</a></div>'
}

async function loadQuota() {
  let r
  try { r = await fetch(QUOTA_API, { headers: apiHeaders(), cache: 'no-store' }) } catch (e) { return }
  if (!r.ok) return                      // 查不到额度不挡使用,接口层照样会拦
  let d = null
  try { d = await r.json() } catch (e) { return }
  if (!d || d.login === false) { needLogin(d && d.message); return }
  S.login = true
  S.quota = d
  render()
}

function setQuota(q) {
  if (!q || !q.kind) return
  if (!S.quota) S.quota = { login: true }
  S.quota[q.kind] = q
  S.login = true
}

function toastQuota(q, what) {
  if (!q) return
  if (q.unlimited) { toast(what + ' · 管理员不限次数'); return }
  if (!Number.isFinite(q.remaining)) return
  toast(what + ',今天还剩 ' + q.remaining + ' / ' + q.limit + ' 次' +
    (q.remaining === 0 ? ',明天 0 点重置' : ''), q.remaining <= 3 ? 'warn' : '')
}

function vQuota() {
  if (S.login === false) {
    return '<span class="sc-quota">未登录 · <a href="' + loginUrl('login') + '">登录</a> / ' +
      '<a href="' + loginUrl('register') + '">注册</a> 后可用</span>'
  }
  const q = S.quota
  if (!q || !q.scan || !q.ai) return ''
  const one = function (x) {
    if (x.unlimited) return x.label + ' 不限'
    return x.label + ' <b' + (x.remaining === 0 ? ' class="zero"' : '') + '>' + x.remaining + '</b>/' + x.limit
  }
  return '<span class="sc-quota" title="' + esc((q.tier_label || '') + ' · ' + (q.reset_at || '') + ' 重置') + '">' +
    '今日剩余 · ' + one(q.scan) + ' · ' + one(q.ai) + '</span>'
}

function aiLeftText() {
  const a = S.quota && S.quota.ai
  if (!a || a.unlimited || !Number.isFinite(a.remaining)) return ''
  return '(今天还剩 ' + a.remaining + ' 次)'
}

// 401 → 弹登录;429 → 额度用完 / 点太快,把后端带回来的额度记上。返回 true = 已处理(调用方直接收工)
function gateOf(r) {
  if (!r) return false
  if (r.status === 401) { needLogin(errOf(r, LOGIN_MSG)); return true }
  if (r.status === 429) {
    const det = r.data && r.data.detail
    if (det && typeof det === 'object' && det.quota) setQuota(det.quota)
  }
  return false
}

// 扫描完成后倒数再放结果。每秒只改两处数字,不整页重画 —— 整页 render 会把生成框里正在打的字的光标弄丢
function revealAfter(sec) {
  return new Promise(function (resolve) {
    S.reveal = sec
    render()
    const tick = function () {
      S.reveal -= 1
      if (S.reveal <= 0) { S.reveal = 0; resolve(); return }
      ;['sc-reveal-n', 'sc-reveal-btn'].forEach(function (id) {
        const el = document.getElementById(id)
        if (el) el.textContent = String(S.reveal)
      })
      setTimeout(tick, 1000)
    }
    setTimeout(tick, 1000)
  })
}

// ─── 与后端往返 ───────────────────────────────────────────────────
async function post(url, body) {
  let r
  try {
    r = await fetch(url, {
      method: 'POST',
      headers: apiHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify(body),
    })
  } catch (e) {
    // 断网 / 服务正在重启:fetch 直接 reject。原来没接住,generate 里 S.generating 永远是 true,
    // 按钮卡在「生成中」(2026-09-14 执行用例 LB-013 发现)。统一当成一次失败的请求交给调用方显示
    return { ok: false, status: 0, data: { detail: '请求没发出去 · 网络断了或服务正在重启,稍后再试' } }
  }
  let d = null
  try { d = await r.json() } catch (e) { /* 400 也可能不是 JSON */ }
  return { ok: r.ok, status: r.status, data: d }
}

function applyParsed(d) {
  // 启用状态不由前端记 —— 谁在 plot_refs 里谁就是启用的(buildScript 只写启用的)。
  // 变量(非布尔)没有启用概念,恒为 true。见 condsOf。
  S.conditions = condsOf(d)
  // 手工改过之后就不再是"AI 那次翻译的结果"了,徽标跟着清掉 ——
  // 留着会让人以为下面展示的脚本还是当前这套条件(generate 里会再设回去)
  S.ai = d.ai || null
  S.kw = d.kw || null
  S.combine = d.combine || 'all'
  S.plotName = d.plot_name || 'scan'
  S.plotExpr = d.combine === 'custom' ? (d.plot_expr || '') : ''
  S.plotOrder = d.plot_order || []
  S.termHost = d.combine === 'custom' ? '' : (d.term_host || '')
  S.extraPlots = d.extra_plots || []
  if ((d.conditions || []).length) S.draftPending = null
  S.notes = d.notes || []
  S.parseWarnings = d.warnings || []
  // 后端判的「这套条件是不是原样的官方示例」(2026-09-14 · 原样运行不扣扫描次数)。只用于界面提示和按钮,
  // 真正扣不扣由 /screener/run 再判一次
  S.officialPreset = d.official_preset || null
  // 记下判定那一刻的脚本:切开关 / 改数字不一定重新解析,只比标记会一直显示「不计次数」,
  // 而后端 run 会照常扣(2026-09-14 线上实测:关掉一条后提示没消失)。任何本地改动都让脚本变样 → 提示立刻消失
  S.officialScript = S.officialPreset ? buildScript() : null
}

function isOfficialNow() {
  return !!(S.officialPreset && S.officialPreset.market === S.market && S.conditions.length &&
    S.officialScript === buildScript())
}

// 没有 detail 时的兜底文案。502 / 503 / 504(api 重启时 nginx 回的就是 502 HTML)和断网(status 0)
// 不许把裸状态码甩给用户 —— 2026-09-14 执行用例 KK-003 时重启 api,界面显示「扫描失败 · HTTP 502」
function httpFail(what, status) {
  if (status === 0 || status === 502 || status === 503 || status === 504) {
    return what + ':服务正在重启或暂时连不上,稍后再试'
  }
  return what + ' · HTTP ' + status
}

// 后端的 detail 现在可能是对象:NeedsAI 会带 {message, can_try_ai}。
// 老的字符串形式也还在(普通 ScreenError),两种都要认。
function errOf(r, fallback) {
  const d = r && r.data
  const det = d && d.detail
  if (det && typeof det === 'object') return det.message || fallback
  return det || (d && d.error) || fallback
}
function canAi(r) {
  const det = r && r.data && r.data.detail
  return !!(det && typeof det === 'object' && det.can_try_ai)
}

async function reparse(script) {
  if (!script) {
    S.conditions = []; S.result = null; S.officialPreset = null; S.termHost = ''; S.extraPlots = []
    saveDraft(); render(); return true
  }
  const r = await post(PARSE_API, { script: script, market: S.market })
  if (!r.ok) {
    // 被登录 / 额度拦下也是失败:调用方要回滚,不能当成功(审计 2026-09-15:编辑保存被 401 吞掉后条件已被清过孤儿)
    if (gateOf(r)) return false
    S.genError = errOf(r, httpFail('解析失败', r.status))
    S.canTryAi = false
    render(); return false
  }
  S.genError = null
  applyParsed(r.data)
  S.result = null           // 条件变了,旧结果就不是这套条件的结果了,不能留着骗人
  S.probe = {}
  saveDraft(); render()
  return true
}

async function generate(allowAi, preset) {
  // allowAi=true 只可能来自用户点「AI 识别」。生成按钮永远传 undefined,
  // 所以正常点生成**一分钱都不花**:后端先试脚本、再试本地关键词。
  // preset:点官方示例、且在追加模式时由 loadOfficialPreset 传进来(2026-09-22)。
  // 示例脚本直接当输入,**不进生成框、不动生成框里用户正在写的字**,失败也不给 AI 按钮(官方示例本来就该解析得过)
  const text = preset ? preset.script : allowAi ? (S.aiText || '') : (S.input || '').trim()
  if (!text) { S.genError = '生成框是空的。把筛选脚本粘进来,或者点一个示例。'; render(); return }
  if (S.login === false || !getToken()) { needLogin(); return }
  const appending = (S.mode === 'append' && S.conditions.length > 0)

  // 自定义组合下不许追加 —— 现有 plot 是 `a and (b or c)` 这类表达式,
  // 往里塞新条件必然改变它的含义,而"改成什么"只有用户自己知道。
  // 与其猜,不如说清楚让他用「替换」。
  if (appending && S.combine === 'custom') {
    S.genError = '当前条件用的是自定义组合(' + S.plotExpr + '),追加会改变它的含义。' +
      '请切到「替换」,或先把最后一句改成 `plot scan = 条件A and 条件B;` 的形式。'
    render(); return
  }

  S.generating = true; S.genError = null; S.canTryAi = false; S.pending = text; render()
  // **先单独解析新脚本**,拿到它自己的条件对象再合并 ——
  // 早先的做法是把两段脚本用字符串拼起来(还得把旧的 plot 降级成 def),
  // 实测会把脚本绞成 `def scan2 = … and scan and cond_pe;`,而且 400 之后
  // 用户完全看不出发生了什么。结构化合并没有这类惊喜。
  // 追加时把当前脚本当上下文带上:条件行「复制这一条」复制出来的片段没有 plot、还会引用原脚本的定义 / 参数,
  // 单独解析必然失败(2026-09-17 用户:自家复制的东西自家不认)。后端只把片段自己的条件行还回来
  const r = await post(PARSE_API, { script: text, market: S.market, allow_ai: !!allowAi,
    context: appending ? buildScript(true) : null })
  S.generating = false
  if (!r.ok) {
    if (gateOf(r)) { render(); return }
    // 模型已经调用、但结果用不了:后端照计 1 次(token 花掉了),把剩余次数告诉用户
    const det = r.data && r.data.detail
    if (det && typeof det === 'object' && det.quota && r.status === 400) {
      setQuota(det.quota)
      if (det.quota_note) toast(det.quota_note, 'warn')
    }
    S.genError = errOf(r, httpFail('生成失败', r.status))
    // 后端说"本地两条路都不通,可以试 AI" → 把原文记下来,弹按钮等用户点
    S.canTryAi = !preset && canAi(r)
    S.aiText = S.canTryAi ? text : ''
    S.aiKind = (S.canTryAi && r.data.detail.kind === 'script') ? 'script' : 'text'
    render(); return
  }
  const d = r.data
  // 只有真的调了模型,返回体才带 quota(本地识别成功不扣次数,也就不提示)
  if (d && d.quota) {
    setQuota(d.quota)
    toastQuota(d.quota, (d.ai && d.ai.mode === 'fix' ? 'AI 修脚本' : 'AI 识别') + '计 1 次')
  }
  if (appending && d.combine === 'custom') {
    S.genError = '新脚本的最终条件是自定义组合(' + (d.plot_expr || '') + '),' +
      '追加进来会丢掉这层组合关系。请切到「替换」。'
    render(); return
  }

  const sn = snapState(), prevInput = S.input
  const fresh = condsOf(d)
  if (!appending) {
    S.conditions = fresh
    S.combine = d.combine || 'all'
    S.plotName = d.plot_name || 'scan'
    S.plotExpr = d.combine === 'custom' ? (d.plot_expr || '') : ''
    S.plotOrder = d.plot_order || []
    S.termHost = d.combine === 'custom' ? '' : (d.term_host || '')
    S.extraPlots = d.extra_plots || []
  } else {
    mergeAppend(fresh)
  }
  S.input = preset ? prevInput : ''
  S.canTryAi = false; S.aiText = ''
  S.result = null; S.probe = {}
  // 回写再解析一次 —— 保证 tokens / is_bool 与后端完全一致(合并后名字可能改过)。
  // reparse 送的是脚本,不会再触发 AI,所以 d.ai 要在这之后补回去。
  if (!(await reparseKeepOff())) {
    // 合并 / 替换之后回写解析失败(比如追加的脚本里有和宿主同名的定义):条件区退回原样,生成框里的原文还给用户
    restoreState(sn); S.input = preset ? prevInput : (prevInput || text); saveDraft(); render(); return
  }
  S.ai = d.ai || null
  S.kw = d.kw || null
  render()
}

// 把 /parse 的返回变成条件对象(启用状态取自 plot_refs)
function condsOf(d) {
  const refs = {}
  ;(d.plot_refs || []).forEach(function (n) { refs[n] = 1 })
  return (d.conditions || []).map(function (c) {
    return {
      name: c.name, expr: c.expr, tokens: c.tokens, is_bool: c.is_bool,
      // 'input' / 'rec' 是 ThinkScript 的语句关键字(2026-09-15 时间序列脚本),回写脚本时要原样保留;
      // 没有就是 def。丢了它 `input lookback = 5;` 会变成 `def lookback = 5;` —— 引擎能算,但用户
      // 复制回 thinkorswim 时参数面板就没了
      kind: c.kind || 'def',
      // kind='term':plot 里直接写的一项(没有 def),解析回来一定在 plot 里 → 启用
      title: c.title || '', paren: !!c.paren,
      enabled: !c.is_bool ? true : (d.combine === 'custom' || c.kind === 'term' ? true : !!refs[c.name]),
    }
  })
}

// 追加合并:重名的自动改名,并把新条件内部对被改名者的引用一起改掉。
// 两趟走 —— 先算完整张改名表再改写表达式,不然改到一半的名字会被二次替换。
function mergeAppend(fresh) {
  const taken = {}
  S.conditions.forEach(function (c) { if (c.kind !== 'term') taken[c.name] = 1 })
  // 宿主、前面的 plot、plot 名字不在条件列表里,但名字同样被占着 —— 漏掉的话追加一句同名 def,
  // 脚本里出现两句 def 宿主,编译报「定义了两次」(审计 2026-09-15)
  if (S.termHost) taken[S.termHost] = 1
  ;(S.extraPlots || []).forEach(function (p) { taken[p.name] = 1 })
  if (S.plotName) taken[S.plotName] = 1
  const map = {}
  fresh.forEach(function (c) {
    if (c.kind === 'term') return          // term 的名字(scan#k)只是界面标识,不进脚本
    if (!taken[c.name]) { taken[c.name] = 1; return }
    let k = 2
    while (taken[c.name + '_' + k]) k++
    map[c.name] = c.name + '_' + k
    taken[map[c.name]] = 1
  })
  fresh.forEach(function (c) {
    Object.keys(map).forEach(function (old) {
      // 整词替换,和参数匹配同一规则:原来用 \b,x.old / old_2 这类会被误改
      c.expr = mapCode(String(c.expr || ''), function (seg) {
        return seg.replace(paramRe(old), function (_, pre) { return pre + map[old] })
      })
    })
  })
  fresh.forEach(function (c) {
    if (map[c.name]) c.name = map[c.name]
    S.conditions.push(c)
  })
}

async function runScan() {
  const script = buildScript()
  if (!script) { S.runError = '还没有条件'; render(); return }
  if (S.running || S.reveal) return
  if (S.login === false || !getToken()) { needLogin(); return }
  const market = S.market, asOf = S.asOf || null
  S.running = true; S.runError = null; S.result = null; render()
  const r = await post(RUN_API, {
    script: script, market: market, limit: 100,
    sort_by: S.sortBy || null, descending: S.desc,
    as_of: asOf,
  })
  S.running = false
  if (!r.ok) {
    if (gateOf(r)) { render(); return }
    S.runError = errOf(r, httpFail('扫描失败', r.status))
    S.result = null; render(); return
  }
  const d = r.data
  if (d && d.quota) { setQuota(d.quota); toastQuota(d.quota, '本次扫描计 1 次') }
  else if (d && d.official_preset) toast('官方示例「' + d.official_preset.name + '」原样运行,不计扫描次数')
  // 每次扫描后等 5 秒再显示结果(2026-09-14 用户定 · 按 5000 会员保护上游;秒数见 revealSeconds)
  const wait = revealSeconds()
  if (wait > 0) await revealAfter(wait)
  // 倒数的这几秒里条件 / 市场 / 回溯日被改过,这张表就不是当前条件的结果了 —— 不能拿来骗人
  if (buildScript() !== script || S.market !== market || (S.asOf || null) !== asOf) {
    S.result = null
    S.runError = '等待期间条件改过了,这次的结果不再显示(已计 1 次)。请重新运行扫描。'
    render(); return
  }
  S.result = d
  // 悬停日K 要标「这份脚本过去一年哪些天命中」—— 用的必须是**跑出这张结果表的那份脚本**,
  // 不是条件区此刻的样子(用户跑完可能又改了条件还没重跑)
  // runAt 进 HITS 的缓存键:同一份脚本重新扫描一次(日线可能已经更新)就重新取命中日,不拿上一轮的旧结论
  S.resultScan = { script: script, market: market, asOf: asOf, runAt: Date.now() }
  render()
  watchLastHit()
}

// ─── 列头排序:不重新扫描、不扣次数(2026-09-14 用户要求)─────────────────
// 原来点列头 = runScan():扣 1 次扫描次数、等 5 秒倒数、再打一次上游(执行用例 GN-045 发现)。
// 现在两条路:
//   · 命中数不超过表里已有的行(全部命中都在手上)→ 前端直接排,不发请求
//   · 命中比表里多(只带回了前 100 只)→ 请后端按上一次扫描缓存的全部命中重排(resort: true),
//     不扣次数、不倒数、不取数。缓存过期(10 分钟 / 服务重启)就提示要重新运行,**不自动重跑** —— 不替用户花次数
function sortPicksLocal(picks, key, desc) {
  const val = function (p) { return key === 'close' ? p.close : (p.fields || {})[key] }
  const has = picks.filter(function (p) { return val(p) != null })
  const none = picks.filter(function (p) { return val(p) == null })
  has.sort(function (a, b) {
    const x = val(a), y = val(b)
    const c = (typeof x === 'number' && typeof y === 'number') ? x - y : String(x).localeCompare(String(y))
    return desc ? -c : c
  })
  return has.concat(none)                  // 空值不论升序降序都在最后,与后端口径一致
}

async function resortResult() {
  const r = S.result, sc = S.resultScan
  if (!r || !sc || S.running || S.reveal) return
  const picks = r.picks || []
  if (Number.isFinite(r.matched) && r.matched <= picks.length) {
    r.picks = sortPicksLocal(picks, S.sortBy, S.desc)
    render(); return
  }
  if (S.resorting) return
  S.resorting = true
  const resp = await post(RUN_API, {
    script: sc.script, market: sc.market, as_of: sc.asOf, limit: 100,
    sort_by: S.sortBy || null, descending: S.desc, resort: true,
  })
  S.resorting = false
  if (resp.ok && resp.data) { S.result = resp.data; render(); return }
  if (gateOf(resp)) { render(); return }
  toast(errOf(resp, httpFail('排序失败', resp.status)), 'warn')
  render()
}

// ─── 悬停日K 的淡蓝色标记:这只票过去 250 个交易日里哪些天会被这份脚本命中 ─────────
// 后端 /screener/hit-days 按「时间回溯」同一口径逐日回算(screen_hits)。
// 同一只票 + 同一份脚本 + 同一个截止日只算一次;失败也缓存,免得鼠标每划过一次重打一次。
const HITS_API = '/api/quant/screener/hit-days'
const HITS = new Map()
async function hitDaysOf(code) {
  const sc = S.resultScan
  if (!sc || !sc.script || !code) return null
  const key = [sc.market, sc.asOf || '', code, sc.script, sc.runAt || ''].join('|')
  if (HITS.has(key)) return HITS.get(key)
  // in_result:悬停的票就在这张结果表里 → 扫描当日以结果表为准(2026-09-19 用户:「蓝线一定是基于当前筛选器配置命中的」)。
  // 回溯结果本来就和蓝线同一份日线,不传
  const inResult = !sc.asOf && !!(S.result && (S.result.picks || []).some(function (p) { return p.code === code }))
  const r = await post(HITS_API, { script: sc.script, market: sc.market, code: code, as_of: sc.asOf, in_result: inResult })
  let out
  if (r.ok && r.data) {
    const d = r.data
    out = { scan: Array.isArray(d.hits) ? d.hits : [], scanLabel: '这份脚本命中',
            scanWindow: Number.isFinite(d.evaluated) ? d.evaluated : null, alwaysScan: true,
            unknown: Number.isFinite(d.unknown) ? d.unknown : 0, note: d.note || null }
    // 一天都没回算、也没有扫描当日可标 → 才是「算不出」;有扫描当日就照常画(note 进悬停说明)
    if (d.note && !d.evaluated && !(Array.isArray(d.hits) && d.hits.length)) out = { error: d.note }
    else if (d.note) out.noteShow = d.note
    if (!out.error && inResult && d.scan_day) await pinLastBar(out, d, code, sc.market)
  } else {
    out = { error: r.status === 401 ? '登录后才能看这份脚本的历史命中日'
      : '命中日没算出来:' + errOf(r, 'HTTP ' + r.status) }
    if (r.status === 401) { HITS.delete(key); return out }     // 登录之后要能重算,不缓存
  }
  HITS.set(key, out)
  return out
}

// 结果表里的票:日K 图最后一根一定是蓝色(2026-09-19 用户:「扫描器当天扫出来最后一根 K 线一定是淡蓝色的」)。
// 冷门票 / SPAC 在扫描源快照里的最新日K 常停在前一两天(之后没成交),日K 源却补了零成交或一字线的一根,
// 后端按快照日补标就落在倒数第二根。日K 最后一根比快照日新、且快照日是补标的(scan_pinned,不是回算真命中),
// 就把补标挪到最后一根;日K 还没到快照日则如实写明。日K 走 kcFetch 的缓存,和画图同一份,不多发请求。
async function pinLastBar(out, d, code, market) {
  const kp = (typeof kcFetch === 'function') ? await kcFetch(code, market) : null
  const rows = (kp && kp.rows) || []
  const last = rows.length ? String(rows[rows.length - 1].ts || '').slice(0, 10) : ''
  if (last && last > d.scan_day) {
    if (out.scan.indexOf(last) < 0) {
      if (d.scan_pinned) out.scan = out.scan.filter(function (x) { return x !== d.scan_day })
      out.scan = out.scan.concat([last]).sort()
    }
    out.pinNote = '扫描源里这只票的最新日K 停在 ' + d.scan_day + '(之后没有成交),扫描用的就是那根;日K 图最后一根 ' + last + ' 按扫描结果标为命中'
  } else if (last && last < d.scan_day) {
    out.pinNote = (d.scan_note ? d.scan_note + ';' : '') + '日K 图数据只到 ' + last + ',还没有扫描当日那一根'
  } else if (d.scan_note) {
    out.pinNote = d.scan_note
  }
}

// 单独测试一条:只留这一条(和它依赖的变量)跑一次,看它自己能命中多少。
// 用来判断"是哪一条把结果筛没了"。
async function probeOne(c) {
  const lines = []
  S.conditions.forEach(function (o) {
    if (!o.expr || o.kind === 'term') return        // term 不是 def,只测它自己那一项
    lines.push((o.kind === 'input' ? 'input ' : (o.kind === 'rec' ? 'rec ' : 'def ')) + o.name + ' = ' + o.expr + ';')
  })
  lines.push('plot ' + S.plotName + ' = ' + (c.kind === 'term' ? c.expr : c.name) + ';')
  // probe:true —— 单条测试不扣扫描次数,后端只回命中数(见 screen_quota 文件头)
  const r = await post(RUN_API, { script: lines.join('\n'), market: S.market, limit: 1, as_of: S.asOf || null, probe: true })
  if (gateOf(r)) return
  if (r.status === 429) toast(errOf(r, '单条测试太频繁'), 'warn')
  S.probe[c.name] = (r.ok && r.data && Number.isFinite(r.data.matched)) ? r.data.matched : null
  render()
}

// ─── 字段搜索 ─────────────────────────────────────────────────────
let fdTimer = null
function debounceFields() {
  if (fdTimer) clearTimeout(fdTimer)
  fdTimer = setTimeout(searchFields, 220)
}
async function searchFields() {
  const q = document.getElementById('sc-fd-q')
  const list = document.getElementById('sc-fd-list')
  if (!q || !list) return
  const kw = (q.value || '').trim()
  if (!kw) { list.innerHTML = '<span class="sc-na">输入关键词开始搜索</span>'; return }
  let r
  try {
    r = await fetch(FIELD_API + '?market=' + encodeURIComponent(S.market) +
      '&q=' + encodeURIComponent(kw) + '&limit=60', { headers: apiHeaders() })
  } catch (e) { list.innerHTML = '<span class="sc-na">搜索请求没发出去</span>'; return }
  if (r.status === 401) {
    // 先弹登录再写提示:needLogin 会整页 render,先写的话提示当场被冲掉(2026-09-14 执行 QX-001 时发现)
    needLogin()
    const l2 = document.getElementById('sc-fd-list')
    if (l2) l2.innerHTML = '<span class="sc-na">登录后才能搜索字段</span>'
    return
  }
  if (!r.ok) { list.innerHTML = '<span class="sc-na">搜索失败 HTTP ' + r.status + '</span>'; return }
  let d
  try { d = await r.json() } catch (e) { list.innerHTML = '<span class="sc-na">返回的不是合法 JSON</span>'; return }
  const fs = (d && d.fields) || []
  if (!fs.length) { list.innerHTML = '<span class="sc-na">没有匹配的字段</span>'; return }
  // 只写内容,不挂监听 —— 监听在 bind() 里挂一次(2026-09-10:原来每次搜完都再挂一个,
  // 连搜三次后点一个字段会插三份)
  // 显示中文名、鼠标悬停出英文原名;**插进脚本的永远是英文字段名**
  // (DSL 只认英文,插中文进去必然解析失败)。
  // 后端拿不准时 label 为 null,这里就照旧显示英文 —— 半吊子翻译更误导。
  S.fieldRows = fs
  S.fieldOpen = {}          // 换了关键词就把展开状态清掉
  paintFields()
}

// 把搜索结果画出来。只有数字不同的字段(EMA10…EMA300)后端已经折叠成一族,
// 这里画成一个可点开的族标签 —— 不折叠的话搜个 "e" 就被 31 个 EMA 刷满整屏。
function paintFields() {
  const list = document.getElementById('sc-fd-list')
  if (!list) return
  const rows = S.fieldRows || []
  const html = rows.map(function (f) {
    const name = (typeof f === 'string') ? f : (f && f.name)
    if (!name) return ''
    if (f.members && f.members.length) {
      const open = !!S.fieldOpen[f.family]
      const head = '<span class="fam' + (open ? ' on' : '') + '" data-fam="' + esc(f.family) + '"' +
        ' title="' + esc(f.family) + ' · ' + f.count + ' 个周期,点开选">' +
        esc(f.label || f.family) + '<b>' + f.count + '</b></span>'
      if (!open) return head
      return head + f.members.map(function (m) {
        return '<span data-f="' + esc(m.name) + '" title="' + esc(m.name) + '"' +
          (m.label ? ' class="cn sub"' : ' class="sub"') + '>' + esc(m.label || m.name) + '</span>'
      }).join('')
    }
    const label = f.label || ''
    return '<span data-f="' + esc(name) + '" title="' + esc(name) + '"' +
      (label ? ' class="cn"' : '') + '>' + esc(label || name) + '</span>'
  }).join('')
  list.innerHTML = html || '<span class="sc-na">没有匹配的字段</span>'
}

function insertField(e) {
  const t = e.target
  // 族标签:点开/收起,不插入。族里的周期各不相同,替用户挑一个是瞎猜。
  const fam = t && t.dataset ? t.dataset.fam : null
  if (fam) {
    S.fieldOpen[fam] = !S.fieldOpen[fam]
    paintFields()
    return
  }
  const s = t && t.dataset ? t.dataset.f : null
  if (!s) return
  const ed = document.getElementById('mg-input')
  if (!ed) return
  const v = ed.value || ''
  let a = ed.selectionStart, b = ed.selectionEnd
  if (typeof a !== 'number' || typeof b !== 'number') { a = v.length; b = v.length }
  S.input = v.slice(0, a) + s + v.slice(b)
  ed.value = S.input
  const pos = a + s.length
  try { ed.focus(); ed.setSelectionRange(pos, pos) } catch (err) { /* 老浏览器 */ }
}

// 恢复草稿:解析不成(没登录 / 额度 / 报错)就把原文记在 draftPending,saveDraft 不会覆盖它
async function restoreDraft(draft) {
  const ok = await reparse(draft)
  if (!ok) S.draftPending = draft
  return ok
}

// ─── 启动 ─────────────────────────────────────────────────────────
async function boot() {
  try {
    const m = localStorage.getItem(LS_MK)
    if (m) S.market = m
  } catch (e) { /* 隐私模式 */ }
  render()                                   // 先把骨架画出来,不等网络
  // 没有令牌 = 肯定没登录,不等网络**立刻**提醒;有令牌再问后端(可能过期 / 被当成匿名)并拿今日剩余次数
  if (!getToken()) needLogin()
  else loadQuota()

  let r
  try {
    r = await fetch(META_API, { headers: apiHeaders(), cache: 'no-store' })
  } catch (e) {
    S.metaErr = '请求没发出去 · ' + (e && e.message ? e.message : e); render(); return
  }
  if (!r.ok) { S.metaErr = 'HTTP ' + r.status; render(); return }
  try { S.meta = await r.json() } catch (e) { S.metaErr = '返回的不是合法 JSON'; render(); return }
  loadSaved()

  // ?preset=xxx 是明确指令,优先级高于上次草稿
  let want = null
  try { want = new URLSearchParams(location.search || '').get('preset') } catch (e) { /* 老浏览器 */ }
  const chosen = want ? (S.meta.presets || []).filter(function (p) { return p.key === want })[0] : null
  if (chosen) {
    S.input = chosen.script
    S.market = chosen.market || S.market
    S.mode = 'replace'
    await generate()
    S.mode = 'append'
    render(); return
  }
  let draft = null
  try { draft = localStorage.getItem(LS) } catch (e) { /* 隐私模式 */ }
  if (draft && draft.trim()) { await restoreDraft(draft); return }
  render()
}

boot()
</script>
