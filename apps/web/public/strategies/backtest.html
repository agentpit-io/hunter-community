<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>回测结果 · 猎鹿人 Hunter</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
<script src="app.js"></script>
<script>
const draft = loadDraft()

// 从 localStorage 读真回测结果(workbench "跑回测" 按钮存的)
let realResult = null
try {
  const raw = localStorage.getItem('hunter_backtest_result')
  if (raw) realResult = JSON.parse(raw)
} catch { /* ignore */ }

const isReal = !!realResult

document.body.innerHTML = renderShell(
  'backtest',
  '策略广场 / 回测结果',
  `· ${draft.name || '未命名策略'} · ${isReal
    ? realResult.start + ' → ' + realResult.end + ' · ✅ 真回测'
    : '尚未回测'}`,
  `<button class="btn small" id="btn-share"><span class="hi hi-link"></span>分享</button>
   <button class="btn small" id="btn-save"><span class="hi hi-save"></span>保存策略</button>
   <button class="btn small ask-hunter" id="btn-ask"><span class="hi hi-seal"></span>让 Hunter 详细分析</button>`
)

const container = document.getElementById('page-content')

// **不再用 mock 补齐**(_17 §1)。
//
// 原来这里是 Object.assign({ir:0.98, win_rate:0.62, ...}, realResult.metrics) ——
// 后端不返回的字段被写死的常量补上,于是页面同屏出现
// "年化 -1.2%(真)" 和 "信息比率 0.98(假)",用户没法分辨哪个是算的。
//
// 现在:后端给什么就显示什么,没给的显示 "—" 并注明原因。
// 假数字比缺数字危险得多 —— 缺了用户知道自己不知道,假了他以为自己知道。
const metrics = realResult?.metrics || draft._metrics || {}
const quality  = realResult?.quality || null
const bench    = realResult?.benchmark || null

// 后端算不出来的一律显示 "—"。**不要用 || 0 兜底** ——
// 0.00 看起来像个结论,"—" 才让人知道这里没数
const num = (v, digits = 2, suffix = '') =>
  (v === null || v === undefined || Number.isNaN(v)) ? '—' : v.toFixed(digits) + suffix
const pct = (v) =>
  (v === null || v === undefined || Number.isNaN(v)) ? '—' : fmtPct(v)

const cfg = draft.config || { universe: 'hs300', top_n: 20, rebalance: 'M', cost_bps: 15, benchmark: '000300' }

try {
container.innerHTML = `
<div class="rp-layout">

  <!-- 参数 meta bar -->
  <div class="meta-bar">
    <span><b>因子</b>${draft.factors.map(k => factorByKey(k)?.name).filter(Boolean).join(' · ')}</span>
    <span class="sep">·</span>
    <span><b>权重</b>${draft.factors.map(k => (draft.weights[k]||0) + '%').join(' · ')}</span>
    <span class="sep">·</span>
    <span><b>股票池</b>${UNIVERSE_NAME[cfg.universe]}</span>
    <span class="sep">·</span>
    <span><b>持仓</b>Top ${cfg.top_n}</span>
    <span class="sep">·</span>
    <span><b>换仓</b>${REBALANCE_NAME[cfg.rebalance] || '月度'}${
      realResult?.rebalance_used && realResult.rebalance_used !== cfg.rebalance
        ? '<span style="color:#B06A32"> (实际:月度)</span>' : ''}</span>
    <span class="sep">·</span>
    <span><b>成本</b>${cfg.cost_bps} bps</span>
    <span class="sep">·</span>
    <span><b>基准</b>${bench ? (BENCHMARK_NAME[cfg.benchmark] || cfg.benchmark)
      : '<span style="opacity:.6">未接入</span>'}</span>
  </div>

  <!-- 成色提示(_17 §5)· 用户拿到一个漂亮回测,看不出里面有没有偏差。
       让他知道成色,比修好它更急 —— 修要等历史成分累积一两年,
       而误判"这策略能用"是现在就会发生的 -->
  ${(quality && (!quality.survivorship_ok || quality.rebalance_note)) ? `
  <div class="quality-warn">
    <b>⚠ 这次回测的成色</b>
    ${quality.survivorship_ok ? '' : `<div>· ${quality.note}</div>`}
    ${quality.rebalance_note ? `<div>· ${quality.rebalance_note}</div>` : ''}
    ${metrics.n_periods && metrics.n_periods < 12
      ? `<div>· 只跑了 <b>${metrics.n_periods}</b> 期(不足一年)—— 样本太少,指标参考价值有限。</div>` : ''}
    ${bench ? '' : '<div>· 基准未接入,无法判断是否跑赢大盘。</div>'}
  </div>` : ''}

  <!-- 6 指标卡 -->
  <div class="metric-grid">
    <div class="m-card">
      <div class="k">年化收益</div>
      <div class="v ${metrics.ann_ret>=0?'pos':'neg'}">${pct(metrics.ann_ret)}</div>
      <div class="sub">${bench ? `基准 ${pct(bench.ann_ret)} · 超额 ${pct(metrics.ann_ret - bench.ann_ret)}`
        : '基准未接入 · 无法算超额'}</div>
    </div>
    <div class="m-card">
      <div class="k">夏普比率</div>
      <div class="v ${metrics.sharpe>=1?'pos':''}">${num(metrics.sharpe)}</div>
      <div class="sub">&gt;1 稳定 · &gt;1.5 卓越</div>
    </div>
    <div class="m-card">
      <div class="k">最大回撤</div>
      <div class="v neg">${pct(metrics.max_dd)}</div>
      <div class="sub">${bench ? `基准同期 ${pct(bench.max_dd)}` : '基准未接入'}</div>
    </div>
    <div class="m-card">
      <div class="k">信息比率</div>
      <div class="v ${metrics.ir>=0.5?'pos':''}">${num(metrics.ir)}</div>
      <div class="sub">${metrics.ir==null ? '需要基准才能计算' : '超额收益稳定性 · &gt;0.5 合格'}</div>
    </div>
    <div class="m-card">
      <div class="k">月度胜率</div>
      <div class="v">${metrics.win_rate==null?'—':(metrics.win_rate*100).toFixed(0)+'%'}</div>
      <div class="sub">${metrics.n_periods
        ? `${metrics.n_periods} 期中 ${Math.round(metrics.n_periods*metrics.win_rate)} 期为正`
        : '—'}<br><span style="opacity:.7">这是绝对胜率 · 不是跑赢基准的比例</span></div>
    </div>
    <div class="m-card">
      <div class="k">平均换手</div>
      <div class="v">${metrics.turnover==null?'—':(metrics.turnover*100).toFixed(0)+'%'}</div>
      <div class="sub">${metrics.turnover==null?'—':`月换手 · 年成交成本 ≈ ${((metrics.turnover*12*cfg.cost_bps)/100).toFixed(2)}%`}</div>
    </div>
  </div>

  <!-- NAV -->
  <div class="chart-panel">
    <div class="hd">
      <div class="title"><span class="hi hi-chart" style="color:var(--brand)"></span> 净值曲线</div>
      <div class="actions">
        <button class="btn small ghost">1M</button>
        <button class="btn small ghost">6M</button>
        <button class="btn small ghost">1Y</button>
        <button class="btn small">3Y</button>
        <button class="btn small ghost">全部</button>
      </div>
    </div>
    <div id="nav-chart" style="width:100%;height:320px"></div>
    <div style="display:flex;gap:20px;margin-top:10px;padding-left:20px;font-size:12px">
      <span style="display:flex;align-items:center;gap:6px"><span style="width:20px;height:3px;background:#b56b2d"></span>策略 · ${draft.name || '当前组合'}</span>
      ${bench ? `<span style="display:flex;align-items:center;gap:6px"><span style="width:20px;height:3px;background:#a2a49d"></span>基准 · ${BENCHMARK_NAME[cfg.benchmark] || cfg.benchmark}</span>` : ''}
      ${isReal ? `<span style="background:#EEF5F1;color:#2C6B55;padding:2px 8px;border-radius:6px;font-size:11">✅ 真回测 · ${realResult.nav_series?.length||0} 期 · ${realResult.duration_ms||0}ms</span>` : ''}
      <span style="margin-left:auto;color:var(--muted)">悬浮曲线看某日详情</span>
    </div>
  </div>

  <!-- C4.1 · 分档收益 · 单因子有效性验证 -->
  <div class="chart-panel">
    <div class="hd">
      <div class="title"><span class="hi hi-chart" style="color:var(--brand)"></span> 因子分档验证</div>
      <div class="actions">
        <select id="qt-factor" class="btn small" style="border:1px solid var(--divider);background:var(--bg)"></select>
        <select id="qt-buckets" class="btn small" style="border:1px solid var(--divider);background:var(--bg)">
          <option value="5">5 档</option>
          <option value="10" selected>10 档</option>
        </select>
      </div>
    </div>
    <div style="color:var(--muted);font-size:11.5px;margin-bottom:8px">
      按单因子 z-score 排序分档 · 每档等权持仓一期到下一次调仓 · Q10 显著 > Q1 说明因子有效。
    </div>
    <div id="qt-chart" style="width:100%;height:260px"></div>
    <div id="qt-verdict" style="text-align:center;font-size:12px;color:var(--muted);margin-top:8px"></div>
  </div>

  <!-- C4.2 · 最后一期持仓贡献 · 每只股票各因子贡献值 -->
  <div class="chart-panel">
    <div class="hd">
      <div class="title"><span class="hi hi-puzzle" style="color:var(--brand)"></span> 最后一期持仓 · 因子贡献</div>
      <div class="actions">
        <span style="color:var(--muted);font-size:11.5px">仅显示 Top 15 · 正值绿 / 负值红</span>
      </div>
    </div>
    <div id="positions-contrib-wrap" style="overflow-x:auto"></div>
  </div>

  <!-- 归因 + 持仓 · 两栏 -->
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">

    <!-- 归因 -->
    <div class="chart-panel">
      <div class="hd">
        <div class="title"><span class="hi hi-target" style="color:var(--brand)"></span> 因子归因</div>
        <div class="actions">
          <button class="btn small ghost">近 1 月</button>
          <button class="btn small">3 年</button>
        </div>
      </div>
      <div style="color:var(--muted);font-size:11.5px;margin-bottom:12px">
        ${bench
          ? `超额收益 <b style="color:var(--brand-dark);font-family:var(--serif);font-size:14px">${fmtPct(metrics.ann_ret - bench.ann_ret)}</b> 拆解到各因子:`
          : '最后一期持仓里,各因子的**打分贡献**(不是收益归因 —— 那要有基准):'}
      </div>
      <div class="attrib" id="attrib-list"></div>
      <div style="margin-top:12px;padding:10px 12px;background:var(--tag-ok-bg);color:var(--tag-ok-fg);border-radius:8px;font-size:11.5px;line-height:1.6">
        <b>解读</b> · 分散多风格是抗风险关键 · 若单因子失效，其他因子可顶上。
        <span style="color:var(--brand);cursor:pointer;text-decoration:underline;display:inline-flex;align-items:center;gap:4px" id="btn-ask-explain">让 Hunter 详细解读 <span class="hi hi-arrow-r"></span></span>
      </div>
    </div>

    <!-- 持仓变化 -->
    <div class="chart-panel">
      <div class="hd">
        <div class="title"><span class="hi hi-refresh" style="color:var(--brand)"></span> 持仓变化</div>
        <div class="actions">
          <button class="btn small ghost">近 6 次</button>
          <button class="btn small">全部</button>
        </div>
      </div>
      <div class="tl-panel" style="padding:0;border:0;box-shadow:none">
        <div class="tl-item"><div class="date">2026-08-01</div><div class="stocks"><span class="in">+ 山西汾酒 · 陕西煤业</span><br><span class="out">- 隆基绿能 · 通威股份</span><div style="color:var(--muted);font-size:11px;margin-top:4px">换仓 2 只（10%）· 新能源估值/动量双落</div></div></div>
        <div class="tl-item"><div class="date">2026-07-01</div><div class="stocks"><span class="in">+ 迈瑞医疗 · 海尔智家</span><br><span class="out">- 三一重工 · 顺丰控股</span><div style="color:var(--muted);font-size:11px;margin-top:4px">换仓 2 只 · 医疗动量修复</div></div></div>
        <div class="tl-item"><div class="date">2026-06-01</div><div class="stocks"><span class="in">+ 中国平安 · 农业银行</span><br><span class="out">- 中远海控 · 万科A</span><div style="color:var(--muted);font-size:11px;margin-top:4px">换仓 2 只 · 金融 ROE 修复</div></div></div>
        <div class="tl-item"><div class="date">2026-05-01</div><div class="stocks"><span style="color:var(--muted)">当月无变化 · 持仓稳定</span></div></div>
        <div style="text-align:center;padding:10px 0;color:var(--brand);font-size:12px;cursor:pointer">
          展开全部 36 次调仓 <span class="hi hi-arrow-r"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- D-5 · Bootstrap 稳健性 -->
  <div class="chart-panel" id="bootstrap-panel">
    <div class="hd">
      <div class="title">🎲 Bootstrap 稳健性检验 · 100 次随机 1 年窗口</div>
      <div class="actions">
        <button class="btn small primary" id="btn-run-bootstrap"><span class="hi hi-play"></span>跑 100 次</button>
      </div>
    </div>
    <div style="color:var(--muted);font-size:11.5px;margin-bottom:12px">
      在近 3 年内 · 随机取 100 个 1 年窗口 · 各跑一次回测 · 输出各指标 5/25/50/75/95 分位数 · 展示"最好 vs 最差"区间。
    </div>
    <div id="bootstrap-status" style="color:var(--muted);font-size:12px;min-height:20px"></div>
    <div id="bootstrap-result" style="display:none">
      <table style="width:100%;border-collapse:collapse;margin-top:12px;font-size:12px">
        <thead style="background:var(--panel);color:var(--text);font-size:11.5px">
          <tr>
            <th style="padding:8px 10px;text-align:left">指标</th>
            <th style="padding:8px 10px;text-align:right">5% (最差)</th>
            <th style="padding:8px 10px;text-align:right">25%</th>
            <th style="padding:8px 10px;text-align:right;background:var(--tag-ok-bg);color:var(--tag-ok-fg)">50% (中位)</th>
            <th style="padding:8px 10px;text-align:right">75%</th>
            <th style="padding:8px 10px;text-align:right">95% (最好)</th>
            <th style="padding:8px 10px;text-align:right;color:var(--muted)">std</th>
          </tr>
        </thead>
        <tbody id="bootstrap-tbody"></tbody>
      </table>
      <div style="margin-top:10px;padding:8px 10px;background:var(--tag-warn-bg);color:var(--tag-warn-fg);border-radius:6px;font-size:11px" id="bootstrap-note"></div>
    </div>
  </div>

  <!-- C6 · 半自动下单 CSV 导出 -->
  <div class="chart-panel" id="orders-panel">
    <div class="hd">
      <div class="title"><span class="hi hi-download" style="color:var(--brand)"></span> 生成券商下单清单(CSV)</div>
      <div class="actions"><span style="color:var(--muted);font-size:11.5px">按当前持仓 + 等权 + 最新 close 生成</span></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px">
      <div class="field">
        <div class="lbl" style="font-size:11px;color:var(--muted);margin-bottom:4px">总资金(元)</div>
        <input type="number" id="ord-capital" class="input" value="100000" step="1000" min="1000" />
      </div>
      <div class="field">
        <div class="lbl" style="font-size:11px;color:var(--muted);margin-bottom:4px">券商格式</div>
        <select id="ord-broker" class="input">
          <option value="em">东方财富</option>
          <option value="ht">华泰涨乐</option>
          <option value="generic">通用 CSV</option>
        </select>
      </div>
      <div class="field">
        <div class="lbl" style="font-size:11px;color:var(--muted);margin-bottom:4px">价格类型</div>
        <select id="ord-pt" class="input">
          <option value="market">市价单</option>
          <option value="limit">限价单(用最新 close)</option>
        </select>
      </div>
      <div class="field" style="display:flex;align-items:flex-end">
        <button class="btn primary" id="btn-gen-orders" style="width:100%"><span class="hi hi-download"></span>下载 CSV</button>
      </div>
    </div>
    <div id="ord-status" style="color:var(--muted);font-size:11.5px;min-height:16px"></div>
    <div style="margin-top:8px;padding:10px 12px;background:var(--tag-warn-bg);color:var(--tag-warn-fg);border-radius:8px;font-size:11.5px;line-height:1.6">
      ⚠️ 本工具仅生成下单清单 · 不代表投资建议 · 所有交易决策与风险由用户自负 · 导入券商前请仔细核对每一笔
    </div>
  </div>

  <!-- 底部 CTA -->
  <div class="chart-panel" style="background:linear-gradient(180deg,#fff9f0 0%,#fff 100%);border-color:#e8dcc4;display:flex;align-items:center;gap:16px;padding:20px 22px">
    <div style="flex:1">
      <div style="font-family:var(--serif);font-size:15px;font-weight:600;color:var(--brand-dark)">
        想追踪这个策略每天的 top 20？
      </div>
      <div style="color:var(--muted);font-size:12px;margin-top:4px">
        每交易日 15:30 收盘后自动推送持仓变动 · 支持 WeChat / 飞书群机器人
      </div>
    </div>
    <button class="btn ask-hunter" id="btn-ask-2"><span class="hi hi-seal"></span>问 Hunter</button>
    <button class="btn primary" id="btn-subscribe"><span class="hi hi-bell"></span>订阅每日推送</button>
  </div>

  <!-- 相似策略 -->
  <div class="chart-panel">
    <div class="hd">
      <div class="title"><span class="hi hi-lightbulb" style="color:var(--brand)"></span> 你可能还会喜欢</div>
      <div class="actions"><button class="btn small ghost">仅看官方</button></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px" id="similar-strategies"></div>
  </div>

  <div style="text-align:center;color:var(--soft);font-size:11px;margin-top:8px">
    回测数据来自 finance-data.agentpit.io · 复权 · 剔除 ST/停牌/新股。
    <b style="color:var(--muted)">历史表现不代表未来收益</b> · 单一策略不构成投资建议 · 请结合自身风险承受能力决策。
  </div>
</div>
`
} catch (err) {
  console.error('[backtest] 渲染失败:', err)
  container.innerHTML = `
    <div class="empty" style="padding:80px 20px">
      <div class="ic">⚠</div>
      <div class="msg">回测结果加载失败</div>
      <div style="color:var(--muted);font-size:12px;max-width:520px;margin:0 auto 20px;line-height:1.65">
        错误: <code style="background:var(--panel-2);padding:2px 6px;border-radius:4px;color:var(--danger)">${(err.message || err).toString().slice(0, 200)}</code><br>
        请先从<a href="/strategies/index.html" style="color:var(--brand)">策略广场</a>选一条策略,或在<a href="/strategies/workbench.html" style="color:var(--brand)">工作台</a>搭建后再回来。
      </div>
      <a href="/strategies/index.html" class="btn primary">返回策略广场</a>
    </div>`
  throw err
}

// B3 · echarts NAV 曲线 · 用真 nav_series
(function initNavChart() {
  const el = document.getElementById('nav-chart')
  if (!el || !window.echarts) return
  const chart = echarts.init(el)

  // **没有真回测就不画图**(_17 全量排查)。
  //
  // 原来这里在无数据时画一条编的 36 期曲线(1.0 → 1.66,年化约 18%),
  // 而基准是 「1 + i*0.005」 一条直线 —— 用户截图里那条灰虚线就是它。
  // 一张看起来很专业的图,底下一个真数字都没有。
  //
  // 空图比假图好:空的用户知道要去跑回测,假的他以为已经跑过了。
  if (!isReal || !realResult.nav_series?.length) {
    el.innerHTML = `<div style="padding:48px 20px;text-align:center;color:var(--muted);font-size:13px;line-height:1.9">
      还没有回测数据<br>
      <span style="font-size:11.5px">到「策略工作台」配好因子权重,点『跑回测』</span>
    </div>`
    return
  }
  const dates = realResult.nav_series.map(p => p.date)
  const navs  = realResult.nav_series.map(p => p.nav)

  // 基准 —— 后端返回才画。**不再用 「1 + i*0.005」 这条假直线**:
  // 它让每张图都显得"策略跑输了一条稳稳向上的大盘",而那条线是编的
  const benchSeries = realResult.benchmark?.nav_series || null
  const bench = benchSeries ? benchSeries.map(p => p.nav) : null

  chart.setOption({
    grid: {left: 55, right: 30, top: 25, bottom: 40},
    tooltip: {trigger: 'axis', formatter: p => {
      const s = p.find(x=>x.seriesName==='策略')
      const b = p.find(x=>x.seriesName==='基准')
      return `<b>${p[0].axisValue}</b><br>策略: <b>${(s?.value||1).toFixed(4)}</b><br>基准: ${(b?.value||1).toFixed(4)}`

// ─── C4.1 · 分档收益 · echarts 柱状图 ───
;(function initQuantileChart() {
  const el = document.getElementById('qt-chart')
  const sel = document.getElementById('qt-factor')
  const nBucketsSel = document.getElementById('qt-buckets')
  if (!el || !sel || !window.echarts) return

  // 只列 draft 里选中的因子(≤ 6 个 · 用户关心的)+ 前 3 高 IC 因子
  const draftFactors = draft.factors || []
  const optionKeys = [...new Set([...draftFactors, 'pe_inv', 'roe', 'momentum_12m_1m'])].slice(0, 8)
  sel.innerHTML = optionKeys.map(k => {
    const f = factorByKey(k)
    return `<option value="${k}">${(f?.icon||'')} ${f?.name || k}</option>`
  }).join('')

  const chart = echarts.init(el)
  async function loadAndRender() {
    const key = sel.value
    const n = parseInt(nBucketsSel.value)
    const universe = (draft.config?.universe) || 'hs300'
    el.innerHTML = '<div style="color:var(--muted);padding:60px 0;text-align:center">加载分档数据…</div>'
    let d
    try {
      const r = await fetch(`/api/quant/factors/${encodeURIComponent(key)}/quantile?universe=${universe}&n_buckets=${n}`)
      d = await r.json()
    } catch (e) {
      el.innerHTML = `<div style="color:var(--danger);padding:60px 0;text-align:center">加载失败: ${e.message}</div>`
      return
    }
    el.innerHTML = ''
    chart.resize && chart.clear()
    const buckets = Object.keys(d.quantiles || {}).sort((a,b) => parseInt(a.slice(1)) - parseInt(b.slice(1)))
    const values = buckets.map(b => d.quantiles[b])
    const hasData = values.filter(v => v !== null).length >= 2
    if (!hasData) {
      el.innerHTML = `<div style="color:var(--muted);padding:60px 0;text-align:center">该因子期间数据不足(${d.periods || 0} 期)</div>`
      document.getElementById('qt-verdict').textContent = '数据不足 · 等 APScheduler 累积更多历史后重试'
      return
    }
    chart.setOption({
      grid: {left: 55, right: 20, top: 20, bottom: 40},
      tooltip: {trigger: 'axis', formatter: p => `${p[0].axisValue}: <b>${(p[0].value*100).toFixed(2)}%</b>`},
      xAxis: {type: 'category', data: buckets, axisLabel: {fontSize: 11, color: '#7c7a72'},
              axisLine: {lineStyle: {color: '#deddd5'}}, axisTick: {show: false}},
      yAxis: {type: 'value', axisLabel: {fontSize: 10, color: '#a2a49d',
              formatter: v => (v*100).toFixed(0)+'%'}, splitLine: {lineStyle: {color: '#efeee8'}}},
      series: [{
        type: 'bar', data: values.map(v => ({
          value: v === null ? 0 : v,
          itemStyle: {color: v === null ? '#eee' : (v > 0 ? '#4a8f5c' : '#c85a5a')},
        })),
        barWidth: '55%',
        label: {show: true, position: 'top', color: '#7c7a72', fontSize: 10,
                formatter: p => p.value === 0 ? '-' : (p.value*100).toFixed(1)+'%'},
      }],
    })
    // verdict
    const verdictEl = document.getElementById('qt-verdict')
    const first = d.quantiles.q1
    const last = d.quantiles[`q${d.n_buckets}`]
    const gap = (first !== null && last !== null) ? (last - first) : null
    if (d.monotonic) {
      verdictEl.innerHTML = `<span style="color:#2C6B55">✅ 单调有效</span> · Q${d.n_buckets} - Q1 = <b>${gap !== null ? (gap*100).toFixed(1)+'%' : '?'}</b> · 该因子在近 1 年数据上 <b>验证有效</b>`
    } else {
      verdictEl.innerHTML = `<span style="color:#c85a5a">⚠ 非单调</span> · Q${d.n_buckets} - Q1 = <b>${gap !== null ? (gap*100).toFixed(1)+'%' : '?'}</b> · 该因子在近 1 年可能失效或需要更长历史`
    }
  }
  sel.addEventListener('change', loadAndRender)
  nBucketsSel.addEventListener('change', loadAndRender)
  loadAndRender()
  window.addEventListener('resize', () => chart.resize())
})()

// ─── D-5 · Bootstrap 稳健性 ───
;(function initBootstrap() {
  const btn = document.getElementById('btn-run-bootstrap')
  const status = document.getElementById('bootstrap-status')
  const wrap = document.getElementById('bootstrap-result')
  const tbody = document.getElementById('bootstrap-tbody')
  const note = document.getElementById('bootstrap-note')
  if (!btn) return
  btn.addEventListener('click', async () => {
    if (!draft.factors.length) { status.textContent = '⚠ 无因子 · 先在工作台选'; return }
    btn.disabled = true; btn.textContent = '⏳ 提交...'
    status.textContent = '等 100 次窗口回测 · 需 60-120 秒'
    wrap.style.display = 'none'
    const factors = draft.factors.map(k => ({key: k, weight_pct: draft.weights[k] || 0}))
                                  .filter(f => f.weight_pct > 0)
    try {
      const r = await fetch('/api/quant/backtest/bootstrap', {
        method: 'POST', headers: apiHeaders(),
        body: JSON.stringify({factors, config: draft.config, n_bootstrap: 100, sub_period_days: 365}),
      })
      const submitD = await r.json()
      if (!submitD.task_id) throw new Error(submitD.message || 'submit failed')
      const taskId = submitD.task_id
      btn.textContent = '⏳ 计算中...'
      let d = null
      const maxRounds = 200   // 5 分钟
      for (let i = 0; i < maxRounds; i++) {
        await new Promise(res => setTimeout(res, 1500))
        const s = await fetch(`/api/quant/backtest/status/${taskId}`).then(r => r.json())
        if (s.status === 'running') {
          status.textContent = `⏳ 计算中 · ${Math.round((Date.now() - (s.started_at||Date.now()/1000)*1000)/1000)} s`
        }
        else if (s.status === 'done') { d = s.result; break }
        else if (s.status === 'error') throw new Error(s.message || s.error)
      }
      if (!d) throw new Error('超时(5 分钟)')

      // 渲染分位数表
      const labels = {
        ann_ret: {name: '年化收益', fmt: v => (v*100).toFixed(2)+'%'},
        sharpe: {name: '夏普', fmt: v => v.toFixed(2)},
        sortino: {name: 'Sortino', fmt: v => v.toFixed(2)},
        max_dd: {name: '最大回撤', fmt: v => (v*100).toFixed(1)+'%'},
        calmar: {name: 'Calmar', fmt: v => v.toFixed(2)},
      }
      const rows = Object.entries(labels).map(([key, meta]) => {
        const p = d.percentiles[key]
        if (!p) return ''
        return `<tr style="border-top:1px solid var(--divider)">
          <td style="padding:8px 10px;font-weight:500">${meta.name}</td>
          <td style="padding:6px 10px;text-align:right;color:#c85a5a">${meta.fmt(p.p5)}</td>
          <td style="padding:6px 10px;text-align:right">${meta.fmt(p.p25)}</td>
          <td style="padding:6px 10px;text-align:right;background:var(--tag-ok-bg);font-weight:600">${meta.fmt(p.p50)}</td>
          <td style="padding:6px 10px;text-align:right">${meta.fmt(p.p75)}</td>
          <td style="padding:6px 10px;text-align:right;color:#2C6B55">${meta.fmt(p.p95)}</td>
          <td style="padding:6px 10px;text-align:right;color:var(--muted)">${p.std.toFixed(3)}</td>
        </tr>`
      }).join('')
      tbody.innerHTML = rows
      note.innerHTML = `✓ ${d.n_success}/${d.n_bootstrap} 次成功 · 窗口 ${d.sub_period_days} 天 · ${d.kronos_excluded ? 'kronos 已剔除(T-0 无历史意义)· ' : ''}⚠ 仍是历史数据 · 未来市场结构可能变`
      wrap.style.display = 'block'
      status.textContent = ''
    } catch (e) {
      status.textContent = '❌ ' + e.message
    } finally {
      btn.disabled = false; btn.innerHTML = '<span class="hi hi-play"></span>跑 100 次'
    }
  })
})()

// ─── C6 · 生成下单 CSV ───
;(function initOrdersPanel() {
  const btn = document.getElementById('btn-gen-orders')
  const status = document.getElementById('ord-status')
  if (!btn) return
  btn.addEventListener('click', async () => {
    const positions = (isReal && Array.isArray(realResult.positions)) ? realResult.positions : []
    if (!positions.length) {
      status.textContent = '⚠ 无持仓数据 · 需先跑回测'
      status.style.color = 'var(--danger)'
      return
    }
    btn.disabled = true; btn.textContent = '生成中…'
    status.textContent = ''
    try {
      const r = await fetch('/api/quant/orders/generate', {
        method: 'POST',
        headers: apiHeaders(),
        body: JSON.stringify({
          positions: positions.map(p => ({code: p.code, weight: p.weight})),
          total_capital: parseFloat(document.getElementById('ord-capital').value) || 100000,
          broker: document.getElementById('ord-broker').value,
          price_type: document.getElementById('ord-pt').value,
        }),
      })
      if (!r.ok) {
        const err = await r.json().catch(() => ({}))
        throw new Error(err.detail || `HTTP ${r.status}`)
      }
      const blob = await r.blob()
      // 从响应头拿 filename
      const cd = r.headers.get('Content-Disposition') || ''
      const m = /filename="([^"]+)"/.exec(cd)
      const filename = m ? m[1] : `orders_${new Date().toISOString().slice(0,10)}.csv`
      const url = URL.createObjectURL(blob)
      const a = document.createElement('a')
      a.href = url; a.download = filename; a.click()
      URL.revokeObjectURL(url)
      status.innerHTML = `✅ CSV 已下载 · <b>${filename}</b> · 请打开券商 App 找"批量委托"导入`
      status.style.color = 'var(--brand-dark)'
    } catch (e) {
      status.textContent = '❌ 生成失败: ' + e.message
      status.style.color = 'var(--danger)'
    } finally {
      btn.disabled = false; btn.innerHTML = '<span class="hi hi-download"></span>下载 CSV'
    }
  })
})()

        <th style="padding:8px 10px;text-align:right;font-weight:600">综合</th>

  const bodyHtml = top15.map(p => {

  }

// 因子贡献 —— **用后端真实返回的 factor_contrib**(「_17」 全量排查)。
//
// 原来这段是编的:超额 = 「metrics.ann_ret - 0.062」(0.062 是写死的基准),
// 再按权重乘一个 「Math.abs(f.ic)/0.05」 的"微扰"分摊下去,最后还
// 硬扣 0.3% 当交易成本。整块没有一个数来自回测。
//
// 后端 score_and_select 每只股都返回 factor_contrib(= sign × z × weight),
// 回测的 positions 里带着。把最后一期所有持仓的贡献按因子汇总,
// 就是**真实的打分构成**。
//
// 注意语义变了:这是「因子对选股打分的贡献」,不是「对超额收益的归因」——
// 后者要有基准。名字和说明都跟着改,不能沿用"超额收益拆解"的说法。
const attribList = document.getElementById('attrib-list')
const positionsForAttrib = realResult?.positions || []
if (attribList && positionsForAttrib.length > 0) {
  const agg = {}
  for (const p of positionsForAttrib) {
    for (const [k, v] of Object.entries(p.factor_contrib || {})) {
      agg[k] = (agg[k] || 0) + v
    }
  }
  const n = positionsForAttrib.length
  const rows = Object.entries(agg)
    .map(([k, sum]) => ({ k, name: (factorByKey(k)?.name || k), avg: sum / n }))
    .sort((a, b) => b.avg - a.avg)
  if (rows.length === 0) {
    attribList.innerHTML = '<div style="color:var(--muted);font-size:11.5px">这次回测没有返回因子贡献数据</div>'
  } else {
    const maxAbs = Math.max(0.01, ...rows.map(r => Math.abs(r.avg)))
    attribList.innerHTML = rows.map(r => `
    <div class="attrib-row">
      <span class="name">${r.name}</span>
      <div class="bar"><div class="fill ${r.avg<0?'neg':''}" style="width:${Math.min(95, Math.abs(r.avg)/maxAbs*80)}%"></div></div>
      <span class="val ${r.avg>=0?'pos':'neg'}">${r.avg>=0?'+':''}${r.avg.toFixed(3)}</span>
    </div>`).join('')
      + `<div style="margin-top:8px;color:var(--muted);font-size:11px">
           数值是 z-score 加权贡献的均值(${n} 只持仓),不是收益率。
         </div>`
  }
} else if (attribList) {
  attribList.innerHTML = '<div style="color:var(--muted);font-size:11.5px">跑一次回测后这里会显示各因子的真实贡献</div>'
}
