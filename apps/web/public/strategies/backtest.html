<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>回测结果 · 猎鹿人 Hunter</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
<script src="app.js"></script>
<script>
const draft = loadDraft()

// 从 localStorage 读真回测结果(workbench "跑回测" 按钮存的)
let realResult = null
try {
  const raw = localStorage.getItem('hunter_backtest_result')
  if (raw) realResult = JSON.parse(raw)
} catch { /* ignore */ }

const isReal = !!realResult

document.body.innerHTML = renderShell(
  'backtest',
  '策略广场 / 回测结果',
  `· ${draft.name || '未命名策略'} · ${isReal ? realResult.start + ' → ' + realResult.end + ' · ✅ 真数据' : '3 年回测 · 2023-08 → 2026-07(mock)'}`,
  `<button class="btn small" id="btn-share">🔗 分享</button>
   <button class="btn small" id="btn-save">💾 保存策略</button>
   <button class="btn small ask-hunter" id="btn-ask">💬 让 Hunter 详细分析</button>`
)

const container = document.getElementById('page-content')

// 优先用真回测数据 · 缺字段用 mock 补齐
const metrics = Object.assign(
  { ann_ret: 0.184, sharpe: 1.42, max_dd: -0.143, ir: 0.98, win_rate: 0.62, turnover: 0.21 },
  draft._metrics || {},
  realResult?.metrics || {},
)

const cfg = draft.config || { universe: 'hs300', top_n: 20, rebalance: 'M', cost_bps: 15, benchmark: '000300' }

try {
container.innerHTML = `
<div class="rp-layout">

  <!-- 参数 meta bar -->
  <div class="meta-bar">
    <span><b>因子</b>${draft.factors.map(k => factorByKey(k)?.name).filter(Boolean).join(' · ')}</span>
    <span class="sep">·</span>
    <span><b>权重</b>${draft.factors.map(k => (draft.weights[k]||0) + '%').join(' · ')}</span>
    <span class="sep">·</span>
    <span><b>股票池</b>${UNIVERSE_NAME[cfg.universe]}</span>
    <span class="sep">·</span>

    <span class="sep">·</span>

    <span class="sep">·</span>

    <span class="sep">·</span>

  </div>

  <!-- 6 指标卡 -->
  <div class="metric-grid">
    <div class="m-card">
      <div class="k">年化收益</div>
      <div class="v pos">${fmtPct(metrics.ann_ret)}</div>
      <div class="sub">基准 +6.2% · 超额 ${fmtPct(metrics.ann_ret - 0.062)}</div>
    </div>
    <div class="m-card">
      <div class="k">夏普比率</div>
      <div class="v ${metrics.sharpe>=1?'pos':''}">${metrics.sharpe.toFixed(2)}</div>
      <div class="sub">${metrics.sharpe>=1.5?'卓越':metrics.sharpe>=1?'优秀':'一般'} · &gt;1 稳定 · &gt;1.5 卓越</div>
    </div>
    <div class="m-card">
      <div class="k">最大回撤</div>
      <div class="v neg">${fmtPct(metrics.max_dd)}</div>
      <div class="sub">2024-Q4 · 基准同期 -21.1%</div>
    </div>
    <div class="m-card">
      <div class="k">信息比率</div>
      <div class="v ${metrics.ir>=0.5?'pos':''}">${metrics.ir.toFixed(2)}</div>

    </div>
    <div class="m-card">

      <div class="v">${(metrics.win_rate*100).toFixed(0)}%</div>

    <div class="m-card">
      <div class="k">平均换手</div>
      <div class="v">${(metrics.turnover*100).toFixed(0)}%</div>

    </div>

  <!-- NAV -->
  <div class="chart-panel">
    <div class="hd">

      <div class="actions">
        <button class="btn small ghost">1M</button>
        <button class="btn small ghost">6M</button>
        <button class="btn small ghost">1Y</button>
        <button class="btn small">3Y</button>
        <button class="btn small ghost">全部</button>
      </div>
    </div>
    <div id="nav-chart" style="width:100%;height:320px"></div>
    <div style="display:flex;gap:20px;margin-top:10px;padding-left:20px;font-size:12px">
      <span style="display:flex;align-items:center;gap:6px"><span style="width:20px;height:3px;background:#b56b2d"></span>策略 · ${draft.name || '当前组合'}</span>
      <span style="display:flex;align-items:center;gap:6px"><span style="width:20px;height:3px;background:#a2a49d"></span>基准 · ${BENCHMARK_NAME[cfg.benchmark]}</span>
      ${isReal ? `<span style="background:#EEF5F1;color:#2C6B55;padding:2px 8px;border-radius:6px;font-size:11">✅ 真回测 · ${realResult.nav_series?.length||0} 期 · ${realResult.duration_ms||0}ms</span>` : ''}
      <span style="margin-left:auto;color:var(--muted)">悬浮曲线看某日详情</span>
    </div>
  </div>

  <!-- 归因 + 持仓 · 两栏 -->
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">

    <!-- 归因 -->
    <div class="chart-panel">
      <div class="hd">
        <div class="title">🎯 因子归因</div>
        <div class="actions">
          <button class="btn small ghost">近 1 月</button>
          <button class="btn small">3 年</button>
        </div>
      </div>
      <div style="color:var(--muted);font-size:11.5px;margin-bottom:12px">
        超额收益 <b style="color:var(--brand-dark);font-family:var(--serif);font-size:14px">${fmtPct(metrics.ann_ret - 0.062)}</b> 拆解到各因子：
      </div>
      <div class="attrib" id="attrib-list"></div>
      <div style="margin-top:12px;padding:10px 12px;background:var(--tag-ok-bg);color:var(--tag-ok-fg);border-radius:8px;font-size:11.5px;line-height:1.6">
        <b>解读</b> · 分散多风格是抗风险关键 · 若单因子失效，其他因子可顶上。
        <span style="color:var(--brand);cursor:pointer;text-decoration:underline" id="btn-ask-explain">让 Hunter 详细解读 →</span>
      </div>
    </div>

    <!-- 持仓变化 -->
    <div class="chart-panel">
      <div class="hd">
        <div class="title">🔄 持仓变化</div>
        <div class="actions">
          <button class="btn small ghost">近 6 次</button>
          <button class="btn small">全部</button>
        </div>
      </div>
      <div class="tl-panel" style="padding:0;border:0;box-shadow:none">
        <div class="tl-item"><div class="date">2026-08-01</div><div class="stocks"><span class="in">+ 山西汾酒 · 陕西煤业</span><br><span class="out">- 隆基绿能 · 通威股份</span><div style="color:var(--muted);font-size:11px;margin-top:4px">换仓 2 只（10%）· 新能源估值/动量双落</div></div></div>
        <div class="tl-item"><div class="date">2026-07-01</div><div class="stocks"><span class="in">+ 迈瑞医疗 · 海尔智家</span><br><span class="out">- 三一重工 · 顺丰控股</span><div style="color:var(--muted);font-size:11px;margin-top:4px">换仓 2 只 · 医疗动量修复</div></div></div>
        <div class="tl-item"><div class="date">2026-06-01</div><div class="stocks"><span class="in">+ 中国平安 · 农业银行</span><br><span class="out">- 中远海控 · 万科A</span><div style="color:var(--muted);font-size:11px;margin-top:4px">换仓 2 只 · 金融 ROE 修复</div></div></div>
        <div class="tl-item"><div class="date">2026-05-01</div><div class="stocks"><span style="color:var(--muted)">当月无变化 · 持仓稳定</span></div></div>
        <div style="text-align:center;padding:10px 0;color:var(--brand);font-size:12px;cursor:pointer">
          展开全部 36 次调仓 →
        </div>
      </div>
    </div>
  </div>

  <!-- 底部 CTA -->
  <div class="chart-panel" style="background:linear-gradient(180deg,#fff9f0 0%,#fff 100%);border-color:#e8dcc4;display:flex;align-items:center;gap:16px;padding:20px 22px">
    <div style="flex:1">
      <div style="font-family:var(--serif);font-size:15px;font-weight:600;color:var(--brand-dark)">
        想追踪这个策略每天的 top 20？
      </div>
      <div style="color:var(--muted);font-size:12px;margin-top:4px">
        每交易日 15:30 收盘后自动推送持仓变动 · 支持 WeChat / 飞书群机器人
      </div>
    </div>
    <button class="btn ask-hunter" id="btn-ask-2">💬 问 Hunter</button>
    <button class="btn primary" id="btn-subscribe">🔔 订阅每日推送</button>
  </div>

  <!-- 相似策略 -->
  <div class="chart-panel">
    <div class="hd">
      <div class="title">💡 你可能还会喜欢</div>
      <div class="actions"><button class="btn small ghost">仅看官方</button></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px" id="similar-strategies"></div>
  </div>

  <div style="text-align:center;color:var(--soft);font-size:11px;margin-top:8px">
    回测数据来自 finance-data.agentpit.io · 复权 · 剔除 ST/停牌/新股。
    <b style="color:var(--muted)">历史表现不代表未来收益</b> · 单一策略不构成投资建议 · 请结合自身风险承受能力决策。
  </div>
</div>
`
} catch (err) {
  console.error('[backtest] 渲染失败:', err)
  container.innerHTML = `
    <div class="empty" style="padding:80px 20px">
      <div class="ic">⚠</div>
      <div class="msg">回测结果加载失败</div>
      <div style="color:var(--muted);font-size:12px;max-width:520px;margin:0 auto 20px;line-height:1.65">
        错误: <code style="background:var(--panel-2);padding:2px 6px;border-radius:4px;color:var(--danger)">${(err.message || err).toString().slice(0, 200)}</code><br>
        请先从<a href="/strategies/index.html" style="color:var(--brand)">策略广场</a>选一条策略,或在<a href="/strategies/workbench.html" style="color:var(--brand)">工作台</a>搭建后再回来。
      </div>
      <a href="/strategies/index.html" class="btn primary">返回策略广场</a>
    </div>`
  throw err
}

// B3 · echarts NAV 曲线 · 用真 nav_series
(function initNavChart() {
  const el = document.getElementById('nav-chart')
  if (!el || !window.echarts) return
  const chart = echarts.init(el)

  // 真回测 · 用 realResult.nav_series [{date, nav}, ...]
  // 无真数据兜底:mock 36 期
  let dates, navs
  if (isReal && realResult.nav_series?.length) {
    dates = realResult.nav_series.map(p => p.date)
    navs  = realResult.nav_series.map(p => p.nav)
  } else {
    dates = Array.from({length: 36}, (_, i) => `2023-${String((i%12)+1).padStart(2,'0')}`)
    navs  = [1, 1.01, 1.03, 1.02, 1.06, 1.11, 1.09, 1.07, 1.13, 1.19, 1.16, 1.14,
             1.20, 1.28, 1.25, 1.22, 1.30, 1.36, 1.32, 1.29, 1.36, 1.42, 1.40, 1.38,
             1.46, 1.51, 1.48, 1.45, 1.53, 1.58, 1.55, 1.52, 1.59, 1.63, 1.66, 1.66]
  }

  // 基准 hs300 · 简版 · 后续接真 benchmark
  const bench = navs.map((_, i) => 1 + i * 0.005)

  chart.setOption({
    grid: {left: 55, right: 30, top: 25, bottom: 40},
    tooltip: {trigger: 'axis', formatter: p => {
      const s = p.find(x=>x.seriesName==='策略')
      const b = p.find(x=>x.seriesName==='基准')
      return `<b>${p[0].axisValue}</b><br>策略: <b>${(s?.value||1).toFixed(4)}</b><br>基准: ${(b?.value||1).toFixed(4)}`
    }},
    legend: {data: ['策略','基准'], right: 10, top: 5},
    xAxis: {type: 'category', data: dates, axisLabel: {fontSize: 10, color: '#a2a49d'},
            axisLine: {lineStyle: {color: '#deddd5'}}},
    yAxis: {type: 'value', scale: true, axisLabel: {fontSize: 10, color: '#a2a49d',
            formatter: v => v.toFixed(2)}, splitLine: {lineStyle: {color: '#efeee8'}}},
    series: [
      {name: '策略', type: 'line', data: navs, smooth: true,
       lineStyle: {color: '#b56b2d', width: 2.4},
       itemStyle: {color: '#b56b2d'},
       areaStyle: {color: 'rgba(181,107,45,0.06)'},
       symbol: 'none'},
      {name: '基准', type: 'line', data: bench, smooth: true,
       lineStyle: {color: '#a2a49d', width: 1.6, type: 'dashed'},
       itemStyle: {color: '#a2a49d'},
       symbol: 'none'},
    ],
  })
  window.addEventListener('resize', () => chart.resize())
})()

// 归因：按因子权重比例分配超额收益
const attribList = document.getElementById('attrib-list')
const excess = metrics.ann_ret - 0.062
if (draft.factors.length > 0) {
  const totalW = draft.factors.reduce((a,k) => a + (draft.weights[k]||0), 0) || 1
  // 每因子贡献 ≈ (自身IC/平均IC) * 自身权重 * 超额，简化为按权重 + 微扰
  const contribs = draft.factors.map((k,i) => {
    const f = factorByKey(k)
    const share = (draft.weights[k]||0) / totalW
    // 加权因子的 IC 相对权重（相对到 factor 平均 0.05）作为微扰
    const boost = Math.max(0.6, Math.min(1.4, Math.abs(f.ic) / 0.05))
    return { k, name: f.name, w: draft.weights[k]||0, contrib: excess * share * boost }
  })
  // 归一到总超额（含成本）
  const sumC = contribs.reduce((a,c)=>a+c.contrib, 0) || 1
  const scale = (excess - 0.003) / sumC  // 留 0.3% 给交易成本
  contribs.forEach(c => c.contrib *= scale)
  const maxAbs = Math.max(0.02, ...contribs.map(c => Math.abs(c.contrib)))
  contribs.sort((a,b) => b.contrib - a.contrib)

  attribList.innerHTML = contribs.map(c => `
    <div class="attrib-row">
      <span class="name">${c.name} (${c.w}%)</span>
      <div class="bar"><div class="fill ${c.contrib<0?'neg':''}" style="width:${Math.min(95, Math.abs(c.contrib)/maxAbs*80)}%"></div></div>
      <span class="val ${c.contrib>=0?'pos':'neg'}">${fmtPct(c.contrib)}</span>
    </div>
  `).join('') + `
    <div class="attrib-row">
      <span class="name" style="color:var(--muted)">交易成本</span>
      <div class="bar"><div class="fill neg" style="width:6%"></div></div>
      <span class="val neg">-0.3%</span>
    </div>
  `
}

// 相似策略推荐：随机取 3 个官方（排除当前）
const currentName = draft.name
const similar = OFFICIAL_STRATEGIES.filter(s => s.name !== currentName).slice(0, 3)
document.getElementById('similar-strategies').innerHTML = similar.map((s,i) => `
  <div class="s-card" data-id="${s.id}">
    <div class="row1">
      <div class="icon">${s.icon}</div>
      <div class="name" style="font-size:14px">${s.name}</div>
      <span class="chip solid" style="background:var(--brand);color:#fff;font-size:10px">官方</span>
    </div>
    <div class="desc">${s.desc} · 与你相似度 ${[87,62,54][i]||50}%</div>
    <div class="stats">
      <div><div class="k">年化</div><div class="v pos">${fmtPct(s.metrics.ann_ret)}</div></div>
      <div><div class="k">夏普</div><div class="v">${s.metrics.sharpe.toFixed(2)}</div></div>
      <div><div class="k">回撤</div><div class="v neg">${fmtPct(s.metrics.max_dd)}</div></div>
    </div>
  </div>
`).join('')

document.querySelectorAll('#similar-strategies .s-card').forEach(card => {
  card.addEventListener('click', () => {
    const s = OFFICIAL_STRATEGIES.find(x => x.id === card.dataset.id)
    if (!s) return
    saveDraft({
      factors: s.factors.map(f=>f.key),
      weights: Object.fromEntries(s.factors.map(f=>[f.key,f.w])),
      config: s.config, name: s.name, _metrics: s.metrics, updated_at: Date.now(),
    })
    location.reload()
  })
})

// 按钮绑定
document.getElementById('btn-ask').addEventListener('click', askHunterFromBacktest)
document.getElementById('btn-ask-2').addEventListener('click', askHunterFromBacktest)
document.getElementById('btn-ask-explain').addEventListener('click', askHunterFromBacktest)
document.getElementById('btn-save').addEventListener('click', () => openSaveDialog())
document.getElementById('btn-share').addEventListener('click', shareCurrentUrl)
document.getElementById('btn-subscribe').addEventListener('click', openSubscribeDialog)
</script>
</body>
</html>
