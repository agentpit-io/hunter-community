let draft = loadDraft()
const container = document.getElementById('page-content')

// 回测区间的**唯一真值来源**。按钮文案、下方标签、真正发出去的请求
// 三处必须同源 —— 之前它们各写各的,于是按钮说 3 年、标签说 2023-08 起、
// 请求发的是 8 个月,而用户没有任何办法看出来。
const BACKTEST_MONTHS = 8
function backtestRange() {
  const end = new Date(); end.setDate(15)
  const start = new Date(end); start.setMonth(end.getMonth() - BACKTEST_MONTHS)
  const fmt = d => d.toISOString().slice(0, 10)
  return { start, end, fmt }
}
function renderBacktestRange() {
  const el = document.getElementById('bt-range')
  if (!el) return
  const { start, end, fmt } = backtestRange()
  el.textContent = `回测区间 ${fmt(start)} → ${fmt(end)} · 结果页可改`
}

function renderLeftPanel() {
  const factorsHtml = draft.factors.length === 0 ? `
    <div class="empty" style="padding:30px 20px">
      <div class="ic">🎯</div>
      <div class="msg" style="font-size:13px">还没选因子</div>
      <a href="/strategies/factors.html" class="btn small"><span class="hi hi-arrow-r"></span>去因子广场</a>
    </div>
  ` : draft.factors.map(k => {
    const f = factorByKey(k)
    const w = draft.weights[k] || 0
    return `
      <div class="f-pill" data-key="${k}" style="flex-direction:column;align-items:stretch;gap:0;padding:0">
        <div style="display:flex;align-items:center;gap:8px;padding:10px 10px 4px">
          <span style="font-size:14px">${f.icon}</span>
          <span class="name">${f.name}</span>
          <span class="weight" data-w="${k}">${w}%</span>
          <span class="close" data-del="${k}">×</span>
        </div>
        <div class="slider-row" style="padding:0 10px 8px">
          <input type="range" min="0" max="100" value="${w}" data-slider="${k}" />
        </div>
      </div>
    `
  }).join('')

  return `
    <div class="panel">
      <div class="p-hd">🎯 选因子与权重 <span class="cnt">已选 ${draft.factors.length}</span></div>
      <div id="factor-pills">${factorsHtml}</div>
      <a href="/strategies/factors.html" class="btn" style="width:100%;margin-top:10px">+ 从因子广场加因子</a>
      <div style="margin-top:14px;padding:10px 12px;background:var(--tag-cool-bg);color:var(--tag-cool-fg);border-radius:8px;font-size:11.5px;line-height:1.6">
        <b><span class="hi hi-lightbulb" style="color:var(--brand);vertical-align:-.18em"></span> tip</b> · 权重和不必等于 100%，系统会归一化。<br>
        <b>价值 40% + 质量 30% + 动量 20% + 低波 10%</b> = Barra 四因子经典配比
      </div>
    </div>
  `
}

// ─── 回测结果就地渲染 ────────────────────────────────────
//
// 产品经理:「回测结果显示在下方,不要跳转页面了」。
//
// 原来跑完 location.href 换页,用户被甩到 backtest.html;想改个权重
// 再跑一次,得先点回来。**配参数和看结果本来是同一个动作的两半**,
// 拆成两页等于每次迭代都要来回跳。
//
// 这里只放"看一眼就知道行不行"的部分:六个核心指标 + 毛净成本对比
// + 净值曲线。完整报告(因子分档验证 / Bootstrap / 逐笔明细 / 下单 CSV)
// 还在 backtest.html —— 那些是"决定要用这个策略之后"才看的东西,
// 全搬过来会把工作台撑成第二个报告页,反而失去了"边调边看"的意义。
function renderInlineResult(d, draft) {
  const box = document.getElementById('bt-inline')
  if (!box) return
  // 结果仍然写 localStorage —— 「查看完整报告」那一步靠它。
  //
  // ⚠️ 顺序:**先 draft 后 result**,而且 draft 用 setItem 不用 saveDraft()。
  // saveDraft() 里有「配置变了就清掉旧回测结果」的逻辑(问题12 的修复),
  // 走它的话会把这次刚跑出来的结果自己清掉 —— 用户点「查看完整报告」
  // 会看到"这个策略还没跑过回测",而他一分钟前刚跑完。
  //
  // 这里的场景恰恰相反:draft 和 result 是同一次运行的一对,天然一致。
  //
  // 另:键名是 hunter_strategy_draft(app.js 的 LS_DRAFT)。
  // 原代码写的 hunter_backtest_draft **从来没人读过**,是个死键。
  try {
    localStorage.setItem('hunter_strategy_draft', JSON.stringify(draft))
    localStorage.setItem('hunter_backtest_result', JSON.stringify(d))
  } catch {}

  const m = d.metrics || {}
  const tc = d.trading_cost || {}
  const ns = d.nav_series || []
  const q  = d.quality || {}

  const num = (v, suffix = '', digits = 2) =>
    (v === null || v === undefined || Number.isNaN(v)) ? '—' : Number(v).toFixed(digits) + suffix
  const cell = (label, val, note) => `
    <div style="flex:1 1 120px;padding:10px 12px;border:1px solid var(--divider);border-radius:10px;background:var(--card)">
      <div style="font-size:11px;color:var(--muted)">${label}</div>
      <div style="font-size:18px;font-weight:700;margin-top:2px">${val}</div>
      ${note ? `<div style="font-size:10.5px;color:var(--muted);margin-top:2px">${note}</div>` : ''}
    </div>`

  box.style.display = 'block'
  box.innerHTML = `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
      <span class="hi hi-chart" style="color:var(--brand)"></span>
      <b style="font-size:13.5px">回测结果</b>
      <span style="font-size:11px;color:var(--muted)">
        ${d.start || ''} → ${d.end || ''} · ${ns.length} 期${d.cached ? ' · 缓存' : ''}
      </span>
      <a href="/strategies/backtest.html" style="margin-left:auto;font-size:12px;color:var(--brand)">
        查看完整报告 →</a>
    </div>

    ${(q.notes && q.notes.length) ? `
      <div style="padding:8px 11px;margin-bottom:10px;border:1px solid #E3C89A;background:#FDF8EE;
                  border-radius:8px;font-size:11.5px;color:#8A5A1B;line-height:1.8">
        <b>这次回测的成色</b><br>${q.notes.map(x => '· ' + x).join('<br>')}
      </div>` : ''}

    <div style="display:flex;flex-wrap:wrap;gap:8px">
      ${cell('年化收益', num(m.annual_return_pct, '%'))}
      ${cell('夏普比率', num(m.sharpe, '', 2))}
      ${cell('最大回撤', num(m.max_drawdown_pct, '%'))}
      ${cell('月度胜率', num(m.win_rate_pct, '%'))}
      ${cell('平均换手', num(m.turnover_pct, '%'))}
    </div>

    ${tc.gross_total_return_pct !== undefined ? `
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">
        ${cell('毛收益', num(tc.gross_total_return_pct, '%'), '不扣手续费/税/滑点')}
        ${cell('净收益', num(tc.net_total_return_pct, '%'), '这是实盘能拿到的')}
        ${cell('成本吃掉', num(tc.cost_ratio_of_gross_pct, '%'), `${tc.cost_bps_used || 0} bps 单边`)}
      </div>` : ''}

    <div id="bt-inline-chart" style="height:220px;margin-top:12px"></div>
  `

  // 净值曲线 —— echarts 已经在页面里(app.js 引的)
  const el = document.getElementById('bt-inline-chart')
  if (el && window.echarts && ns.length) {
    const chart = echarts.init(el)
    chart.setOption({
      grid: { left: 48, right: 16, top: 16, bottom: 28 },
      tooltip: { trigger: 'axis' },
      xAxis: { type: 'category', data: ns.map(p => p.date),
               axisLabel: { fontSize: 10, color: '#a2a49d' } },
      yAxis: { type: 'value', scale: true,
               axisLabel: { fontSize: 10, color: '#a2a49d', formatter: v => v.toFixed(2) },
               splitLine: { lineStyle: { color: '#efeee8' } } },
      series: [{
        name: '净值', type: 'line', smooth: true, symbol: 'none',
        data: ns.map(p => p.nav),
        lineStyle: { color: '#b56b2d', width: 2.2 },
        areaStyle: { color: 'rgba(181,107,45,0.06)' },
      }],
    })
    window.addEventListener('resize', () => chart.resize())
  }

  box.scrollIntoView({ behavior: 'smooth', block: 'nearest' })
}

function renderRightPanel() {
  return `
    <div class="panel" style="padding:0;overflow:hidden">
      <div style="padding:16px 18px 12px;border-bottom:1px solid var(--line)">
        <div class="p-hd" style="margin-bottom:6px"><span class="hi hi-target" style="color:var(--brand)"></span> 今日 Top <span id="topn-cnt">${draft.config.top_n||20}</span> <span class="cnt" id="topn-date">加载中...</span></div>

      </div>
      <div id="picks-body" style="max-height:calc(100vh - 240px);overflow-y:auto;padding:16px 18px;color:var(--muted);font-size:12px">

// 从 API 拉真 picks
async function refreshPicks() {
  const body = document.getElementById('picks-body')
  if (!body) return
  const factors = draft.factors.map(k => ({ key: k, weight_pct: draft.weights[k] || 0 }))
                                .filter(f => f.weight_pct > 0)
  if (factors.length === 0) {
    body.innerHTML = '<div style="padding:20px;text-align:center;color:var(--muted)">先在左侧选几个因子</div>'
    return
  }
  body.innerHTML = '<div style="padding:20px;text-align:center;color:var(--muted)">拉取中...</div>'
  try {
    const r = await fetch('/api/quant/scan', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ factors, config: { universe: draft.config.universe||'hs300', top_n: draft.config.top_n||20 } })
    })
    const d = await r.json()
    const picks = d.picks || []
    document.getElementById('topn-date').textContent = d.trade_date
    document.getElementById('topn-cnt').textContent = picks.length
    if (picks.length === 0) {
      // 原来一律显示"无匹配 · 检查后端 factor_value 表" —— 那是给开发看的,
      // 而且三种完全不同的原因(池子不支持 / 自选是空的 / 因子没数据)
      // 显示同一句话,用户没法知道自己该做什么。后端现在会给出 reason。
      const why = d.reason || '无匹配 · 可能因子还没算完'
      body.innerHTML = `<div style="padding:20px 16px;text-align:center;color:var(--muted);line-height:1.7">${why}</div>`
      return
    }
    const gapHtml = d.gap_note
      ? `<div style="padding:8px 12px;margin-bottom:6px;background:#FDF3E7;color:#8A5A1B;border-radius:6px;font-size:11.5px;line-height:1.6">${d.gap_note}</div>`
      : ''
    body.innerHTML = gapHtml + `<table class="holdings-table">
      <thead><tr><th class="rk">#</th><th>股票</th><th class="num">综合分</th></tr></thead>
      <tbody>${picks.map((p, i) => `
        <tr><td class="rk">${i+1}</td>
            <td><b>${p.name || p.code}</b><div class="cd">${p.code} · A 股</div></td>
            <td class="num score">${p.score.toFixed(3)}</td>
        </tr>`).join('')}</tbody>
    </table>`
  } catch (e) {
    body.innerHTML = `<div style="padding:20px;color:var(--dn)">拉取失败:${e.message||e}</div>`
  }
}

container.innerHTML = `
<div class="wb-layout">
  <div id="left-col">${renderLeftPanel()}</div>
  <div id="mid-col">${renderMiddlePanel()}</div>
  <div id="right-col">${renderRightPanel()}</div>
</div>

<!-- E-3 · 因子相关性热力图 · 全宽面板 -->
<div class="chart-panel" id="corr-panel" style="display:none;margin:12px 20px">
  <div class="hd">
    <div class="title"><span class="hi hi-link" style="color:var(--brand)"></span> 因子相关性 · 热力图(Pearson)</div>
    <div class="actions">
      <select id="corr-method" class="btn small" style="border:1px solid var(--divider);background:var(--bg)">
        <option value="pearson">Pearson · 线性</option>
        <option value="spearman">Spearman · 秩相关</option>

    </div>
  </div>
  <div style="color:var(--muted);font-size:11.5px;margin-bottom:8px">
    |r| > 0.7 → 高相关 · 建议移除一个 · 权重会被稀释成"综合因子"
  </div>
  <div id="corr-chart" style="width:100%;height:320px"></div>
  <div id="corr-warning" style="margin-top:8px;font-size:12px;padding:8px 10px;border-radius:6px"></div>
</div>
`

function bindLeft() {
  // slider 实时更新
  document.querySelectorAll('input[data-slider]').forEach(sl => {
    sl.addEventListener('input', e => {
      const k = sl.dataset.slider
      draft.weights[k] = parseInt(sl.value, 10)
      document.querySelector(`[data-w="${k}"]`).textContent = sl.value + '%'
      saveDraft(draft)
    })
  })
  // 删除
  document.querySelectorAll('[data-del]').forEach(x => {
    x.addEventListener('click', e => {
      const k = x.dataset.del
      draft.factors = draft.factors.filter(f => f !== k)
      delete draft.weights[k]
      saveDraft(draft)
      document.getElementById('left-col').innerHTML = renderLeftPanel()
      bindLeft()
    })
  })
}
bindLeft()

// 配置 select
document.querySelectorAll('select[data-cfg]').forEach(sel => {
  sel.addEventListener('change', e => {
    const key = sel.dataset.cfg
    let val = sel.value
    if (key === 'top_n' || key === 'cost_bps') val = parseInt(val, 10)
    draft.config[key] = val
    saveDraft(draft)
    toast(`已切换 · ${sel.options[sel.selectedIndex].text}`)
  })
})

// 顶部 · 问 Hunter
document.getElementById('btn-ask').addEventListener('click', askHunterFromWorkbench)
document.getElementById('btn-ask-2').addEventListener('click', askHunterFromWorkbench)

// 顶部 · 保存
document.getElementById('btn-save').addEventListener('click', () => openSaveDialog())

// D-4 · 跑回测 · 异步任务 · task_id 轮询 · 前端可看到"计算中"进度
renderBacktestRange()

// 首次初始化进度。
//
// 新装的实例库是空的,后端启动时会自动跑一遍(拉成分股/K线/算因子),
// 实测十几到几十分钟。期间用户打开这个页面看到的是空股票池 +
// "选不出股票" —— 而他完全不知道在等什么、要等多久。
;(async function pollInit() {
  const bar = document.createElement('div')
  bar.style.cssText = 'display:none;margin:10px 20px;padding:10px 14px;background:#FDF3E7;'
    + 'color:#8A5A1B;border-radius:8px;font-size:12.5px;line-height:1.7'
  container.parentNode.insertBefore(bar, container)
  const STEPS = 4
  for (;;) {
    let d
    try {
      d = await fetch('/api/quant/init-status', { cache: 'no-store' }).then(r => r.json())
    } catch (e) { await new Promise(r => setTimeout(r, 5000)); continue }

    if (d.running) {
      const pct = Math.round((d.steps_done / STEPS) * 100)
      bar.style.display = 'block'
      bar.innerHTML = `<b>首次初始化中…</b> ${d.step || ''} `
        + `(${d.steps_done}/${STEPS})${d.detail ? ' · ' + d.detail : ''}`
        + `<div style="margin-top:6px;height:5px;background:#EFE3D2;border-radius:3px;overflow:hidden">`
        + `<div style="height:100%;width:${pct}%;background:#C97A2B;transition:width .4s"></div></div>`
        + `<div style="margin-top:5px;opacity:.8">已用 ${d.elapsed_sec || 0} 秒 · `
        + `完成前选股和回测都会是空的</div>`
      await new Promise(r => setTimeout(r, 3000))
      continue
    }
    if (d.error) {
      bar.style.display = 'block'
      bar.innerHTML = `<b>初始化失败:</b>${d.error}`
      return
    }
    // 跑完了才提示刷新 —— 没跑过(needs_init=false 且没 started)不打扰
    if (d.done) {
      bar.style.display = 'block'
      bar.innerHTML = '<b>初始化完成</b> · 刷新页面即可开始选股和回测'
    } else {
      bar.style.display = 'none'
    }
    return
  }
})()

document.getElementById('btn-backtest').addEventListener('click', async () => {
  if (draft.factors.length === 0) { toast('先选几个因子', 'warn'); return }
  const btn = document.getElementById('btn-backtest')
  btn.classList.add('loading')
  btn.textContent = '⏳ 提交回测...'
  const factors = draft.factors.map(k => ({ key: k, weight_pct: draft.weights[k] || 0 }))
                                .filter(f => f.weight_pct > 0)
  try {
    const { start, end, fmt } = backtestRange()
    const submitR = await fetch('/api/quant/backtest/run', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        factors, config: draft.config,
        start: fmt(start), end: fmt(end),
      })
    })
    const submitD = await submitR.json()
    if (submitD.error) throw new Error(submitD.message || submitD.error)

    // cache 命中 · 直接跳
    if (submitD.cached) {
      renderInlineResult(submitD, draft)
      btn.classList.remove('loading')
      btn.innerHTML = '<span class="hi hi-play"></span>重新跑回测'
      return
    }

    // 异步 · 轮询 status
    const taskId = submitD.task_id
    btn.textContent = '⏳ 排队中...'
    let d
    const maxRounds = 120   // 最长 3 分钟(1.5s × 120)
    for (let i = 0; i < maxRounds; i++) {
      await new Promise(r => setTimeout(r, 1500))
      const s = await fetch(`/api/quant/backtest/status/${taskId}`).then(r => r.json())
      if (s.status === 'running') btn.textContent = '⏳ 计算中...'
      else if (s.status === 'queued') btn.textContent = '⏳ 排队中...'
      else if (s.status === 'error') {
        // 「一只票都没选出来」是最常见的失败,而只说这一句用户不知道该改什么。
        // 后端把逐因子的数据诊断也传上来了,这里必须展开 —— 否则用户
        // 只能怀疑是自己的权重配错了,而真正的原因是因子压根没算过
        const bad = (s.factors || []).filter(f => !f.ok)
        if (bad.length) {
          const NL = String.fromCharCode(10)
          const lines = bad.map(f => `· ${f.name}:${f.why}`).join(NL)
          throw new Error((s.message || '选不出股票') + NL + NL + lines)
        }
        throw new Error(s.message || s.error || '未知错误')
      }
      else if (s.status === 'done') { d = s.result; break }
      else if (s.status === 'not_found') throw new Error('任务丢失 · 请重试')
    }
    if (!d) throw new Error('超时(3 分钟)· 请重试或缩短回测范围')

    renderInlineResult(d, draft)
    btn.classList.remove('loading')
    btn.innerHTML = '<span class="hi hi-play"></span>重新跑回测'
  } catch (e) {
    toast('回测失败: ' + e.message, 'warn')
    btn.classList.remove('loading'); btn.innerHTML = '<span class="hi hi-play"></span>跑 8 个月回测'
  }
})

// 刷新 Top N · 挂事件 · 首次自动跑
document.getElementById('btn-refresh-picks').addEventListener('click', refreshPicks)
refreshPicks()   // 页面打开自动拉一次

// ─── E-3 · 相关性热力图 · 因子变动时自动刷新 ───
let _corrChart = null
async function refreshCorrelation() {
  const panel = document.getElementById('corr-panel')
  if (!panel) return
  if (draft.factors.length < 2) { panel.style.display = 'none'; return }
  const method = document.getElementById('corr-method').value
  try {
    const r = await fetch('/api/quant/factors/correlation', {
      method: 'POST', headers: apiHeaders(),
      body: JSON.stringify({factor_keys: draft.factors, universe: draft.config.universe, method}),
    })
    const d = await r.json()
    if (d.error) {
      panel.style.display = 'block'
      document.getElementById('corr-chart').innerHTML =
        `<div style="color:var(--muted);padding:60px 0;text-align:center">数据不足(仅 ${d.n_common||0} 只共同覆盖)</div>`
      document.getElementById('corr-warning').innerHTML = ''
      return
    }
    panel.style.display = 'block'
    if (!_corrChart) _corrChart = echarts.init(document.getElementById('corr-chart'))
    const labels = d.factors.map(k => (factorByKey(k)||{name:k}).name)
    const data = []
    d.factors.forEach((_, i) => d.factors.forEach((_, j) => data.push([j, i, d.matrix[i][j]])))
    _corrChart.setOption({
      tooltip: {position: 'top', formatter: p => `${labels[p.value[1]]} × ${labels[p.value[0]]}: <b>${p.value[2].toFixed(3)}</b>`},
      grid: {left: 110, right: 30, top: 20, bottom: 80},
      xAxis: {type: 'category', data: labels, axisLabel: {rotate: 30, fontSize: 10, color: '#7c7a72'},
              axisTick: {show: false}, splitArea: {show: true}},
      yAxis: {type: 'category', data: labels, axisLabel: {fontSize: 10, color: '#7c7a72'},
              axisTick: {show: false}, splitArea: {show: true}},
      visualMap: {min: -1, max: 1, calculable: true, orient: 'horizontal', left: 'center', bottom: 5,
                  inRange: {color: ['#c85a5a', '#f5f5f5', '#4a8f5c']}},
      series: [{
        type: 'heatmap', data,
        label: {show: true, formatter: p => p.value[2].toFixed(2), fontSize: 10},
      }],
    })
    _corrChart.resize()
    // 高相关警告
    const w = document.getElementById('corr-warning')
    if (d.high_pairs && d.high_pairs.length) {
      const pairs = d.high_pairs.map(p => `${(factorByKey(p.a)||{name:p.a}).name} ⇔ ${(factorByKey(p.b)||{name:p.b}).name} = ${p.corr.toFixed(2)}`).join(' · ')
      w.style.background = 'var(--tag-warn-bg)'; w.style.color = 'var(--tag-warn-fg)'
      w.innerHTML = `⚠ 高相关(>0.7):${pairs} · 建议保留其一 · 权重合并`
    } else {
      w.style.background = 'var(--tag-ok-bg)'; w.style.color = 'var(--tag-ok-fg)'
      w.innerHTML = `✓ 因子分散良好 · 无高相关对 · 覆盖 ${d.n_codes} 只 hs300`
    }
  } catch (e) {
    console.warn('[corr] fetch failed', e)
  }
}
// 因子变动 hook · 每次修 draft 后调
const _origSaveDraft = window.saveDraft || saveDraft
window.saveDraft = function(d) {
  _origSaveDraft.call(this, d)
  if (d.factors && d.factors.length >= 2) refreshCorrelation()
}
// method 切换
document.getElementById('corr-method')?.addEventListener('change', refreshCorrelation)
// 初次
refreshCorrelation()

// 导出 CSV · 从当前 picks-body 表格里拿
document.getElementById('btn-export').addEventListener('click', () => {
  const trs = document.querySelectorAll('#picks-body tbody tr')
  if (trs.length === 0) { toast('先刷新 Top N', 'warn'); return }
  const rows = ['rank,code,score']
  trs.forEach(tr => {
    const cells = tr.querySelectorAll('td')
    rows.push(`${cells[0].textContent},${cells[1].querySelector('b')?.textContent||''},${cells[2].textContent}`)
  })
  const blob = new Blob([rows.join('\n')], { type: 'text/csv;charset=utf-8' })
  const a = document.createElement('a')
  a.href = URL.createObjectURL(blob)
  a.download = `hunter_top_${new Date().toISOString().slice(0,10)}.csv`
  a.click()
  toast('✓ 已导出 CSV', 'success')
})
</script>
