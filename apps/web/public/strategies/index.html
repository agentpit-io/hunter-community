<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>策略广场 · 猎鹿人 Hunter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<script src="app.js"></script>
<script>
document.body.innerHTML = renderShell('marketplace', '策略广场', '发现好策略 · 一键跟随 · 或自己搭一个', `
  <a href="/strategies/factors.html" class="btn small">📚 因子广场</a>
  <a href="/strategies/workbench.html" class="btn small primary">+ 新建策略</a>
`)

const container = document.getElementById('page-content')

// 官方精选 · 先用 mock 兜底 · 然后 fetch API 用真数据覆盖
async function fetchOfficialFromApi() {
  try {
    const r = await fetch('/api/quant/strategies/official', { cache: 'no-store' })
    if (!r.ok) return null
    const d = await r.json()
    return d.strategies || []
  } catch { return null }
}

function renderOfficialCards(strategies, isReal) {
  return strategies.map(s => {
    // API 返 {id, name, description, factors: [{key,weight_pct}], config}
    // mock 返 {id, icon, name, desc, factors: [{key,w}], metrics: {ann_ret,sharpe,max_dd}}
    const isFromApi = 'weight_pct' in (s.factors?.[0] || {})
    const displayFactors = isFromApi
      ? s.factors.slice(0,4).map(f => `<span>${(FACTORS.find(x=>x.key===f.key)?.name)||f.key} ${f.weight_pct}%</span>`).join('')
      : s.factors.slice(0,4).map(f => `<span>${factorByKey(f.key).name} ${f.w}%</span>`).join('')
    const statsHtml = isFromApi
      ? `<div><div class="k">API</div><div class="v pos">✅ 真数据</div></div>
         <div><div class="k">因子数</div><div class="v">${s.factors.length}</div></div>
         <div><div class="k">股票池</div><div class="v">${(s.config?.universe||'-').toUpperCase()}</div></div>`
      : `<div><div class="k">年化*</div><div class="v pos">${fmtPct(s.metrics.ann_ret)}</div></div>
         <div><div class="k">夏普*</div><div class="v">${s.metrics.sharpe.toFixed(2)}</div></div>
         <div><div class="k">最大回撤*</div><div class="v neg">${fmtPct(s.metrics.max_dd)}</div></div>`
    return `
      <div class="s-card" data-id="${s.id}" ${isFromApi?'data-from-api="1"':''}>
        <div class="row1">
          <div class="icon">${s.icon || '⭐'}</div>
          <div class="name">${s.name}</div>
          <span class="chip solid" style="background:var(--brand);color:#fff">${isReal?'✅ 官方 · API':'官方精选'}</span>
        </div>
        <div class="desc">${s.description || s.desc || ''}</div>
        <div class="factors">${displayFactors}</div>
        <div class="stats">${statsHtml}</div>
      </div>
    `
  }).join('')
}

// 先渲 mock · 再异步用真数据覆盖
const officialHtml = renderOfficialCards(OFFICIAL_STRATEGIES, false)

// 我的策略
const mine = loadMine()
const mineHtml = mine.length === 0 ? `
  <div class="empty">
    <div class="ic">🧩</div>
    <div class="msg">还没有保存的策略</div>
    <a href="/strategies/factors.html" class="btn primary">→ 去挑因子搭一个</a>
  </div>
` : `
  <div class="strategy-grid">
    ${mine.map(m => `
      <div class="s-card" data-id="${m.id}" data-mine="1">
        <div class="row1">
          <div class="icon" style="background:var(--panel);color:var(--muted)">✎</div>
          <div class="name">${m.name}</div>
          <span class="chip" style="background:var(--panel-2);color:var(--muted)">我的</span>
        </div>
        <div class="desc">${draftFactorNames({factors:m.factors})}</div>
        <div class="factors">
          ${m.factors.slice(0,4).map(k => `<span>${factorByKey(k).name} ${m.weights[k]||0}%</span>`).join('')}
        </div>
        <div class="stats">
          <div><div class="k">年化*</div><div class="v pos">${fmtPct(m.metrics_mock.ann_ret)}</div></div>
          <div><div class="k">夏普*</div><div class="v">${m.metrics_mock.sharpe.toFixed(2)}</div></div>
          <div><div class="k">最大回撤*</div><div class="v neg">${fmtPct(m.metrics_mock.max_dd)}</div></div>
        </div>
      </div>
    `).join('')}
  </div>
`

container.innerHTML = `
<div style="padding:24px 26px 40px;max-width:1240px;margin:0 auto">

  <!-- 顶部说明条 -->
  <div class="meta-bar" style="margin-bottom:24px">
    <span>👋 <b>新用户</b>选一张官方卡片，5 秒看到今日 top 20</span>
    <span class="sep">·</span>
    <span>💡 <b>进阶</b>去 <a href="/strategies/factors.html" style="color:var(--brand)">因子广场</a> 挑因子搭组合</span>
    <span class="sep">·</span>
    <span>💬 <b>不确定</b>？去 <a href="/chat" style="color:var(--brand)">对话</a> 里问 Hunter 推荐</span>
  </div>

  <!-- 官方精选 -->
  <div class="cat-hd">
    ⭐ 官方精选 <span class="sub" id="official-sub">加载中... · 每季度重审</span>
  </div>
  <div class="strategy-grid" id="official-grid">${officialHtml}</div>

  <!-- 我的策略 -->
  <div class="cat-hd" style="margin-top:36px">
    ✎ 我的策略 <span class="sub">${mine.length ? `${mine.length} 个 · 点击查看回测` : '暂无 · 去工作台搭一个'}</span>
    ${mine.length ? `<a href="/strategies/workbench.html" style="margin-left:auto;color:var(--brand);font-size:12px">+ 新建</a>` : ''}
  </div>
  ${mineHtml}
</div>
`

// 异步用真官方策略覆盖 · 保 API 官方在最前 · mock 官方在后
;(async () => {
  const apiOfficial = await fetchOfficialFromApi()
  if (apiOfficial && apiOfficial.length > 0) {
    const grid = document.getElementById('official-grid')
    const sub = document.getElementById('official-sub')
    // API 官方 + mock 官方(合并 · API 在前 · 加"更多示例"分隔)
    const combined = renderOfficialCards(apiOfficial, true)
      + `<div style="grid-column:1/-1;padding:8px 0;color:var(--muted);font-size:11px">↓ 以下为 mock 示例(未 seed 到 DB · Phase B 补齐)</div>`
      + renderOfficialCards(OFFICIAL_STRATEGIES, false)
    grid.innerHTML = combined
    sub.textContent = `${apiOfficial.length} 个 API · ${OFFICIAL_STRATEGIES.length} 个 mock · Phase A · 每季度重审`
    bindCardClicks()
  }
})()

function bindCardClicks() {
// 卡片点击 → 载入 draft + 跳 backtest
document.querySelectorAll('.s-card').forEach(card => {
  card.addEventListener('click', () => {
    const id = card.dataset.id
    const fromApi = card.dataset.fromApi === '1'
    let strat
    if (card.dataset.mine) {
      strat = loadMine().find(m => m.id === id)
    } else if (fromApi) {
      // 从异步拿的 API 策略中找 · 简化:重取一次
      fetchOfficialFromApi().then(list => {
        const s = (list || []).find(x => String(x.id) === String(id))
        if (!s) return
        const draft = {
          factors: s.factors.map(f => f.key),
          weights: Object.fromEntries(s.factors.map(f => [f.key, f.weight_pct])),
          config: s.config,
          name: s.name,
          updated_at: Date.now(),
        }
        saveDraft(draft)
        location.href = '/strategies/backtest.html'
      })
      return
    } else {
      strat = OFFICIAL_STRATEGIES.find(s => s.id === id)
    }
    if (!strat) return
    // 灌入 draft
    const draft = {
      factors: strat.factors ? strat.factors.map(f=>f.key) : strat.factors,
      weights: strat.factors ? Object.fromEntries(strat.factors.map(f=>[f.key,f.w])) : strat.weights,
      config: strat.config,
      name: strat.name,
      _metrics: strat.metrics || strat.metrics_mock,
      updated_at: Date.now(),
    }
    saveDraft(draft)
    location.href = '/strategies/backtest.html'
  })
})
}   // end bindCardClicks
bindCardClicks()   // 初次(mock cards)
</script>
</body>
</html>
