name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract CHANGELOG for this tag
        id: notes
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [ -f CHANGELOG.md ] && awk -v v="$version" '
              /^## \[/ { in_sec = ($0 ~ "\\["v"\\]"); next }
              in_sec && /^## \[/ { exit }
              in_sec { print }
            ' CHANGELOG.md > release_notes.md && [ -s release_notes.md ]; then
            echo "Extracted notes for $version from CHANGELOG.md"
          else
            echo "No matching CHANGELOG section · falling back to auto notes"
            echo "Hunter Community Edition (AtomCode Unified) $tag" > release_notes.md
          fi
          echo '---' >> release_notes.md
          echo "Container images（amd64 + arm64 · 匿名可拉）:" >> release_notes.md
          for img in api web daemon llm-shim paper fin-worker; do
            echo '- `ghcr.io/agentpit-io/hunter-community-'"$img"':'"$tag"'`' >> release_notes.md
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
