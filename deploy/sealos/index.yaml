metadata:
  name: ${{ defaults.app_name }}-fin-worker
  annotations:
    originImageName: ghcr.io/agentpit-io/hunter-community-fin-worker:1.3.0
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-fin-worker
    app: ${{ defaults.app_name }}-fin-worker
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-fin-worker
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-fin-worker
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ${{ defaults.app_name }}-fin-worker
          image: ghcr.io/agentpit-io/hunter-community-fin-worker:1.3.0
          env:
            # 写账本只有 paper 一个入口；镜像里连 DB 驱动都没有，「不直连账本」是事实
            - name: PAPER_BASE_URL
              value: http://${{ defaults.app_name }}-paper.${{ SEALOS_NAMESPACE }}.svc:8000
            - name: API_BASE_URL
              value: http://${{ defaults.app_name }}-api.${{ SEALOS_NAMESPACE }}.svc:8000
            - name: TEMPORAL_ADDRESS
              value: ${{ defaults.app_name }}-temporal.${{ SEALOS_NAMESPACE }}.svc:7233
            - name: TEMPORAL_NAMESPACE
              value: default
            - name: TEMPORAL_TASK_QUEUE
              value: fin-trading
            - name: HUNTER_INTERNAL_KEY
              value: ${{ defaults.internal_key }}
            - name: FIN_WORKER_HTTP_PORT
              value: '8300'
            - name: FIN_SAMPLE_CODE
              value: '601398'
            - name: FIN_SAMPLE_STRATEGY_KEY
              value: sample-fixed
            - name: FIN_SAMPLE_STRATEGY_VERSION
              value: '1.0'
            - name: FIN_INTENT_TTL_SECONDS
              value: '1800'
            - name: FIN_SCHEDULES_ENABLED
              value: '1'
          ports:
            - name: http
              containerPort: 8300
          readinessProbe:
            tcpSocket:
              port: 8300
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
