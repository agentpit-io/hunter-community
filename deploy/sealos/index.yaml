          env:
            - name: NODE_ENV
              value: production
            # BFF 要回调 api 查会话归属；不传会回落 127.0.0.1:8000 → 503
            - name: HERMES_API_URL
              value: http://${{ defaults.app_name }}-api.${{ SEALOS_NAMESPACE }}.svc:8000
            # BFF 要反代到 opencode；不传会回落 127.0.0.1:3901（那是 web 自己）→ 502
