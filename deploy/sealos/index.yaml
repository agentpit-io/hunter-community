---
# ══════════════════════════════════════════════════════════════════════
# 智能交易（fin 链）· paper / temporal / temporal-ui / fin-worker
#
# · temporal 是智能交易链**唯一的上层调度权威**（六个交易时点 + 拉 K 线），
#   工作流状态存在 postgres 的 temporal / temporal_visibility 两个库，不碰业务账本。
# · paper 是全栈唯一持有账本库运行期角色 fin_paper_rw 的服务；账本**只追加** ——
#   该角色在追加表上没有任何 UPDATE / DELETE，「唯一账本」是一条 GRANT。
#   它的 initContainer `fin-init` 等 api 迁移建出角色后设运行期口令，设好 paper 才起。
# · fin-worker 是推理区 → 执行区的桥，**不直连账本**，写账本只有 paper 的 HTTP 一个入口。
# · temporal-ui 是排障面板，仅集群内。
# ══════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-paper
  annotations:
    originImageName: ghcr.io/agentpit-io/hunter-community-paper:1.3.0
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-paper
    app: ${{ defaults.app_name }}-paper
spec:
  replicas: 1
  revisionHistoryLimit: 1
  minReadySeconds: 10
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-paper
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-paper
    spec:
      automountServiceAccountToken: false
      initContainers:
        # 一次性 provision：等 api 迁移建出 fin_paper_rw → ALTER ROLE 设口令。
        # 循环重试、只在成功后退出；initContainer 失败时 K8s 会按 Pod 重启策略重跑，
        # 所以「迁移还没跑完」只会让它等，不会把 paper 永久卡住。
        - name: fin-init
          image: postgres:16-alpine
          command:
            - /bin/sh
            - -c
            - |
              until psql -tAc "SELECT rolname FROM pg_roles" 2>/dev/null | grep -qx fin_paper_rw; do
                echo '[fin-init] 等待 api 迁移创建 fin_paper_rw …'; sleep 3
              done
              until printf "ALTER ROLE fin_paper_rw WITH LOGIN PASSWORD :'pw';\n" | psql -v ON_ERROR_STOP=1 -v pw="$FIN_PAPER_PASSWORD" >/dev/null 2>&1; do
                echo '[fin-init] 设置 fin_paper_rw 口令失败，重试…'; sleep 3
              done
              echo '[fin-init] fin_paper_rw 运行期口令已就绪'
          env:
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: PGDATABASE
              value: postgres
            - name: FIN_PAPER_PASSWORD
              value: ${{ defaults.fin_paper_password }}
      containers:
        - name: ${{ defaults.app_name }}-paper
          image: ghcr.io/agentpit-io/hunter-community-paper:1.3.0
          env:
            # $(VAR) 是 K8s 的 env 互引用，只能引用**同一个列表里靠前**的项。
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: FIN_PAPER_PASSWORD
              value: ${{ defaults.fin_paper_password }}
            # 连应用库、用运行期角色 fin_paper_rw（表权限 0023 已给，只差口令）
            - name: DATABASE_URL
              value: postgresql://fin_paper_rw:$(FIN_PAPER_PASSWORD)@$(PG_HOST):5432/postgres
            - name: PAPER_MODE
              value: PAPER
            - name: HUNTER_INTERNAL_KEY
              value: ${{ defaults.internal_key }}
            # 行情来源：打 api 的 GET /api/quote/{code}；取不到就不成交（安全的一侧）
            - name: PAPER_QUOTE_URL
              value: http://${{ defaults.app_name }}-api.${{ SEALOS_NAMESPACE }}.svc:8000
            - name: PAPER_SNAPSHOT_STALE_SECONDS
              value: '900'
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          imagePullPolicy: IfNotPresent

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-paper
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-paper
spec:
  ports:
    - port: 8000
