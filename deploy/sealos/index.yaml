kind: Service
metadata:
  name: ${{ defaults.app_name }}-temporal
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-temporal
spec:
  ports:
    - port: 7233
      targetPort: 7233
      name: grpc
  selector:
    app: ${{ defaults.app_name }}-temporal

