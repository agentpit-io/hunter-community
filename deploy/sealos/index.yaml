      containers:
        - name: ${{ defaults.app_name }}
          image: ghcr.io/agentpit-io/hunter-community-web:3.5.0
          env:
            - name: NODE_ENV
              value: production
            - name: AGENT_BACKEND
              value: atomcode
            - name: HERMES_API_URL
              value: http://${{ defaults.app_name }}-api.${{ SEALOS_NAMESPACE }}.svc:8000
            - name: ATOMCODE_DAEMON_URL
              value: http://${{ defaults.app_name }}-daemon.${{ SEALOS_NAMESPACE }}.svc:13456
            - name: OPENCODE_URL
              value: http://${{ defaults.app_name }}-daemon.${{ SEALOS_NAMESPACE }}.svc:13456
            - name: HUNTER_INTERNAL_KEY
              value: ${{ defaults.internal_key }}
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet:
              path: /
              port: 3000
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          imagePullPolicy: IfNotPresent

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: ${{ defaults.app_name }}

---
# ══════════════════════════════════════════════════════════════════════
# 智能交易（fin 链）· paper / temporal / temporal-ui / fin-worker
# ══════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-paper
  annotations:
    originImageName: ghcr.io/agentpit-io/hunter-community-paper:3.5.0
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-paper
    app: ${{ defaults.app_name }}-paper
spec:
  replicas: 1
  revisionHistoryLimit: 1
  minReadySeconds: 10
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-paper
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-paper
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: fin-init
          image: postgres:16-alpine
          command:
            - /bin/sh
            - -c
            - |
              until psql -tAc "SELECT rolname FROM pg_roles" 2>/dev/null | grep -qx fin_paper_rw; do
                echo '[fin-init] 等待 api 迁移创建 fin_paper_rw …'; sleep 3
              done
              until printf "ALTER ROLE fin_paper_rw WITH LOGIN PASSWORD :'pw';\n" | psql -v ON_ERROR_STOP=1 -v pw="$FIN_PAPER_PASSWORD" >/dev/null 2>&1; do
                echo '[fin-init] 设置 fin_paper_rw 口令失败，重试…'; sleep 3
              done
              echo '[fin-init] fin_paper_rw 运行期口令已就绪'
          env:
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: PGDATABASE
              value: postgres
            - name: FIN_PAPER_PASSWORD
              value: ${{ defaults.fin_paper_password }}
      containers:
        - name: ${{ defaults.app_name }}-paper
          image: ghcr.io/agentpit-io/hunter-community-paper:3.5.0
          env:
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: FIN_PAPER_PASSWORD
              value: ${{ defaults.fin_paper_password }}
            - name: DATABASE_URL
              value: postgresql://fin_paper_rw:$(FIN_PAPER_PASSWORD)@$(PG_HOST):5432/postgres
            - name: PAPER_MODE
              value: PAPER
            - name: HUNTER_INTERNAL_KEY
              value: ${{ defaults.internal_key }}
            - name: PAPER_QUOTE_URL
              value: http://${{ defaults.app_name }}-api.${{ SEALOS_NAMESPACE }}.svc:8000
            - name: PAPER_SNAPSHOT_STALE_SECONDS
              value: '900'
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          imagePullPolicy: IfNotPresent

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-paper
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-paper
spec:
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: ${{ defaults.app_name }}-paper

