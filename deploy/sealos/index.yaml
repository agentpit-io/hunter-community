# temporal · 智能交易链唯一的上层调度权威
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-temporal
  annotations:
    originImageName: temporalio/auto-setup:1.25
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-temporal
    app: ${{ defaults.app_name }}-temporal
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-temporal
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-temporal
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ${{ defaults.app_name }}-temporal
          image: temporalio/auto-setup:1.25
          env:
            - name: DB
              value: postgres12
            - name: DB_PORT
              value: '5432'
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: POSTGRES_SEEDS
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: DBNAME
              value: temporal
            - name: VISIBILITY_DBNAME
              value: temporal_visibility
          ports:
            - name: grpc
              containerPort: 7233
          startupProbe:
            tcpSocket:
              port: 7233
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 7233
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          imagePullPolicy: IfNotPresent

