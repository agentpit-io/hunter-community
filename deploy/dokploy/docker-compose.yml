# HunterCode Community Edition · Dokploy 用编排
# ══════════════════════════════════════════════════════════════════════
# 用法：Dokploy → Project → Create Service → **Compose** → Provider 选 Raw
#       → 把这份文件整个粘进 Compose File → 到 **Environment** 页签填两个变量
#       → **Domains** 页签给 web 服务加域名（Container Port 填 3000）→ Deploy。
#       详细步骤见
#       https://github.com/agentpit-io/hunter-community/blob/main/docs/deploy/coolify-dokploy.md
#
# ⚠️ **Dokploy 不会把 Environment 页签里的变量自动注入容器**（官方文档原文：
#    "Environment variables set in the UI are written to the `.env` file, but are
#    **not automatically injected into containers**"）。它写的是同目录的 `.env`，
#    而 compose 的 `${VAR}` 插值**读的正是这个 .env** —— 所以下面这种写法是对的，
#    不需要额外的 env_file。
#
# Environment 页签里要填的**四个**：
#
#     POSTGRES_PASSWORD=<自己生成，如 openssl rand -hex 24>
#     HUNTER_SETUP_TOKEN=<自己生成，如 openssl rand -hex 12>
#     FIN_PAPER_PASSWORD=<自己生成，如 openssl rand -hex 24>    # 账本库运行期角色
#     HUNTER_INTERNAL_KEY=<自己生成，如 openssl rand -hex 24>   # 服务间共享口令
#
# Dokploy 没有 Coolify 那种「magic 变量」自动生成随机值，所以这四个要自己生成。
# **不要留空**：HUNTER_SETUP_TOKEN 为空 = 公网上谁先打开谁就能配大模型。
# （HUNTER_INTERNAL_KEY 这里独立成一个变量，而不是像 Coolify 那样靠密钥卷共享：
#  智能交易的 paper / fin-worker 只认环境变量、不读密钥卷，必须由模板显式给全
#  api / web / opencode / paper / fin-worker 五个服务。）
#
# 其余与 Coolify 版完全一致（同镜像、同环境变量、同卷、同依赖），
# 差别只有「随机值谁来生成」和域名的绑定方式。
#
# ── 智能交易（fin 链）· paper / temporal / temporal-ui / fin-worker / fin-init ──
# 与仓库根 docker-compose.yml 的 `fin` profile 等价，这里默认常开：
#   · temporal     智能交易链**唯一的上层调度权威**（六个交易时点 + 拉 K 线），
#                  工作流状态存在 postgres 的 temporal 库，不碰业务账本。
#   · paper        全栈唯一持有账本库运行期角色 fin_paper_rw 的服务；账本**只追加** ——
#                  该角色在追加表上没有任何 UPDATE / DELETE，「唯一账本」是一条 GRANT。
#   · fin-worker   推理区 → 执行区的桥，**不直连账本**，写账本只有 paper 的 HTTP 一个入口。
#   · temporal-ui  排障面板，仅内网。
#   · fin-init     一次性服务：等 api 迁移建出 fin_paper_rw 后给它设运行期口令，
#                  paper 等它跑完才起（没有任何平台需要人工 provision）。
services:
  # ── web · 本应用唯一对外的服务（在 Domains 页签里选它）────────
  web:
    image: ghcr.io/agentpit-io/hunter-community-web:1.3.0
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      opencode:
        condition: service_started
    environment:
      # 域名不在这里配 —— Dokploy 在 Domains 页签里选服务 web + Container Port 3000，
      # 部署时自动往这个服务加 Traefik 标签并把它接进 dokploy-network，
      # 不需要你写 labels，也不需要 ports:（官方文档 Method 1）。
      NODE_ENV: production
      # BFF 要回调 api 查会话归属；不传会回落 127.0.0.1:8000 → 503
      HERMES_API_URL: http://api:8000
      # BFF 要反代到 opencode；不传会回落 127.0.0.1:3901（那是 web 自己）→ 502
      OPENCODE_URL: http://opencode:3901
      OPENCODE_SERVER_USERNAME: ""
      OPENCODE_SERVER_PASSWORD: ""
      # 与 api / opencode / paper / fin-worker 同值（BFF 调 /api/internal/* 要用）
      HUNTER_INTERNAL_KEY: ${HUNTER_INTERNAL_KEY}
    volumes:
      # 只读 · web 的 BFF 调 /api/internal/ocr/extract 要和 api 用同一把
      # HUNTER_INTERNAL_KEY，否则「上传图片没反应」（其实是 401）
      - hunter_secrets:/opt/hunter-secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ── api · 后端 + 自动迁移 + 首启向导 ─────────────────────────
  api:
    image: ghcr.io/agentpit-io/hunter-community-api:1.3.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      HUNTER_MINIMAL_BOOT: "1"
      DATABASE_URL: postgresql://hunter:${POSTGRES_PASSWORD}@postgres:5432/hunter
      REDIS_URL: redis://redis:6379/0
      # ⚠️ 与 web / opencode / paper / fin-worker 必须同值。这里**显式注入而不走
      #    密钥卷** —— 智能交易的 paper / fin-worker 只读环境变量、不读密钥卷。
      HUNTER_INTERNAL_KEY: ${HUNTER_INTERNAL_KEY}
      # 首启向导第 0 步的初始化口令。**必须非空** —— 公网上不设口令等于
      # 谁先打开谁就能配大模型、看别人的 key。部署后在 Environment Variables 里查。
      HUNTER_SETUP_TOKEN: ${HUNTER_SETUP_TOKEN}
      # ⚠️ 公网部署必须是 0。单用户模式不要账号密码，开着等于谁都能拿到 admin
      HUNTER_SINGLE_USER: "0"
      # open = 允许注册，第一个注册的账号自动是管理员。建好管理员后
      # 建议在 Coolify 里改成 closed 再 Redeploy。
      REGISTRATION_MODE: open
      JWT_ACCESS_TTL: "3600"
      JWT_REFRESH_TTL: "2592000"
      # 独立运行模式 · 不指回项目方的演示站
      HUNTER_UPSTREAM_URL: ""
      # 留空即可 · 聊天用你自己的大模型 key。想解锁全部行情工具再到
      # https://hunter.agentpit.io/dev/api-keys 免费申请
      HUNTER_API_KEY: ""
      LLM_PROVIDER: openai_compat
      HUNTER_SKILLS_DIR: /opt/hunter-skills
      HUNTER_USER_SKILLS_DIR: /opt/hunter-user-skills
      OPENCODE_URL: http://opencode:3901
      # ⚠️ **api 也必须知道 shim 在哪**，不是只有 opencode 需要：向导保存后 api 走
      # PATCH /global/config 把 provider 的 baseURL 推给 opencode，推的就是这个值。
      LLM_SHIM_URL: http://llm-shim:3999/v1
    volumes:
      - hunter_user_skills:/opt/hunter-user-skills
      - hunter_packages:/opt/hunter-packages
      # 自动生成的密钥 · api 可写（它是写方），web / opencode 只读挂同一个卷
      - hunter_secrets:/opt/hunter-secrets
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 3 http://127.0.0.1:8000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

  # ── opencode · 对话内核（会话正文在卷里）─────────────────────
  opencode:
    image: ghcr.io/agentpit-io/hunter-community-opencode:1.3.0
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      llm-shim:
        condition: service_healthy
    environment:
      HERMES_API_URL: http://api:8000
      LLM_PROVIDER: openai_compat
      LLM_SCHEMA_SANITIZE: auto
      LLM_SHIM_URL: http://llm-shim:3999/v1
      # 审计日志写进卷内 —— 放 /tmp 的话一次重建就没，而审计的全部意义就是留痕
      HUNTER_AUDIT_PATH: /home/hunter/.local/share/hunter-audit/AUDIT.jsonl
      # 自部署用户付的是自己的大模型账单，不该被限额
      HUNTER_BUDGET_ENABLED: "false"
      # 与 api / web / paper / fin-worker 同值
      HUNTER_INTERNAL_KEY: ${HUNTER_INTERNAL_KEY}
    volumes:
      # ⚠️ 会话正文（opencode-local.db · 所有对话内容）必须落在卷上。
      #    2026-09-07 事故：没挂卷时一次容器重建让 33 个用户会话全部消失且不可恢复 ——
      #    postgres 里只有 session_id↔user_id 的归属映射，正文一个字都不在里面。
      - hunter_opencode:/home/hunter/.local
      - hunter_secrets:/opt/hunter-secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -o /dev/null --max-time 3 http://127.0.0.1:3901/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ── llm-shim · tool schema 清洗层 ───────────────────────────
  # opencode 送出的是完整 JSON Schema，Gemini 只认 OpenAPI 子集。
  # 用非 Gemini 模型时这个容器空转，不影响任何东西。
  llm-shim:
    image: ghcr.io/agentpit-io/hunter-community-llm-shim:1.3.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request as u;u.urlopen('http://127.0.0.1:3999/health',timeout=3)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ── postgres ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hunter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hunter
    volumes:
      - hunter_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hunter"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - hunter_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── fin-init · 一次性 provision 账本库运行期角色 ─────────────────
  # `0023_fin_core.sql` 建 `fin_paper_rw` 时**故意不写密码**（密码不进仓库），
  # 而 paper 要经 TCP + 口令认证连库。这里等 api 迁移把角色建出来（循环重试、
  # 不成功不退出），再 `ALTER ROLE … PASSWORD`。**不依赖启动顺序**。
  fin-init:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: hunter
      PGDATABASE: hunter
      # 迁移执行者（api 用的）管理员口令 · 与 postgres/api 同源
      PGPASSWORD: ${POSTGRES_PASSWORD}
      # 运行期角色的口令 · 与下面 paper 的 DATABASE_URL 同源（同一个变量）
      FIN_PAPER_PASSWORD: ${FIN_PAPER_PASSWORD}
    command:
      - /bin/sh
      - -c
      - |
        until psql -tAc "SELECT rolname FROM pg_roles" 2>/dev/null | grep -qx fin_paper_rw; do
          echo '[fin-init] 等待 api 迁移创建 fin_paper_rw …'; sleep 3
        done
        until printf "ALTER ROLE fin_paper_rw WITH LOGIN PASSWORD :'pw';\n" | psql -v ON_ERROR_STOP=1 -v pw="$FIN_PAPER_PASSWORD" >/dev/null 2>&1; do
          echo '[fin-init] 设置 fin_paper_rw 口令失败，重试…'; sleep 3
        done
        echo '[fin-init] fin_paper_rw 运行期口令已就绪'

  # ── paper · 唯一账本服务（只追加）─────────────────────────────────
  paper:
    image: ghcr.io/agentpit-io/hunter-community-paper:1.3.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      fin-init:
        # 等 fin-init 真把运行期口令设好，paper 才起（自检不过会直接退出）
        condition: service_completed_successfully
    environment:
      # 连应用库、用运行期角色 fin_paper_rw（表权限 0023 已给，只差口令）
      DATABASE_URL: postgresql://fin_paper_rw:${FIN_PAPER_PASSWORD}@postgres:5432/hunter
      PAPER_MODE: PAPER
      HUNTER_INTERNAL_KEY: ${HUNTER_INTERNAL_KEY}
      # 行情来源：打 api 的 GET /api/quote/{code}；取不到就不成交（安全的一侧）
      PAPER_QUOTE_URL: http://api:8000
      PAPER_SNAPSHOT_STALE_SECONDS: "900"

  # ── temporal · 智能交易链唯一的上层调度权威 ─────────────────────
  # auto-setup 在同一个 postgres 上自建 temporal / temporal_visibility 两个库，
  # 不碰业务账本（工作流状态不代替业务账本）。
  temporal:
    image: temporalio/auto-setup:1.25
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: hunter
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    healthcheck:
      # 地址必须是**服务名**：temporal-server 只绑容器网卡，写 127.0.0.1 永远连不上
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 12

  # ── temporal-ui · 排障面板（仅内网，不对外）──────────────────────
  temporal-ui:
    image: temporalio/ui:2.34.0
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8233
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  # ── fin-worker · 推理区 → 执行区的桥（不直连账本）────────────────
  fin-worker:
    image: ghcr.io/agentpit-io/hunter-community-fin-worker:1.3.0
    restart: unless-stopped
    depends_on:
      paper:
        condition: service_started
      temporal:
        condition: service_started
    environment:
      # 写账本只有 paper 一个入口；镜像里连 DB 驱动都没有，「不直连账本」是事实
      PAPER_BASE_URL: http://paper:8000
      API_BASE_URL: http://api:8000
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: fin-trading
      HUNTER_INTERNAL_KEY: ${HUNTER_INTERNAL_KEY}
      FIN_WORKER_HTTP_PORT: "8300"
      FIN_SAMPLE_CODE: "601398"
      FIN_SAMPLE_STRATEGY_KEY: sample-fixed
      FIN_SAMPLE_STRATEGY_VERSION: "1.0"
      FIN_INTENT_TTL_SECONDS: "1800"
      FIN_SCHEDULES_ENABLED: "1"

volumes:
  hunter_pg:
  hunter_redis:
  hunter_opencode:
  hunter_user_skills:
  hunter_packages:
  hunter_secrets:
