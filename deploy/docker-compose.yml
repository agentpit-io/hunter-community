# HunterCode · AtomCode 发行版（HCA）· compose
#
# 项目名固定 hca（up.sh 里 -p hca），**不要和测试机上另一条链路的
# hunter / hunter-community 两个项目混在一起**。
#
# 服务（M3 起六个）：
#   daemon    —— AtomCode 5.1.0 + 投研 MCP / 技能 / hook
#   llm-shim  —— 补回并行 tool_calls 缺失的 index（M0 §11.2/§11.4）
#   web       —— HunterCode 的 Next.js 前端 + BFF，AGENT_BACKEND=atomcode
#   api       —— HunterCode 后端（会话归属 / 用户 / 持仓 / Kronos / 六个 hunter 系 MCP 的上游）
#   postgres / redis —— api 的依赖
#
# 端口（总控端口表，唯一对公网的是 web）：
#   web 3200 → 0.0.0.0    api 8200 → 127.0.0.1    其余一律不发布到宿主
#
# ⚠️ web 对公网，所以**必须关掉单用户免登录**（HUNTER_SINGLE_USER=0）并设
# HUNTER_SETUP_TOKEN；up.sh 会检查，不满足直接拒绝启动。

name: hca

services:
  daemon:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.daemon
      args:
        # 国内网络（TP-08）：镜像前缀 / npm 源 / pip 源。留空 = 官方源，与以前一致。
        BASE_IMAGE_PREFIX: "${HCA_BASE_IMAGE_PREFIX:-}"
        NPM_REGISTRY: "${HCA_NPM_REGISTRY:-}"
        PIP_INDEX_URL: "${HCA_PIP_INDEX_URL:-}"
    # `HCA_DAEMON_VARIANT=-fork` 换成自编 fork 那一层（deploy/fork-image.sh 建的，
    # 自带一道 sha256，值来自 pins.lock 的 [atomcode.fork]）。留空 = 官方二进制。
    # 为什么用变量拼名字而不是再加一个 compose 覆盖文件：up.sh / install.sh 里
    # `-f` 的组合已经有四处，多一个文件就多一处「忘了带上它」的机会。
    image: hca-daemon:${HCA_IMAGE_TAG:-dev}${HCA_DAEMON_VARIANT:-}
    container_name: ${HCA_COMPOSE_PROJECT:-hca}-daemon
    restart: unless-stopped
    # 本地 Ollama 通道要用 http://host.docker.internal:11434/v1 访问宿主。
    # macOS/Windows 的 Docker Desktop 自带这个名字，**Linux 上没有** —— 少了这一行，
    # Ollama 通道在 Linux 上直接是「网页能开、发消息没回答」。
    # `部署与运维.md` 从 M4 起就写着「compose 里的 extra_hosts（已配）」，而它一直没配（M5 补）。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 不写 ports: —— 故意的。daemon 只在 compose 内网上听
    # http://daemon:${HCA_DAEMON_PORT}，鉴权走 Bearer token（见 token 卷）。
    expose:
      - "${HCA_DAEMON_PORT:-13456}"
    environment:
      HCA_DAEMON_PORT: "${HCA_DAEMON_PORT:-13456}"
      HCA_DAEMON_INTERNAL_PORT: "${HCA_DAEMON_INTERNAL_PORT:-13457}"
      HCA_DAEMON_SERVICE_NAME: daemon
      HCA_WORKSPACE: /workspace
      ATOMCODE_HOME: /data/atomcode
      HCA_WORKSPACE_REFRESH: "${HCA_WORKSPACE_REFRESH:-1}"
      HCA_CONFIG_REFRESH: "${HCA_CONFIG_REFRESH:-1}"
      # 用不上的数据源可以整个关掉（I2）：逗号分隔的 MCP server 名，
      # 铺 .mcp.json 时去掉。关一个就少一份工具 schema —— 实测 9 个 MCP 的 28 个
      # 工具在每轮请求里占 2 万多字节。默认空 = 全挂。
      HCA_MCP_DISABLE: "${HCA_MCP_DISABLE-}"
      # hook 常驻服务（I2）：0 = 退回「每次 hook 起一个 python」。
      # 端口只在容器内回环上听，不发布到宿主。
      HCA_HOOKD: "${HCA_HOOKD:-1}"
      HCA_HOOKD_PORT: "${HCA_HOOKD_PORT:-13458}"

      # ── 领域改造开关（M2）──────────────────────────────────────────────
      # 默认值与镜像里的 ENV 一致，写在这里只是为了**不重建镜像也能改**
      # （改完 `docker compose up -d daemon` 即生效）。每一个的依据见
      # docs/coding-bias-analysis.md 的「可用的关闭手段」一列。
      ATOMCODE_VERIFY: "${ATOMCODE_VERIFY:-off}"
      ATOMCODE_TODO: "${ATOMCODE_TODO:-0}"
      ATOMCODE_SUBAGENT: "${ATOMCODE_SUBAGENT:-0}"
      ATOMCODE_MEMORY_TOOL: "${ATOMCODE_MEMORY_TOOL:-0}"
      ATOMCODE_REQUEST_USER_INPUT: "${ATOMCODE_REQUEST_USER_INPUT:-0}"
      ATOMCODE_TURN_MAX_ROUNDS: "${ATOMCODE_TURN_MAX_ROUNDS:-30}"
      # 会话自动起名（I2）：一轮对话结束后上游**再发一次模型请求**给会话起标题。
      # I2 实测那一次请求要 3.8 秒（q3 全程 19.5 秒里的一段），而本发行版的会话
      # 标题由 Web 侧自己管，这一跳纯属白付。默认关；想要上游行为设成 1。
      ATOMCODE_AI_SESSION_NAMING: "${ATOMCODE_AI_SESSION_NAMING:-0}"

      # 模型通道
      HCA_LLM_BASE_URL: "${HCA_LLM_BASE_URL:-http://llm-shim:3999/v1}"
      HCA_LLM_MODEL: "${HCA_LLM_MODEL:-hunter-chat}"
      HCA_LLM_PROVIDER_NAME: "${HCA_LLM_PROVIDER_NAME:-hunter}"
      HCA_LLM_CONTEXT_WINDOW: "${HCA_LLM_CONTEXT_WINDOW:-1000000}"
      HCA_LLM_API_KEY: "${HCA_LLM_API_KEY:-}"
      HCA_LLM_API_KEY_FILE: "${HCA_LLM_API_KEY_FILE:-}"

      # ── 只有 fork 二进制认的三个提速参数（I2，见 docs/fork-patches.md）──────
      # 官方 5.1.0 上留空即可：这三个都**只在非空时才写进 config.toml**，
      # 所以同一份 compose 既能跑官方二进制、也能跑 fork。
      #
      #   HCA_LLM_SYSTEM_PROMPT_FILE  整体替换内置编码人设的文件（容器内路径）
      #   HCA_TOOLS_ALLOW / _DENY     工具**挂载**白/黑名单，逗号分隔。
      #                               精确名 / `mcp__x__*` / `group:coding`
      #                               `group:codeintel` `group:atomgit`
      #                               `group:skills` `group:subagent` `group:mcp`
      HCA_LLM_SYSTEM_PROMPT_FILE: "${HCA_LLM_SYSTEM_PROMPT_FILE:-}"
      HCA_TOOLS_ALLOW: "${HCA_TOOLS_ALLOW:-}"
      HCA_TOOLS_DENY: "${HCA_TOOLS_DENY:-}"

      # MCP 依赖（.mcp.json 里的 ${VAR} 由 hca-init.py 用这些值渲染）
      HERMES_API_URL: "${HERMES_API_URL:-http://api:8000}"
      FIN_WORKER_URL: "${FIN_WORKER_URL:-http://fin-worker:8300}"
      HUNTER_INTERNAL_KEY: "${HUNTER_INTERNAL_KEY:-}"
      HUNTER_USER_ID: "${HUNTER_USER_ID:-}"
      AKSHARE_MAX_ROWS: "${AKSHARE_MAX_ROWS:-50}"
      # 字节预算：AtomCode 内核对超过 16 KB 的工具返回会砍成头尾各 4 KB
      # 且 JSON 语法断裂（待办池 P0-11）。这两个闸把返回压到阈值以下，
      # 并且裁了多少会明说，模型就不会拿记忆补中间那段。
      AKSHARE_MAX_BYTES: "${AKSHARE_MAX_BYTES:-15000}"
      HCA_MCP_MAX_BYTES: "${HCA_MCP_MAX_BYTES:-15000}"
      KRONOS_API_KEY: "${KRONOS_API_KEY:-}"
      HUNTER_API_KEY: "${HUNTER_API_KEY:-}"

      # ── hook 的开关与参数（M4 · 五个 hook，见 docs/hooks-design.md）────────
      # 语言硬约束（承接 opencode 的 hunter-lang 插件的提示词侧），默认开
      HCA_LANG_HOOK: "${HCA_LANG_HOOK:-1}"
      # context hook 是否注入「本部署当前不可用的数据能力」（默认开，见 docs/部署与运维.md §6.3）。
      # 判据只有一条：下面那几把密钥是不是空的 —— 空就是「那一族工具调用必失败」，
      # 这个事实容器自己知道，不必让模型先调一次工具拿报错（那是一整轮模型）。
      HCA_CTX_CAPABILITIES: "${HCA_CTX_CAPABILITIES:-1}"
      # 审计：日志路径留空 = 工作区 .atomcode/audit.jsonl；超过 MAX_MB 轮转一代
      HCA_AUDIT_LOG: "${HCA_AUDIT_LOG:-}"
      HCA_AUDIT_MAX_MB: "${HCA_AUDIT_MAX_MB:-64}"
      HCA_AUDIT_RESP_HEAD: "${HCA_AUDIT_RESP_HEAD:-200}"
      # 可选异步上报（留空 = 不上报）。子进程脱离进程组去 POST，不占 hook 的 timeout
      HCA_AUDIT_WEBHOOK: "${HCA_AUDIT_WEBHOOK:-}"
      HCA_AUDIT_WEBHOOK_TOKEN: "${HCA_AUDIT_WEBHOOK_TOKEN:-}"
      # 预算：**默认关**（计划 v0.2 TP-05「默认关，与现状一致」）。
      # 开了才记账、才会在 UserPromptSubmit 拦；三个上限 0 = 不限
      HCA_BUDGET_ENABLED: "${HCA_BUDGET_ENABLED:-0}"
      HCA_BUDGET_DAILY_TOKENS: "${HCA_BUDGET_DAILY_TOKENS:-0}"
      HCA_BUDGET_DAILY_TOOL_CALLS: "${HCA_BUDGET_DAILY_TOOL_CALLS:-0}"
      HCA_BUDGET_SESSION_TOOL_CALLS: "${HCA_BUDGET_SESSION_TOOL_CALLS:-0}"
      HCA_QUOTA_URL: "${HCA_QUOTA_URL:-https://hunter.agentpit.io/api/saas/llm/quota}"
    volumes:
      - workspace:/workspace
      - atomcode-home:/data
      # daemon 自己生成的 token 由 entrypoint 抄到这里，M2 的 web/api 只读挂载它
      - daemon-token:/run/hca
      # 宿主上的密钥目录，只读。里面放 llm-key 之类的文件
      - "${HCA_SECRETS_DIR:-./secrets}:/run/secrets:ro"
    depends_on:
      llm-shim:
        condition: service_healthy
    # AtomCode 会起 bash 子进程、9 个 MCP 子进程，僵尸进程要有人收
    init: true
    security_opt:
      - no-new-privileges:true
    labels:
      hca.component: daemon

  llm-shim:
    build:
      context: ..
      dockerfile: deploy/llm-shim.Dockerfile
      args:
        BASE_IMAGE_PREFIX: "${HCA_BASE_IMAGE_PREFIX:-}"
    image: hca-llm-shim:${HCA_IMAGE_TAG:-dev}
    container_name: ${HCA_COMPOSE_PROJECT:-hca}-llm-shim
    restart: unless-stopped
    expose:
      - "3999"
    environment:
      LLM_BASE_URL: "${HCA_LLM_UPSTREAM_URL:-https://hunter.agentpit.io/api/saas/llm/v1}"
      # 并行 tool_calls 补 index —— 这就是 M1 带上 shim 的唯一理由，别关
      LLM_FIX_TOOL_INDEX: "1"
      # think 标签剥离：接 Gemini 系网关时用不到，但关掉没好处，保持默认
      LLM_STRIP_THINK: "1"
      # ── 工具白名单（I2）───────────────────────────────────────────────
      #
      # AtomCode 把编码工具、代码智能工具、AtomGit REST 工具**无条件** mount 给模型
      # （assemble.rs:225 的 mount_coding_tools，没有 config 也没有环境变量能关），
      # 而投研场景里下面这些一次都用不上、却每一轮请求都要重发一遍 schema。
      # I2 实测：一轮 59 个工具、schema 合计 59 885 字节；下面这 17 个占 17 407 字节（29%）。
      #
      # 摘掉只发生在 llm-shim 这一跳（模型看不见），**内核那边仍然注册着** ——
      # 真要用的时候不会出现「说有却调不动」。想恢复上游行为：设成空串。
      #
      #   · atomgit_*        研究工作区没有 AtomGit 仓库
      #   · 代码智能一族      工作区里没有代码要分析（scripts/ 由 guard 禁写）
      #   · list_sessions / schedule_wakeup / recall
      #                      单会话研究场景用不上；recall 是记忆检索，
      #                      与已经关掉的 ATOMCODE_MEMORY_TOOL=0 同一个意图
      LLM_TOOL_DENY: "${HCA_LLM_TOOL_DENY-atomgit_*,code_review,ast_grep,read_symbol,list_symbols,find_references,trace_callers,trace_callees,trace_chain,blast_radius,file_dependencies,lsp,list_sessions,schedule_wakeup,recall}"
    init: true
    security_opt:
      - no-new-privileges:true
    labels:
      hca.component: llm-shim


  # ── 界面（M3 · 计划 v0.2 TP-06 方案 B）────────────────────────────────────
  #
  # 镜像在**测试机**构建，不在开发机（总控：开发机严禁跑 Next.js 构建）。
  # up.sh 走 flock ~/.hca-heavy.lock 串行化，并在构建前查内存。
  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        NODE_OPTIONS: "${HCA_WEB_BUILD_NODE_OPTIONS:---max-old-space-size=3072}"
        BASE_IMAGE_PREFIX: "${HCA_BASE_IMAGE_PREFIX:-}"
        NPM_REGISTRY: "${HCA_NPM_REGISTRY:-}"
    image: hca-web:${HCA_IMAGE_TAG:-dev}
    container_name: ${HCA_COMPOSE_PROJECT:-hca}-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      daemon:
        condition: service_started
    environment:
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      # ⭐ 这一行就是 TP-06 方案 B 的开关。留空/opencode = 走原来的 opencode 转发。
      AGENT_BACKEND: atomcode
      ATOMCODE_DAEMON_URL: "http://daemon:${HCA_DAEMON_PORT:-13456}"
      # daemon 的 token 是它**自己启动时生成**的，compose 写不进去，只能读共享卷
      ATOMCODE_TOKEN_FILE: /run/hca/daemon-token
      ATOMCODE_WORKSPACE: /workspace
      # 模型选择器上给人看的名字（不影响请求用的模型 ID，见 apps/web/app/lib/atomcode/labels.ts）。
      # 留空 = 显示原始 ID（hunter-chat / oneapi）。
      HCA_LLM_MODEL_LABEL: "${HCA_LLM_MODEL_LABEL:-}"
      HCA_LLM_PROVIDER_LABEL: "${HCA_LLM_PROVIDER_LABEL:-}"
      # 单轮上限。比 route.ts 的 maxDuration=600 稍短，让 BFF 自己先收尾、
      # 给出「超时了」而不是被 Next 掐断连接
      ATOMCODE_TURN_TIMEOUT_MS: "${HCA_TURN_TIMEOUT_MS:-570000}"
      # BFF 回调 api 查会话归属 / 用户画像 / OCR
      HERMES_API_URL: http://api:8000
      HUNTER_INTERNAL_KEY: "${HUNTER_INTERNAL_KEY:-}"
    # daemon 的 token 是 0640 hca:hca（gid 10001），而 web 镜像里跑的是 nextjs
    # (uid 1001, gid 65533)。把 10001 加成 web 的附加组，token 保持 0640 不放宽，
    # web 也读得到。（首次部署时漏了这条，web 起来是 healthy 的，但每次调 daemon
    # 都 EACCES —— 健康检查只看首页，看不出这一跳，见 M3 报告 §3.2）
    group_add:
      - "10001"
    volumes:
      # daemon 的 token，只读
      - daemon-token:/run/hca:ro
      # api 自动生成的 JWT_SECRET / HUNTER_INTERNAL_KEY（entrypoint.sh 会读回来）
      - hunter-secrets:/opt/hunter-secrets:ro
    ports:
      # **唯一对公网的端口**
      - "${HCA_WEB_HOST_PORT:-3200}:3000"
    init: true
    security_opt:
      - no-new-privileges:true
    labels:
      hca.component: web

  # ── HunterCode 后端 ──────────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: hca-api:${HCA_IMAGE_TAG:-dev}
    container_name: ${HCA_COMPOSE_PROJECT:-hca}-api
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$${LLM_API_KEY:-}" ] && [ -n "$${LLM_API_KEY_FILE:-}" ]; then
          if [ -r "$${LLM_API_KEY_FILE}" ]; then
            LLM_API_KEY="$$(tr -d '\r\n' < "$${LLM_API_KEY_FILE}")"
            export LLM_API_KEY
            echo "[hca-api-entry] 模型 key 取自文件 $${LLM_API_KEY_FILE}（长度 $${#LLM_API_KEY}）"
          else
            echo "[hca-api-entry] ⚠ LLM_API_KEY_FILE=$${LLM_API_KEY_FILE} 读不到（不存在或没权限）——" \
                 "api 会认为大模型未配置，网页登录后会一直跳 /setup"
          fi
        fi
        if [ "$$#" -gt 0 ]; then exec "$$@"; else exec /app/boot.sh; fi
      - hca-api-entry
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      HUNTER_BIND_HOST: "0.0.0.0"
      HUNTER_MINIMAL_BOOT: "1"
      DATABASE_URL: postgresql://hunter:${HCA_PG_PASSWORD:?deploy/.env 里必须给一个随机口令}@postgres:5432/hunter
      FIN_PAPER_PASSWORD: "${FIN_PAPER_PASSWORD:-}"
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: "${HCA_JWT_SECRET:-}"
      # ⚠️ 对公网就必须关单用户免登录 + 设初始化口令（总控端口与暴露一节）
      HUNTER_SINGLE_USER: "${HUNTER_SINGLE_USER:-0}"
      HUNTER_SETUP_TOKEN: "${HUNTER_SETUP_TOKEN:?deploy/.env 里必须给一个随机值}"
      REGISTRATION_MODE: "${REGISTRATION_MODE:-invite}"
      HUNTER_ADMIN_EMAILS: "${HUNTER_ADMIN_EMAILS:-}"
      HUNTER_INTERNAL_KEY: "${HUNTER_INTERNAL_KEY:-}"
      HUNTER_API_KEY: "${HUNTER_API_KEY:-}"
      # 模型通道：与 daemon 同一个网关、同一把 key、同一个模型
      LLM_PROVIDER: openai_compat
      LLM_BASE_URL: "${HCA_LLM_UPSTREAM_URL:-https://hunter.agentpit.io/api/saas/llm/v1}"
      LLM_API_KEY: "${HCA_LLM_API_KEY:-}"
      LLM_API_KEY_FILE: "${HCA_LLM_API_KEY_FILE:-}"
      LLM_DEFAULT_MODEL: "${HCA_LLM_MODEL:-hunter-chat}"
      LLM_SHIM_URL: "http://llm-shim:3999/v1"
      HUNTER_SKILLS_DIR: /opt/hunter-skills
      HUNTER_USER_SKILLS_DIR: /opt/hunter-user-skills
      AGENT_BACKEND: atomcode
      ATOMCODE_DAEMON_URL: "http://daemon:${HCA_DAEMON_PORT:-13456}"
      ATOMCODE_TOKEN_FILE: /run/hca/daemon-token
      OPENCODE_URL: ""
      HUNTER_MIGRATIONS_DIR: /opt/hca-migrations
      FIN_MEMORY_ENABLED: "${FIN_MEMORY_ENABLED:-1}"
      FIN_EVOLUTION_MODE: "${FIN_EVOLUTION_MODE:-paper}"
      FIN_AUTO_APPLY: "${FIN_AUTO_APPLY:-1}"
      FIN_LIVE_ORDER_ENABLED: "${FIN_LIVE_ORDER_ENABLED:-0}"
      PAPER_BASE_URL: "${PAPER_BASE_URL:-http://paper:8000}"
      FIN_WORKER_URL: "${FIN_WORKER_URL:-http://fin-worker:8300}"
    group_add:
      - "10001"
    volumes:
      - ../db/migrations:/opt/hca-migrations:ro
      - daemon-token:/run/hca:ro
      - hunter-user-skills:/opt/hunter-user-skills
      - hunter-packages:/opt/hunter-packages
      - hunter-secrets:/opt/hunter-secrets
      - hunter-experiments:/var/lib/hunter/experiments
      - "${HCA_SECRETS_DIR:-./secrets}:/run/secrets:ro"
    ports:
      - "127.0.0.1:${HCA_API_HOST_PORT:-8200}:8000"
    labels:
      hca.component: api

  # ── 智能炒股 · Paper Service（唯一账本 + 确定性风控）─────────────────────
  paper:
    build:
      context: ../apps/paper
      dockerfile: Dockerfile
    image: hca-paper:${HCA_IMAGE_TAG:-dev}
    container_name: ${HCA_COMPOSE_PROJECT:-hca}-paper
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://fin_paper_rw:${FIN_PAPER_PASSWORD:?deploy/.env 里必须有 FIN_PAPER_PASSWORD}@postgres:5432/hunter
      PAPER_MODE: PAPER
      HUNTER_INTERNAL_KEY: "${HUNTER_INTERNAL_KEY:-}"
      HUNTER_EXEC_KEY: "${HUNTER_EXEC_KEY:-}"
      PAPER_QUOTE_URL: "${PAPER_QUOTE_URL:-http://api:8000}"
      PAPER_SNAPSHOT_STALE_SECONDS: "${PAPER_SNAPSHOT_STALE_SECONDS:-900}"
    ports:
      - "127.0.0.1:${HCA_PAPER_HOST_PORT:-8220}:8000"
    labels:
      hca.component: paper

  # ── 智能炒股 · Temporal 服务端（唯一的上层调度权威）──────────────────────
  temporal:
    image: temporalio/auto-setup:1.25
    container_name: ${HCA_COMPOSE_PROJECT:-hca}-temporal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: hunter
      POSTGRES_PWD: "${HCA_PG_PASSWORD:?deploy/.env 里必须给一个随机口令}"
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    ports:
      - "127.0.0.1:${HCA_TEMPORAL_HOST_PORT:-7233}:7233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 12
    labels:
      hca.component: temporal

  # ── 智能炒股 · fin-worker（Temporal 工作流 + 控制通道）──────────────────
  fin-worker:
    build:
      context: ../apps/fin-worker
      dockerfile: Dockerfile
    image: hca-fin-worker:${HCA_IMAGE_TAG:-dev}
    container_name: ${HCA_COMPOSE_PROJECT:-hca}-fin-worker
    restart: unless-stopped
    depends_on:
      paper:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      PAPER_BASE_URL: "${PAPER_BASE_URL:-http://paper:8000}"
      API_BASE_URL: "${FIN_WORKER_API_BASE_URL:-http://api:8000}"
      TEMPORAL_ADDRESS: "${TEMPORAL_ADDRESS:-temporal:7233}"
      TEMPORAL_NAMESPACE: "${TEMPORAL_NAMESPACE:-default}"
      TEMPORAL_TASK_QUEUE: "${TEMPORAL_TASK_QUEUE:-fin-trading}"
      HUNTER_INTERNAL_KEY: "${HUNTER_INTERNAL_KEY:-}"
      HUNTER_EXEC_KEY: "${HUNTER_EXEC_KEY:-}"
      FIN_WORKER_HTTP_PORT: "8300"
      FIN_SAMPLE_CODE: "${FIN_SAMPLE_CODE:-601398}"
      FIN_SAMPLE_STRATEGY_KEY: "${FIN_SAMPLE_STRATEGY_KEY:-sample-fixed}"
      FIN_SAMPLE_STRATEGY_VERSION: "${FIN_SAMPLE_STRATEGY_VERSION:-1.0}"
      FIN_INTENT_TTL_SECONDS: "${FIN_INTENT_TTL_SECONDS:-1800}"
      FIN_SCHEDULES_ENABLED: "${FIN_SCHEDULES_ENABLED:-1}"
      FIN_REVIEW_DELAY_MINUTES: "${FIN_REVIEW_DELAY_MINUTES:-30}"
      FIN_SHADOW_DELAY_MINUTES: "${FIN_SHADOW_DELAY_MINUTES:-15}"
      FIN_OBSERVE_DELAY_MINUTES: "${FIN_OBSERVE_DELAY_MINUTES:-30}"
      FIN_PROPOSE_DELAY_MINUTES: "${FIN_PROPOSE_DELAY_MINUTES:-2}"
      FIN_MEMORY_ENABLED: "${FIN_MEMORY_ENABLED:-1}"
      FIN_EVOLUTION_MODE: "${FIN_EVOLUTION_MODE:-paper}"
      FIN_AUTO_APPLY: "${FIN_AUTO_APPLY:-1}"
      FIN_LIVE_ORDER_ENABLED: "${FIN_LIVE_ORDER_ENABLED:-0}"
    ports:
      - "127.0.0.1:${HCA_FIN_WORKER_HOST_PORT:-8320}:8300"
    labels:
      hca.component: fin-worker

  postgres:
    image: postgres:16-alpine
    container_name: ${HCA_COMPOSE_PROJECT:-hca}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hunter
      POSTGRES_PASSWORD: "${HCA_PG_PASSWORD:?deploy/.env 里必须给一个随机口令}"
      POSTGRES_DB: hunter
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hunter"]
      interval: 5s
      timeout: 3s
      retries: 30
    labels:
      hca.component: postgres

  redis:
    image: redis:7-alpine
    container_name: ${HCA_COMPOSE_PROJECT:-hca}-redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    labels:
      hca.component: redis

volumes:
  workspace:
    labels:
      hca.component: workspace
  atomcode-home:
    labels:
      hca.component: atomcode-home
  daemon-token:
    labels:
      hca.component: daemon-token
  pgdata:
    labels:
      hca.component: postgres
  redisdata:
    labels:
      hca.component: redis
  hunter-secrets:
    labels:
      hca.component: api
  hunter-user-skills:
    labels:
      hca.component: api
  hunter-packages:
    labels:
      hca.component: api
  hunter-experiments:
    labels:
      hca.component: api
