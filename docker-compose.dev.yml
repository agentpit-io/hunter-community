# Hunter Community Edition (AtomCode Unified) · 开发覆盖文件
#
#     docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# 它把自家服务的 build: 段（本地改代码、本地构建）与仓库文件 bind mount 接了回来：
#   ① 自家服务的 build: 段（本地改代码、本地构建）
#   ② 全部仓库文件 bind mount（改完不用重建镜像，`up -d` 或 `restart` 即生效）
#
# ⚠️ image: 在这里被改成了 `<名>:dev` 本地标签，防止污染正式预构建标签。

services:
  api:
    image: hunter-community-api:dev
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    volumes:
      - ./skills:/opt/hunter-skills:ro
      - ./user-skills:/opt/hunter-user-skills
      - ./data:/opt/hunter-data:ro
      - ./data-packages:/opt/hunter-packages
      - hunter_secrets:/opt/hunter-secrets

  web:
    image: hunter-community-web:dev
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    volumes:
      - ./apps/web/public:/app/public:ro

  llm-shim:
    image: hunter-community-llm-shim:dev
    build:
      context: .
      dockerfile: deploy/llm-shim.Dockerfile
    volumes:
      - ./scripts/llm-shim:/app:ro

  opencode:
    image: hunter-community-daemon:dev
    build:
      context: .
      dockerfile: deploy/Dockerfile.daemon
    volumes:
      - ./tools/opencode-mcp:/opt/hca/mcp:ro
      - ./distro/workspace-template:/opt/hca/workspace-template:ro
      - ./distro/personas:/opt/hca/personas:ro
      - hunter_workspace:/workspace
      - hunter_atomcode_home:/data
      - hunter_daemon_token:/run/hca
      - hunter_secrets:/opt/hunter-secrets:ro
